// ── Карточка записи
// Подсветка числа в строке протокола: сравниваем с нормой, если она указана рядом.
// Норму пишут по-разному, поэтому разбираем несколько привычных форм.
function num(x){ return parseFloat(String(x).replace(",", ".")); }
function markVN(v,n){
  if(v==null||n==null||n==="") return null;
  const val=num(String(v).replace(/^\s*\d{1,2}\.\d{2}(?:\.\d{2,4})?\s*(?:[:,—–-]\s*)?/,"").match(/-?\d+[.,]?\d*/)?.[0]);
  if(isNaN(val)) return null;
  const t=String(n); let lo=null,hi=null;
  let m=t.match(/^\s*(?:до|не более|менее|<)\s*(\d+[.,]?\d*)/i);
  if(m) hi=num(m[1]);
  if(hi===null){ m=t.match(/^\s*(?:от|более|>)\s*(\d+[.,]?\d*)/i); if(m) lo=num(m[1]); }
  if(hi===null&&lo===null){ m=t.match(/(\d+[.,]?\d*)\s*[–—-]\s*(\d+[.,]?\d*)/); if(m){ lo=num(m[1]); hi=num(m[2]); } }
  if(hi===null&&lo===null) return null;
  const okHi=hi===null||val<=hi, okLo=lo===null||val>=lo;
  if(okHi&&okLo){
    const edge=(hi!==null&&val>=hi*0.95)||(lo!==null&&val<=lo*1.05);
    return edge?{c:"var(--warn)",why:"на границе нормы"}:{c:"var(--ok)",why:"в норме"};
  }
  const ref=hi!==null&&val>hi?hi:lo;
  return Math.abs(val-ref)/(Math.abs(ref)||1)<=0.1
    ? {c:"var(--warn)",why:"немного вне нормы"} : {c:"var(--bad)",why:"вне нормы"};
}
function markVal(txt){
  const t=String(txt);
  if(/⚠️|НЕ ВЫПОЛНЕН|не выполнен|НЕТ ДАННЫХ/i.test(t)) return {c:"var(--warn)",why:"требует внимания"};
  // дата в начале — не значение: «28.09.2025: 3,8 %» это про 3,8
  const body=t.replace(/^\s*\d{1,2}\.\d{2}(?:\.\d{2,4})?\s*(?:[:,—–-]\s*)?/,"");
  const cut=body.split(/при норме|норма/i);
  const head=cut[0], tail=cut.slice(1).join(" ");

  // значения до слова «норма»: «7,7 % / 0,40 ×10⁹/л» → [7.7, 0.40].
  // Степени десятки в единицах измерения числами не считаем.
  const clean=head.replace(/[х×xX*]\s*10\s*[\^]?\s*[\d⁰¹²³⁴⁵⁶⁷⁸⁹]*/g," ")
                  .replace(/10\s*[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g," ");
  const vals=(clean.match(/-?\d+[.,]?\d*/g)||[]).map(num).filter(x=>!isNaN(x));
  if(!vals.length) return null;

  // границы после: «0–5 % и 0,02–0,30» → [[0,5],[0.02,0.30]]; «до 0,44» → [[null,0.44]]
  const lims=[];
  if(tail){
    const parts=tail.split(/\s+и\s+|;|\s\/\s/);
    parts.forEach(pt=>{
      let m=pt.match(/(\d+[.,]?\d*)\s*[–—-]\s*(\d+[.,]?\d*)/);
      if(m){ lims.push([num(m[1]),num(m[2])]); return; }
      m=pt.match(/(?:до|не более|менее|<)\s*(\d+[.,]?\d*)/i);
      if(m){ lims.push([null,num(m[1])]); return; }
      m=pt.match(/(?:от|более|>)\s*(\d+[.,]?\d*)/i);
      if(m){ lims.push([num(m[1]),null]); return; }
    });
  }
  if(!lims.length){
    if(/выше нормы|ниже нормы|превыш|снижен|повышен|не соответствует/i.test(t)) return {c:"var(--bad)",why:"вне нормы"};
    if(/соответствует|в пределах (?:возрастной )?нормы|возрастной норме|без отклонений|без патологии|не изменен|не расширен|не увеличен/i.test(t))
      return {c:"var(--ok)",why:"в норме"};
    // «норма» сказана словом, без цифр: «отношение 1,3 — норма»
    if(/норм[аеы](?![а-яё])/i.test(t)&&!/не указан|нет данных|неизвестн|норма в документе/i.test(t))
      return {c:"var(--ok)",why:"в норме"};
    return null;
  }
  // пар должно быть поровну, иначе не угадываем, какое значение к какой норме
  let pairs;
  if(vals.length===lims.length){
    pairs=vals.map((v,i)=>[v,lims[i]]);
  } else if(lims.length===1){
    // одна норма на несколько чисел: берём то, что с ней одного порядка.
    // «3,8 % / 0,230 при норме до 0,440» — норма явно про 0,230, а не про 3,8
    const [lo,hi]=lims[0], ref=(hi!==null?hi:lo)||1;
    const near=vals.slice().sort((a,b)=>
      Math.abs(Math.log10((Math.abs(a)||1e-9)/Math.abs(ref)))-Math.abs(Math.log10((Math.abs(b)||1e-9)/Math.abs(ref))))[0];
    if(Math.abs(Math.log10((Math.abs(near)||1e-9)/Math.abs(ref)))>1.2) return null;  // ничего похожего — не гадаем
    pairs=[[near,lims[0]]];
  } else return null;

  let worst=null;
  for(const [v,[lo,hi]] of pairs){
    const okHi=hi===null||v<=hi, okLo=lo===null||v>=lo;
    let r;
    if(okHi&&okLo){
      const edge=(hi!==null&&v>=hi*0.95)||(lo!==null&&lo!==0&&v<=lo*1.05);
      r=edge?{c:"var(--warn)",why:"на границе нормы",rank:1}:{c:"var(--ok)",why:"в норме",rank:0};
    } else {
      const ref=hi!==null&&v>hi?hi:lo;
      const off=Math.abs(v-ref)/(Math.abs(ref)||1);
      r=off<=0.1?{c:"var(--warn)",why:"немного вне нормы",rank:1}:{c:"var(--bad)",why:"вне нормы",rank:2};
    }
    if(!worst||r.rank>worst.rank) worst=r;
  }
  return worst;
}

function openRec(i,showSer){
  const D=DATA[cur], r=D.rec[i]; if(!r)return;
  const o=organOf(r.sys);
  const rows=[
    ["Дата",ru(r.d)],["Тип",TYPE[r.t]],["Система",sysName(r.sys)],
    ["Врач / источник",r.who],["Учреждение",r.place&&r.place!=="—"?r.place:""],
    ["Значение",r.v],["Норма",r.n],["Результат, заключение",r.res],["Статус",ST[r.st]]
  ].filter(x=>x[1]);

  // история этого же показателя
  const hist=D.rec.filter(x=>x.t==="lab"&&x.title===r.title).sort((a,b)=>b.d.localeCompare(a.d));
  // все показатели той же сдачи
  const panel=D.rec.filter(x=>x.t==="lab"&&x.d===r.d).sort((a,b)=>
    (a.st==="ok")-(b.st==="ok")||a.title.localeCompare(b.title));
  const off=panel.filter(x=>x.st!=="ok").length;
  // остальные записи того же дня: приём, исследования, снимки — чтобы не терялся контекст визита
  const sameDay=D.rec.filter(x=>x!==r&&x.d===r.d&&!(r.t==="lab"&&x.t==="lab"));
  // График строим только по этому показателю: явный ряд → авторяд из истории.
  // Для не-лабораторных записей показываем ряды системы.
  const num=v=>{const x=parseFloat(String(v).replace(",",".").replace(/[^\d.\-]/g,""));return isNaN(x)?null:x};
  const sid=showSer||r.ser;
  let ser=[];
  if(sid) ser=D.series.filter(s=>s.id===sid);
  else if(r.t==="lab"){
    const pts=hist.slice().reverse().map(h=>[ru(h.d),num(h.v)]).filter(p=>p[1]!==null);
    if(pts.length>1) ser=[{id:"auto",name:r.title,unit:"",pts}];
  } else ser=D.series.filter(s=>s.sys===r.sys);
  const noSer=r.t==="lab"&&!ser.length;

  document.getElementById("modal").innerHTML=`
    <div class="mbox" role="dialog" aria-modal="true">
      <button class="mclose" data-close="1" aria-label="Закрыть">✕</button>
      <div class="pill s-${r.st}" style="margin-bottom:8px">${TYPE[r.t]} · ${ST[r.st]}</div>
      <h3 style="margin:0 0 4px;font-size:18px">${esc(r.title)}</h3>
      <div class="muted" style="margin-bottom:14px">${ru(r.d)}${r.who?" · "+esc(r.who):""}</div>

        <div class="muted" style="font-size:12.5px;margin-bottom:6px">Нажмите показатель — откроется его история и график</div>
        <div class="tw"><table><thead><tr><th>Показатель</th><th>Результат</th><th>Было раньше</th><th>Норма</th><th>Что означает</th><th>Статус</th></tr></thead><tbody>
        ${panel.map(p=>`<tr class="row" data-rec="${idOf(p)}"${p===r?' style="background:var(--accentbg)"':''}>
          <td><b>${esc(p.title)}</b>${p.ser?' <span class="tag">график</span>':''}</td>
          <td style="white-space:nowrap"><b style="color:var(--${p.st==='ok'?'ink':p.st})">${esc(p.v||"—")}</b></td>
          <td style="font-size:13px">${prevCell(p)}</td>
          <td class="muted" style="white-space:nowrap">${esc(p.n||"")}</td>
          <td class="muted">${esc(p.res||"")}</td>
          <td><span class="pill s-${p.st}">${ST[p.st]}</span></td></tr>`).join("")}
        </tbody></table></div>`:""}

      ${(r.t==="lab"&&hist.length===1)?`<div class="note" style="background:var(--nonebg);color:var(--muted);margin-top:14px">

        <div class="tw"><table><thead><tr><th>Дата</th><th>Значение</th><th>Норма</th><th>Контекст</th><th></th></tr></thead><tbody>
        ${hist.map(h=>`<tr${h===r?' style="background:var(--accentbg)"':''}>
          <td class="muted">${ru(h.d)}</td><td><b>${esc(h.v||"—")}</b></td>
          <td class="muted">${esc(h.n||"—")}</td><td>${esc(h.res||"—")}</td>
          <td><span class="pill s-${h.st}">${ST[h.st]}</span></td></tr>`).join("")}
        </tbody></table></div>`:""}

      ${r.full?`<h3 style="font-size:14px;margin:18px 0 6px">Что в заключении целиком</h3>

          <span><i style="background:var(--bad)"></i>вне нормы</span>
          <span class="muted">без цвета — норма в документе не указана</span></div>
        <div class="tw"><table><tbody>${r.full.map(f=>Array.isArray(f)
          ?(()=>{const mk=markVal(f[2]?f[1]+" "+f[2]:f[1]);   // норма часто лежит в комментарии — читаем оба поля
            return `<tr><td class="muted" style="width:42%">${esc(f[0])}</td><td><b${mk?` style="color:${mk.c}" title="${esc(mk.why)}"`:""}>${esc(f[1])}</b>${f[2]?` <span class="muted" style="font-weight:400">${esc(f[2])}</span>`:""}</td></tr>`;})()
          :`<tr><td colspan="2">${esc(f)}</td></tr>`).join("")}</tbody></table></div>`:""}

      ${sameDay.length?`<h3 style="font-size:14px;margin:18px 0 6px">В этот же день, ${ru(r.d)} — ещё ${sameDay.length}</h3>
        <div class="muted" style="font-size:12.5px;margin-bottom:6px">Одна явка часто разложена на несколько записей. Нажмите — откроется целиком</div>
        <div class="tw"><table><thead><tr><th>Что</th><th>Тип</th><th>Результат</th><th>Статус</th></tr></thead><tbody>
        ${sameDay.map(x=>`<tr class="row" data-rec="${idOf(x)}">
          <td><b>${esc(x.title)}</b>${x.full?' <span class="tag">заключение целиком</span>':''}</td>
          <td class="muted" style="white-space:nowrap">${TYPE[x.t]}</td>
          <td class="muted">${esc(x.res||x.v||"—")}</td>
          <td><span class="pill s-${x.st}">${ST[x.st]}</span></td></tr>`).join("")}
        </tbody></table></div>`:""}

      <h3 style="font-size:14px;margin:18px 0 6px">Карточка записи</h3>
      <table>${rows.map(([k,v])=>`<tr><td class="muted" style="width:38%">${esc(k)}</td><td><b>${esc(v)}</b></td></tr>`).join("")}</table>

      ${ser.length?`<h3 style="font-size:14px;margin:18px 0 4px">Динамика: ${esc(ser[0].name)}</h3>${ser.map(s=>`
        ${s.unit?`<div class="muted" style="font-size:13px">${esc(s.unit)}</div>`:""}${chart(s)}`).join("")}`:""}
      ${noSer?`<div class="note" style="background:var(--nonebg);color:var(--muted)">
        Динамики по этому показателю нет: в архиве ${hist.length===1?"одно значение":"значения не числовые"}.
        График появится, когда будет вторая сдача.</div>`:""}

      ${o?`<div class="note" style="background:var(--nonebg)"><b>${o.ic} ${esc(o.name)}</b><br>${esc(o.txt)}</div>`:""}
      <button class="gobtn" data-f="${r.sys}" data-close="1">Все записи: ${esc(sysName(r.sys))} →</button>
    </div>`;
  document.getElementById("modal").classList.add("on");
  document.getElementById("modal").scrollTop=0;
}

const MON=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
function isoOf(dt){return dt.toISOString().slice(0,10)}
function shiftDays(n){const t=new Date();t.setHours(12,0,0,0);t.setDate(t.getDate()-n);return t}
function symAgg(list,from,to){
  const sel=list.filter(x=>x.d>=from&&x.d<=to);
  const ii=sel.map(x=>x.i).filter(v=>v!=null);
  return {n:sel.length,days:new Set(sel.map(x=>x.d)).size,
          avg:ii.length?Math.round(ii.reduce((a,b)=>a+b,0)/ii.length*10)/10:null,
          max:ii.length?Math.max(...ii):null};
}
const TSCALE=[[36.9,"#5b9bd5","норма"],[37.4,"#e0b400","субфебрильная"],[37.9,"#e07b1f","высокая субфебрильная"],
              [38.9,"#d64545","фебрильная"],[99,"#7d1212","очень высокая"]];
function intColor(v){ if(v==null) return "var(--accent)"; if(v>=8) return "#7d1212"; if(v>=7) return "var(--bad)"; if(v>=4) return "var(--warn)"; return "var(--ok)"; }
// тяжесть одной записи: цвет, вес 0..1 и подпись
function sevOf(x){
  if(x&&x.v!=null&&x.u==="°C"){
    for(const [lim,c,t] of TSCALE) if(x.v<=lim)
      return {c,k:Math.min(1,Math.max(.15,(x.v-36.5)/(40.5-36.5))),t:String(x.v).replace(".",",")+" °C",n:t};
  }
  if(x&&x.i!=null) return {c:intColor(x.i),k:Math.max(.15,x.i/10),t:x.i+"/10",n:""};
  return {c:"var(--accent)",k:.4,t:"",n:""};
}
function worstOf(list){
  if(!list||!list.length) return null;
  return list.map(sevOf).sort((a,b)=>b.k-a.k)[0];
}
function fillFor(cnt,recs){
  if(!cnt) return "background:var(--nonebg)";
  const w=worstOf(recs);
  const dens=cnt>=5?1:cnt>=3?.85:cnt>=2?.7:.55;
  const op=Math.min(1,(w?w.k:.4)*.65+dens*.45);
  return `background:${w?w.c:"var(--accent)"};opacity:${op.toFixed(2)}`;
}
function monthCells(list,from){
  const first=from||(list.length?list[list.length-1].d:null); if(!first) return [];
  const now=new Date();
  let y=+first.slice(0,4), mo=+first.slice(5,7)-1;
  const cells=[]; 
  while(y<now.getFullYear()||(y===now.getFullYear()&&mo<=now.getMonth())){
    const pre=`${y}-${String(mo+1).padStart(2,"0")}`;
    const sel=list.filter(x=>x.d.startsWith(pre));
    cells.push({y,mo,n:sel.length,recs:sel});
    mo++; if(mo>11){mo=0;y++}
  }
  return cells;
}
function monthStrip(list,from){
  return `<div class="strip">${monthCells(list,from).map(c=>{const w=worstOf(c.recs);
    return `<div class="cell" style="${fillFor(c.n,c.recs)}" title="${MON[c.mo]} ${c.y} — ${c.n?razy(c.n)+(w&&w.t?", максимум "+w.t:""):"тихо"}"></div>`;}).join("")}</div>`;
}
function monthAxis(from){
  const cells=monthCells([],from);
  return `<div class="axis">${cells.map(c=>
    `<span title="${MON[c.mo]} ${c.y}">${c.mo%3===0?MON[c.mo][0]:""}</span>`).join("")}</div>
    ${yearBand(cells,11,2)}`;
}
function medsOf(list){
  const m={};
  list.forEach(x=>{ if(!x.m) return;
    x.m.split(",").map(t=>t.trim().replace(/^(затем|и)\s+/i,"")).filter(Boolean).forEach(one=>{
      const key=(one.replace(/\s+[\d(].*$/,"").trim())||one;
      if(!m[key]) m[key]={n:0,full:new Set(),dates:[]};
      m[key].n++; m[key].full.add(one); m[key].dates.push(x.d);
    });
  });
  return Object.entries(m).map(([k,v])=>({name:k,n:v.n,full:[...v.full],last:v.dates.sort().reverse()[0]}))
    .sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
}
function medLinks(names,tail){
  if(!names.length) return "—";
  return names.map(n=>`<span class="medlink" data-med="${esc(n)}">${esc(n)}</span>`).join(", ")+(tail||"");
}
function medChips(list){
  const M=medsOf(list);
  if(!M.length) return `<div class="muted">В этих записях лекарств нет</div>`;
  return M.map(x=>`<span class="medchip go" data-med="${esc(x.name)}" title="${esc(x.full.join(" · "))}">${esc(x.name)}${x.n>1?` <b>×${x.n}</b>`:""}</span>`).join("");
}
function symsFor(d,sys){
  const S=d.sym||{cat:[],log:[]};
  const names=[...new Set([...S.cat.filter(c=>c.sys===sys).map(c=>c.n),...S.log.filter(l=>l.sys===sys).map(l=>l.n)])];
  return names.map(n=>({n,log:S.log.filter(l=>l.n===n),cat:S.cat.find(c=>c.n===n)||{}}))
    .sort((a,b)=>b.log.length-a.log.length);
}
function lastAgo(iso,today){
  const a=Math.round((new Date(today)-new Date(iso))/864e5);
  return a<1?"сегодня":a<31?a+" дн. назад":a<400?Math.round(a/30)+" мес. назад":Math.floor(a/365)+" г. назад";
}
function freqByMonth(list,months){
  const now=new Date(), out=[];
  for(let i=months-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const pre=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const sel=list.filter(x=>x.d.startsWith(pre));
    out.push({y:d.getFullYear(),mo:d.getMonth(),n:sel.length,recs:sel});
  }
  return out;
}
function yearBand(cells,w,gap){
  const seg=[]; cells.forEach(c=>{const l=seg[seg.length-1];
    if(l&&l.y===c.y) l.n++; else seg.push({y:c.y,n:1})});
  return `<div class="yband">${seg.map(g=>
    `<div style="width:${g.n*(w+gap)-gap}px">${g.n>1?g.y:"’"+String(g.y).slice(2)}</div>`).join("")}</div>`;
}
function freqChart(list,months){
  const cells=freqByMonth(list,months), mx=Math.max(1,...cells.map(c=>c.n));
  return `<div class="fwrap"><div class="fbars">${cells.map(c=>{const w=worstOf(c.recs);
    return `<div class="fbar${c.n?"":" zero"}" title="${MON[c.mo]} ${c.y} — ${razy(c.n)}${w&&w.t?", максимум "+w.t:""}">
      ${c.n?`<b>${c.n}</b>`:""}<i style="height:${c.n?Math.round(c.n/mx*100):0}%;${c.n&&w?`background:${w.c}`:""}"></i></div>`;}).join("")}</div>
    <div class="faxis">${cells.map(c=>`<span class="${c.mo===0?"jan":""}">${MON[c.mo]}</span>`).join("")}</div>
    ${yearBand(cells,24,3)}</div>`;
}
function trendVerdict(list,today){
  const d90=isoOf(shiftDays(89)), d180=isoOf(shiftDays(179));
  const a=list.filter(x=>x.d>=d90).length, b=list.filter(x=>x.d>=d180&&x.d<d90).length;
  if(!a&&!b) return `<div class="verdict flat">За последние полгода записей нет</div>`;
  if(a>b) return `<div class="verdict up">Участился: ${a} раз за 90 дней против ${b} за предыдущие 90. Повод показаться врачу, даже если каждый раз терпимо</div>`;
  if(a<b) return `<div class="verdict dn">Стало реже: ${a} за 90 дней против ${b} за предыдущие 90</div>`;
  return `<div class="verdict flat">Без изменений: ${a} и ${a} за два полугодия по 90 дней</div>`;
}
function isRising(list,today){
  const d90=isoOf(shiftDays(89)), d180=isoOf(shiftDays(179));
  const a=list.filter(x=>x.d>=d90).length, b=list.filter(x=>x.d>=d180&&x.d<d90).length;
  return a>b&&a>=2;
}
function medInfo(name){
  if(typeof MEDREF==="undefined") return null;
  if(MEDREF[name]) return MEDREF[name];
  const k=Object.keys(MEDREF).find(x=>x.toLowerCase()===name.toLowerCase()
    ||x.toLowerCase().startsWith(name.toLowerCase()+" ")
    ||name.toLowerCase().startsWith(x.toLowerCase()+" "));
  return k?MEDREF[k]:null;
}
function medHits(log,name){
  const n=name.toLowerCase();
  return log.filter(x=>x.m&&x.m.split(",").some(t=>{
    const one=t.trim().replace(/^(затем|и)\s+/i,"");
    const key=(one.replace(/\s+[\d(].*$/,"").trim()||one).toLowerCase();
    return key===n||one.toLowerCase()===n;
  }));
}
// Карту начинаем с 2022 года: раньше записи единичные и растягивают полосу впустую.
// Если все записи старше 2022 — начинаем с первой, иначе нечего было бы показывать.
const MAPFROM="2022-01-01";
function mapStart(list){
  if(!list||!list.length) return null;
  const first=list[list.length-1].d;
  if(first>=MAPFROM) return first;
  return list.some(x=>x.d>=MAPFROM) ? MAPFROM : first;
}
function hiddenBefore(list){
  return (list||[]).filter(x=>x.d<MAPFROM).length;
}
function epSyms(ep,log){
  const key=ep.as||ep.dx||"";
  const fromLog=[...new Set((log||[]).filter(x=>x.d===ep.d1&&(x.p||"")===key).map(x=>x.n))];
  if(fromLog.length) return fromLog;
  return (ep.sym||"").split(",").map(x=>x.trim()).filter(Boolean);   // запасной вариант: теги дневника
}
function epDays(e,today){
  const a=new Date(e.d1), b=new Date(e.d2||today);
  return Math.max(1,Math.round((b-a)/864e5)+1);
}
function epOpen(e,today){
  return !e.d2 && e.d1 < isoOf(shiftDays(30));
}
function razy(n){
  const t=n%100, o=n%10;
  if(t>=11&&t<=14) return n+" раз";
  if(o===1) return n+" раз"; if(o>=2&&o<=4) return n+" раза"; return n+" раз";
}
function human(n){
  const t=n%100, o=n%10;
  if(t>=11&&t<=14) return n+" дней";
  if(o===1) return n+" день"; if(o>=2&&o<=4) return n+" дня"; return n+" дней";
}
function byPovod(list){
  const g={};
  list.forEach(x=>{const k=x.p||"__none__"; (g[k]=g[k]||[]).push(x)});
  return Object.entries(g).map(([k,v])=>({p:k==="__none__"?"":k,list:v}))
    .sort((a,b)=>b.list.length-a.list.length||(a.p?1:-1));
}
function logLines(list,eps){
  const find=x=>(eps||[]).find(e=>e.d1===x.d&&(e.dx||"")===(x.p||""));
  return list.map(x=>{const ep=find(x);
   return `<div class="logline">
    <div><b>${esc(x.n)}</b> <span class="muted">· ${x.d.split("-").reverse().join(".")}</span>
    ${x.aid?`<span class="pend" title="Добавлено в книжке, ждёт переноса в реестр">●</span>
      <button class="addsym editadd" data-aid="${esc(x.aid)}" title="Исправить запись">✎</button>
      <button class="addsym deladd" data-aid="${esc(x.aid)}" title="Удалить запись">✕</button>`:""}
    ${(()=>{const w=sevOf(x);return w.t?`<span class="pill" style="background:${w.c};margin-left:6px">${w.t}</span>`:""})()}
    ${x.p?`<span class="muted" style="margin-left:6px;font-size:12px">повод: ${esc(x.p)}</span>`:""}
    ${(ep&&ep.tmax&&x.n!=="Температура")?`<span class="pill" style="background:${sevOf({v:ep.tmax,u:"°C"}).c};margin-left:6px" title="максимум за эпизод">🌡 до ${String(ep.tmax).replace(".",",")} °C</span>`:""}</div>
    ${x.f?`<div style="margin-top:2px">${esc(x.f)}</div>`:""}
    ${x.m?`<div class="muted" style="margin-top:2px">💊 ${x.m.split(",").map(t=>{
      const one=t.trim().replace(/^(затем|и)\s+/i,""); if(!one) return "";
      const key=one.replace(/\s+[\d(].*$/,"").trim()||one;
      return `<span class="medlink" data-med="${esc(key)}">${esc(one)}</span>`;
    }).filter(Boolean).join(", ")}${x.h?` — ${esc(x.h)}`:""}</div>`:""}
  </div>`;}).join("");
}
function dayStrip(list,days){
  const cells=[];
  for(let i=days-1;i>=0;i--){
    const dd=isoOf(shiftDays(i));
    const sel=list.filter(x=>x.d===dd); const w=worstOf(sel);
    cells.push(`<div class="dcell" style="${fillFor(sel.length,sel)}" title="${dd.split("-").reverse().join(".")} — ${sel.length?(w&&w.t?w.t:sel.length+" раз"):"нет"}"></div>`);
  }
  return `<div class="strip">${cells.join("")}</div>`;
}

async function gapi(url,opts,tries){

// Реестр по-прежнему за мной, но ждать переноса больше не нужно.
// Google отдаёт даты в формате ячейки: «06.05.2024» или порядковым числом.
// Приводим к виду YYYY-MM-DD, иначе сравнение с реестром никогда не сойдётся.
function toIso(v){
  if(v==null||v==="") return "";
  const t=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  let m=t.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  if(/^\d+(\.\d+)?$/.test(t)){                     // порядковый номер дня Google
    const d=new Date(Date.UTC(1899,11,30)+Math.floor(+t)*86400000);
    return d.toISOString().slice(0,10);
  }
  const d=new Date(t);
  return isNaN(d)?t:d.toISOString().slice(0,10);
}

// чтение через приёмник: работает без входа в Google, если в Apps Script добавлен doGet
async function relayRead(sheet,last,ms){
  const base=READ_RELAY||RELAY;
  if(!base) return null;
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),ms||6000);
  try{
    const r=await fetch(base+"?sheet="+encodeURIComponent(sheet)+(last===false?"":"&last=1"),{signal:ctl.signal});
    const j=await r.json();
    return (j&&j.ok&&Array.isArray(j.rows))?j.rows:null;
  }catch(e){ return null }
  finally{ clearTimeout(t) }
}

function ovSave(o){ try{ localStorage.setItem(OVKEY,JSON.stringify(o)); }catch(e){} }

function addKey(a){ return [a.who,a.d,a.n,a.p||""].join("|"); }
function addFind(key){ const o=ovLoad(); const i=(o.add||[]).findIndex(a=>addKey(a)===key); return {o,i}; }

function ovApply(){
  const o=ovLoad(); let dirty=false;
  for(const k of Object.keys(DATA)){
    const S=DATA[k].sym; if(!S) continue;
    (S.ep||[]).forEach(e=>{
      if(e._base){ e.dx=e._base; delete e._base; delete e.pending; }   // откатываем прошлое наложение
      const nm=o.ren[e.id]; if(!nm) return;
      if(e.dx===nm){ delete o.ren[e.id]; dirty=true; return; }   // уже в реестре — наложение не нужно
      if(!e._base) e._base=e.dx;
      e.dx=nm; e.pending=1;
    });
  }
  // Сначала убираем прошлые наложения из данных, иначе они примутся за реестр
  // и наложение сотрёт само себя при следующей перерисовке.
  for(const k of Object.keys(DATA)){
    const S=DATA[k].sym; if(!S) continue;
    if(S.log) S.log=S.log.filter(x=>!x.pending);
    if(S.ep)  S.ep =S.ep.filter(x=>!x.pending);
  }
  o.eps=(o.eps||[]).filter(e=>{
    const S=(DATA[e.who]||{}).sym; if(!S) return false;
    if((S.ep||[]).some(x=>x.d1===e.d1&&x.dx===e.dx)){ dirty=true; return false; }   // доехало до реестра
    S.ep.push({id:e.id,d1:e.d1,d2:e.d2||"",dx:e.dx,as:"",ab:e.ab?1:0,
      sym:e.sym||"",t:e.t||"",tmax:null,pending:1});
    S.ep.sort((x,y)=>y.d1.localeCompare(x.d1));
    return true;
  });
  o.add=(o.add||[]).filter(a=>{
    const S=(DATA[a.who]||{}).sym; if(!S) return false;
    if((S.log||[]).some(x=>x.d===a.d&&x.n===a.n&&(x.p||"")===(a.p||""))){ dirty=true; return false; }
    S.log.push({d:a.d,n:a.n,sys:a.sys||"other",i:a.i??null,v:null,u:"",
      f:a.f||"",m:a.m||"",h:"",p:a.p||"",pending:1,aid:addKey(a)});
    S.log.sort((x,y)=>y.d.localeCompare(x.d));
    return true;
  });
  if(dirty) ovSave(o);
}

function medNames(S){
  const set=new Set(typeof MEDREF!=="undefined"?Object.keys(MEDREF):[]);
  (S&&S.log||[]).forEach(x=>{ if(!x.m) return;
    x.m.split(",").forEach(t=>{const one=t.trim().replace(/^(затем|и)\s+/i,"");
      const k=(one.replace(/\s+[\d(].*$/,"").trim())||one; if(k) set.add(k);});});
  return [...set].sort((a,b)=>a.localeCompare(b,"ru"));
}
function attachSuggest(inputId,items,opt){
  const inp=document.getElementById(inputId); if(!inp) return;
  inp.removeAttribute("list");
  const wrap=document.createElement("div"); wrap.className="sugwrap";
  inp.parentNode.insertBefore(wrap,inp); wrap.appendChild(inp);
  const box=document.createElement("div"); box.className="sug"; wrap.appendChild(box);
  let idx=-1, shown=[];
  const norm=t=>String(t).toLowerCase().replace(/ё/g,"е");
  const multi=!!(opt&&opt.multi);
  const segs=()=>inp.value.split(",");
  const lastSeg=()=>multi?segs()[segs().length-1].trim():inp.value.trim();
  const draw=()=>{
    const q=norm(lastSeg());
    shown=(q?items.filter(x=>norm(x).includes(q)):items).slice(0,8);
    if(!shown.length){ box.classList.remove("on"); return; }
    box.innerHTML=shown.map((x,i)=>{
      const p=norm(x).indexOf(q);
      const html=(q&&p>=0)?esc(x.slice(0,p))+"<b>"+esc(x.slice(p,p+q.length))+"</b>"+esc(x.slice(p+q.length)):esc(x);
      return `<div data-i="${i}" class="${i===idx?"pick":""}">${html}</div>`;
    }).join("");
    box.classList.add("on");
  };
  const pick=v=>{
    if(multi){
      const p=segs(); p[p.length-1]=" "+v;
      inp.value=p.join(",").replace(/^\s+/,"")+", ";
    } else inp.value=v;
    box.classList.remove("on"); idx=-1; inp.focus();
    if(multi) setTimeout(draw,0);          // сразу предлагаем следующее
  };
  inp.addEventListener("input",()=>{ idx=-1; draw(); });
  inp.addEventListener("focus",draw);
  inp.addEventListener("keydown",e=>{
    if(!box.classList.contains("on")) return;
    if(e.key==="ArrowDown"){ idx=Math.min(idx+1,shown.length-1); draw(); e.preventDefault(); }
    else if(e.key==="ArrowUp"){ idx=Math.max(idx-1,0); draw(); e.preventDefault(); }
    else if(e.key==="Enter"&&idx>=0){ pick(shown[idx]); e.preventDefault(); }
    else if(e.key==="Escape"){ box.classList.remove("on"); }
  });
  box.addEventListener("mousedown",e=>{ const d=e.target.closest("[data-i]");
    if(d){ e.preventDefault(); pick(shown[+d.dataset.i]); } });
  document.addEventListener("click",e=>{ if(!wrap.contains(e.target)) box.classList.remove("on"); });
}

// ---------- правка и удаление записи, добавленной в книжке ----------
function sendRow(sheet,row,log,okText){
  const fin=async()=>{
    if(RELAY){
      if(await relaySend(sheet,row)) log("Записано в таблицу на Диске.","ok");
      else { qPush(sheet,row); log("Таблица сейчас недоступна — отправлю при следующей синхронизации.","wa"); }
      return;
    }
    if(!gToken){ qPush(sheet,row);
      log("На Диск уйдёт при следующей синхронизации — входить сейчас не нужно.","wa"); return; }
    try{ await gAppend(row,sheet); log("Записано и в таблицу на Диске.","ok"); }
    catch(e){ qPush(sheet,row); log("Диск не ответил, правка встала в очередь: "+esc(e.message),"wa"); }
  };
  log(okText,"ok");
  return fin();
}

// ── Единый список дел: ближайшие записи + то, что требует внимания ──────────
// Сортировка одна: чем ближе дело, тем выше. Просроченное и бессрочное — сверху.
const MONTHS_RU=[["январ",0],["феврал",1],["март",2],["апрел",3],["ма",4],["июн",5],
  ["июл",6],["август",7],["сентябр",8],["октябр",9],["ноябр",10],["декабр",11]];
function whenDays(str){
  if(!str) return null;
  const s=String(str).toLowerCase();
  const today=new Date(); today.setHours(0,0,0,0);
  const day=dt=>Math.round((dt-today)/86400000);
  let m=s.match(/(\d{1,2})[.](\d{1,2})[.](\d{4})/);   // 07.09.2026
  if(m) return day(new Date(+m[3],+m[2]-1,+m[1]));
  m=s.match(/(\d{1,2})[.](\d{4})/);                    // 08.2022
  if(m) return day(new Date(+m[2],+m[1]-1,1));
  m=s.match(/([а-яё]{3,})\s+(\d{4})/);                 // «декабрь 2026», «конец ноября 2026»
  if(m){ const hit=MONTHS_RU.find(([k])=>m[1].startsWith(k));
         if(hit){ const dd=/конц|конец/.test(s)?25:/серед/.test(s)?15:/начал/.test(s)?5:1;
                  return day(new Date(+m[2],hit[1],dd)); } }
  if(/не откладыв|срочно|сейчас|тем же заходом|идёт|идет/.test(s)) return 0;
  if(/эта недел|на этой недел/.test(s)) return 7;
  if(/ближайшие 2|ближайшие 3|ближайшие недел|ближайшие дни|\d\s*[–-]\s*\d\s*недел/.test(s)) return 21;
  if(/ближайший месяц|ближайшее время/.test(s)) return 30;
  if(/осен|зим|весн|лет[оа]/.test(s)) return 60;
  m=s.match(/(\d{4})/); if(m) return day(new Date(+m[1],0,1));
  return null;
}
// одно и то же дело нередко записано дважды: как ближайшая запись и как пункт
// «требует внимания». Схлопываем пару в одну строку: дата от записи, разбор от пункта.
const nrm=t=>(t||"").toLowerCase().replace(/ё/g,"е").replace(/[^а-я0-9]+/g," ").trim();
function sameThing(a,b){
  const x=nrm(a),y=nrm(b); if(!x||!y) return false;
  if(x.includes(y)||y.includes(x)) return true;
  // сравниваем по основам: «онкогенетик» и «онкогенетика», «панель» и «панелью» — одно и то же
  const st=t=>t.split(" ").filter(w=>w.length>3).map(stem);
  const wx=st(x), wy=st(y);
  return wx.filter(w=>wy.includes(w)).length>=2;
}
// «рекомендация» — то, что делается дома и ни от кого не зависит; остальное это поход
const isSelf=(tag,title)=>/сделать самому|наблюдать|записывать/i.test(tag||"")
  ||/дневник|считать|счёт |вести запис/i.test(title||"");
// внутри походов: анализы, консультации, всё остальное (исследования, вопросы, прививки)
const RX_DOC=/олог|врач|педиатр|терапевт|психиатр|хирург|ортопед|окулист|медосмотр|консультац|диспансер|приём|прием/i;
const RX_LAB=/анализ|кров|ферритин|ттг|моч[аеи]|кал[ ,]|копрол|посев|соскоб|мазок|пцр|скрининг|антител|ige|igе|25\(oh\)d|витамин d|цинк|ггт|алт|аст|липид|глюкоз|hba1c|биохими|пробы|биопси|pylori|хеликобактер|тестостерон|целиаки|ревмопроб/i;
function groupOf(x){
  const t=x.title||"";
  if(RX_DOC.test(t)) return "doc";
  if(RX_LAB.test(t)||/сдать/i.test(x.tag||"")) return "lab";
  return "etc";
}
function buildTodo(d){
  const out=[];
  const ats=(d.attention||[]).map((a,i)=>({kind:"at",when:a.due||a.d,was:a.due?a.d:null,due:!!a.due,
    title:a.t,why:a.w||"",st:a.st||"warn",sys:a.sys||null,task:i,tag:labelOf(a),
    k:whenDays(a.due||a.d),p:a.p||99}));
  (d.soon||[]).forEach(x=>{
    const hit=ats.find(a=>a.sys&&a.sys===x.sys&&sameThing(a.title,x.what)&&!a.merged);
    if(hit){ hit.merged=true; hit.was=hit.was||hit.when; hit.when=x.when; hit.k=whenDays(x.when);
             if(x.ok) hit.tag="записан"; return; }
    out.push({kind:"soon",when:x.when,title:x.what,why:x.why||"",
      st:x.st||"warn",sys:x.sys||null,tag:x.ok?"записан":"записаться",k:whenDays(x.when),p:50});
  });
  ats.forEach(a=>out.push(a));
  out.forEach(x=>{x.self=isSelf(x.tag,x.title); x.grp=x.self?null:groupOf(x);});
  return out.map((x,i)=>Object.assign(x,{_i:i})).sort((a,b)=>{
    const ka=a.k==null?0:a.k, kb=b.k==null?0:b.k;
    if(ka!==kb) return ka-kb;
    if(a.kind!==b.kind) return a.kind==="at"?-1:1;
    return (a.p-b.p)||(a._i-b._i);
  });
}

        </div>`:`<div class="note" style="margin-top:12px">По этой системе в архиве нет ни одной записи — именно поэтому пункт и стоит в плане.</div>`}
      </div>`:""}

      ${ser.length?`<div class="card" id="t-ser"><h2>Динамика</h2>
        ${ser.map(s=>`<h3>${esc(s.name)}<span class="muted">, ${esc(s.unit)}</span></h3>${chart(s)}`).join("")}</div>`:""}
      ${blk(ops,"Операции и госпитализации","t-ops")}
      ${blk(by("lab"),"Анализы","t-lab")}
      ${blk(by("instr"),"Инструментальные исследования","t-instr")}
      ${blk(by("visit"),"Посещения врачей","t-visit")}`;
  }

  // ── Страница системы: график → анализы → исследования → посещения
  else if(tab==="sys"&&sysFilter){
    const o=organOf(sysFilter);
    const all=DATA[cur].rec.filter(r=>inSys(r,sysFilter)&&matches(r)).sort((a,b)=>b.d.localeCompare(a.d));
    const ser=d.series.filter(s=>isLnk(sysFilter)?false:s.sys===sysFilter);
    const ops=all.filter(r=>r.op);
    const by=t=>all.filter(r=>r.t===t&&!r.op);
    const goto=(lab,n,id)=>`<div class="kpi ${n?"":"off"}" ${n?`data-goto="${id}"`:""}>
      <div class="lab">${lab}</div><div class="val">${n}</div></div>`;
    const blk=(l,ttl,note,id)=>l.length?`<div class="card"${id?` id="${id}"`:""}>
        <h2>${ttl} <span class="muted" style="text-transform:none">— ${l.length}</span></h2>
        ${note?`<div class="muted" style="font-size:13px;margin:-6px 0 10px">${note}</div>`:""}
        ${tableRows(l,{showSys:false})}</div>`:"";
    // сравнение анализов по датам
    const labs=by("lab");
    const names=[...new Set(labs.map(r=>r.title))];
    const cmp=names.length&&labs.length>names.length?(()=>{
      const dates=[...new Set(labs.map(r=>r.d))].sort().reverse();
      return `<div class="card"><h2>Сравнение по периодам</h2>
        <div class="tw"><table><thead><tr><th>Показатель</th>${dates.map(x=>`<th>${ru(x)}</th>`).join("")}</tr></thead><tbody>
        ${names.map(nm=>`<tr><td><b>${esc(nm)}</b></td>${dates.map(dt=>{
          const c=labs.find(r=>r.title===nm&&r.d===dt);
          if(!c) return `<td><span class="muted">—</span></td>`;
          const mk=markVN(c.v,c.n);
          const col=mk?mk.c:`var(--${c.st==='ok'?'ink':c.st})`;
          return `<td><b style="color:${col}"${mk?` title="${esc(mk.why)}"`:""}>${esc(c.v||"—")}</b></td>`;
        }).join("")}</tr>`).join("")}
        </tbody></table></div></div>`;})():"";
    m.innerHTML=`
      <button class="back" data-t="home">← К карте органов</button>
      <div class="card">
        <h2>${o?o.ic+" "+esc(o.name):(LNK[sysFilter]?LNK[sysFilter].ic+" "+esc(LNK[sysFilter].name):esc(sysFilter))}</h2>
        <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
          <span class="pill s-${o?o.st:'none'}">${o?ST[o.st]:""}</span>
          <span style="flex:1;min-width:220px">${o?esc(o.txt):""}</span>
        </div>
        <div class="grid" style="margin-top:14px">
          ${goto("Всего записей",all.length,ops.length?"y-ops":by("lab").length?"y-lab":by("instr").length?"y-instr":"y-visit")}
          ${goto("Операций",ops.length,"y-ops")}
          ${goto("Анализов",by("lab").length,"y-lab")}
          ${goto("Исследований",by("instr").length,"y-instr")}
          ${goto("Посещений",by("visit").length,"y-visit")}
          ${goto("Рядов динамики",ser.length,"y-ser")}
          ${goto("Диагнозов",d.diagnoses.filter(x=>x.sys===sysFilter||x.lnk===sysFilter).length,"y-dx")}
          ${goto("Симптомов",symsFor(d,sysFilter).filter(x=>x.log.length).length,"y-sym")}
        </div>
      </div>
      ${blk(ops,"Операции и госпитализации","",'y-ops')}
      ${ser.length?`<div class="card" id="y-ser"><h2>Динамика</h2>
        ${ser.map(s=>`<h3>${esc(s.name)}<span class="muted">, ${esc(s.unit)}</span></h3>${chart(s)}`).join("")}</div>`:""}
      ${blk(by("lab"),"Анализы","Нажмите строку — история показателя и все значения этой сдачи",'y-lab')}
      ${cmp}
      ${blk(by("instr"),"Инструментальные исследования","",'y-instr')}
      ${blk(by("visit"),"Посещения врачей","",'y-visit')}
      ${all.length?"":`<div class="card"><div class="empty">По этой системе записей нет</div></div>`}
      ${(()=>{const SY=symsFor(d,sysFilter),withLog=SY.filter(x=>x.log.length);
        if(!SY.length) return "";
        const allLog=withLog.flatMap(x=>x.log);
        return `<div class="card" id="y-sym"><h2>Симптомы по этой системе <span class="muted" style="text-transform:none">— ${SY.length}</span></h2>
        <p class="muted" style="margin:-4px 0 10px">Что человек чувствовал при этих диагнозах. Нажмите симптом — все его записи и лекарства.</p>
        <div class="tw"><table><thead><tr><th>Симптом</th><th style="text-align:center">записей</th><th>последний раз</th><th>чем лечил</th><th></th></tr></thead><tbody>
        ${SY.map(x=>{const meds=x.log.length?medsOf([x.log[0]]).map(v=>v.name):[];
          return `<tr class="symlink" data-sym="${esc(x.n)}"><td><b>${esc(x.n)}</b>${x.cat.red?' <span class="red-dot">▲</span>':""}</td>
          <td style="text-align:center">${x.log.length?`<b>${x.log.length}</b>`:'<span class="muted">—</span>'}</td>
          <td class="muted">${x.log.length?x.log[0].d.split("-").reverse().join("."):"не отмечалось"}</td>
          <td class="muted">${x.log.length?(meds.length?medLinks(meds):"<span class='muted'>не лечил</span>"):"—"}</td>
          <td style="color:var(--accent);font-weight:600">→</td></tr>`}).join("")}
        </tbody></table></div>
        ${allLog.length?`<h3 style="margin-top:14px">Чем лечили по всей системе</h3>${medChips(allLog)}`:""}
        </div>`;})()}
      <div class="card" id="y-dx"><h2>Диагнозы по системе</h2>
        ${d.diagnoses.filter(x=>x.sys===sysFilter||x.lnk===sysFilter).length?
          `<div class="tw"><table><thead><tr><th>Диагноз</th><th>МКБ-10</th><th>С года</th><th>Состояние</th></tr></thead><tbody>
          ${d.diagnoses.filter(x=>x.sys===sysFilter||x.lnk===sysFilter).map(x=>`<tr class="dxrow" data-sys="${esc(x.sys||"")}"><td><b>${esc(x.n)}</b></td>
          <td class="muted">${esc(x.c)}</td><td class="muted">${esc(x.y)}</td><td>${esc(x.s)}</td></tr>`).join("")}
          </tbody></table></div>`:`<div class="muted">Нет активных диагнозов</div>`}
      </div>`;
  }

  else{
    const list=recs(tab==="all"?null:tab);
    const ser=d.series.filter(s=>!sysFilter||s.sys===sysFilter);
    const showCharts=(tab==="lab"||sysFilter)&&ser.length;
    const other=sysFilter?DATA[cur].rec.filter(r=>r.sys===sysFilter).length:0;
    const S=query?searchIn(cur):null;
    const others=query?Object.keys(DATA).filter(k=>k!==cur).map(k=>({k,n:searchIn(k).total})).filter(x=>x.n):[];
    const tile=(lab,n,id)=>`<div class="kpi ${n?"":"off"}" ${n?`data-goto="${id}"`:""}>
      <div class="lab">${lab}</div><div class="val">${n}</div></div>`;
    m.innerHTML=`
      ${query?`<div class="card"><h2>Найдено по запросу «${esc(query)}» — ${S.total}</h2>
        <div class="muted" style="margin:-6px 0 12px">Ищет в любом месте записи: в названии, в результате, в значении, в норме,
        во враче, в дате, а также в диагнозах, планах, обоснованиях и семейном анамнезе. Нажмите цифру — прокрутит к разделу.</div>
        <div class="grid">
          ${tile("Записей",S.rec.length,"s-rec")}
          ${tile("Диагнозов",S.dx.length,"s-dx")}
          ${tile("Разрешившихся",S.rs.length,"s-rs")}
          ${tile("В планах",S.at.length,"s-at")}
          ${tile("Систем",S.org.length,"s-org")}
          ${tile("Рядов динамики",S.ser.length,"s-ser")}
          ${tile("В карточке",S.kpi.length,"s-kpi")}
          ${tile("Родня",S.fam.length,"s-fam")}
          ${tile("Не сдавалось",S.nev.length,"s-nev")}
        </div>
        ${S.org.length?`<div style="margin-top:12px">${S.org.map(o=>`<span class="tag" data-sys="${o.sys}"
          style="cursor:pointer;font-size:13px;padding:4px 10px">${o.ic} ${esc(o.name)} →</span>`).join(" ")}</div>`:""}
        ${others.length?`<div class="note" style="margin-top:12px">Это же слово есть у других:
          ${others.map(x=>`<span class="tag" data-w="${x.k}" style="cursor:pointer;font-size:13px;padding:4px 10px">${DATA[x.k].short} — ${x.n} →</span>`).join(" ")}</div>`:""}
      </div>
      ${S.dx.length?`<div class="card" id="s-dx"><h2>Диагнозы — ${S.dx.length}</h2><div class="tw"><table>
        <thead><tr><th>Диагноз</th><th>МКБ-10</th><th>С года</th><th>Состояние</th><th></th></tr></thead><tbody>
        ${S.dx.map(x=>`<tr ${x.sys?`class="row" data-sys="${x.sys}"`:""}><td><b>${hl(x.n)}</b></td>
          <td class="muted">${hl(x.c)}</td><td class="muted">${hl(x.y)}</td><td>${hl(x.s)}</td>
          <td><span class="pill s-${x.st}">${ST[x.st]}</span></td></tr>`).join("")}
        </tbody></table></div></div>`:""}
      ${S.rs.length?`<div class="card" id="s-rs"><h2>Разрешившиеся — ${S.rs.length}</h2><div class="tw"><table>
        <thead><tr><th>Диагноз</th><th>Когда</th><th>Исход</th></tr></thead><tbody>
        ${S.rs.map(x=>`<tr><td><b>${hl(x.n)}</b></td><td class="muted">${hl(x.y)}</td><td>${hl(x.s)}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}
      ${S.at.length?`<div class="card" id="s-at"><h2>Требует внимания — ${S.at.length}</h2><div class="tw"><table>
        <thead><tr><th>#</th><th>Что</th><th>Почему</th><th>Давность</th></tr></thead><tbody>
        ${S.at.map(x=>`<tr class="row" data-task="${d.attention.indexOf(x.a)}"><td><span class="pill s-${x.a.st}">${x.a.p}</span></td>
          <td><b>${hl(x.a.t)}</b>${x.line?`<div class="hitline">${hl(x.line)}</div>`:""}</td>
          <td class="muted">${hl(x.a.w)}</td><td class="muted">${hl(x.a.d)}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}
      ${S.org.length?`<div class="card" id="s-org"><h2>Системы — ${S.org.length}</h2>
        <div class="olist" style="max-height:none">${S.org.map(o=>`
          <div class="orow" data-sys="${o.sys}"><span class="ic">${o.ic}</span>
          <span class="dotmark" style="background:var(--${o.st==='none'?'none':o.st})"></span>
          <span style="flex:1"><b>${hl(o.name)}</b><span>${hl(o.txt)}</span></span></div>`).join("")}</div></div>`:""}
      ${S.kpi.length?`<div class="card" id="s-kpi"><h2>В карточке — ${S.kpi.length}</h2>
        <div class="grid">${S.kpi.map(k=>`<div class="kpi"><div class="lab">${hl(k.lab)}</div>
        <div class="val ${String(k.val).length>15?"xlong":String(k.val).length>10?"long":""}" ${k.st?`style="color:var(--${k.st})"`:""}>${hl(k.val)}</div>
        <div class="sub">${hl(k.sub||"")}</div></div>`).join("")}</div></div>`:""}
      ${S.fam.length?`<div class="card" id="s-fam"><h2>Семейный анамнез — ${S.fam.length}</h2><div class="tw"><table>
        <thead><tr><th>Кто</th><th>Что было</th></tr></thead><tbody>
        ${S.fam.map(f=>`<tr><td style="white-space:nowrap"><b>${hl(f.who)}</b></td><td>${hl(f.what)}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}
      ${S.nev.length?`<div class="card" id="s-nev"><h2>Никогда не сдавалось — ${S.nev.length}</h2>
        <div>${S.nev.map(n=>`<span class="tag" style="font-size:13px;padding:4px 10px">${hl(n)}</span>`).join(" ")}</div></div>`:""}`:""}
      <div class="card" id="s-rec">
        <h2>${query?"Записи":TABS.find(t=>t[0]===tab)[1]}${sysFilter?" · "+esc(sysName(sysFilter)):""} <span class="muted" style="text-transform:none">— ${list.length}</span></h2>
        ${filterBar()}
        ${tableRows(list,{showType:tab==="all"})}
        ${(!list.length&&sysFilter&&other)?`<div style="text-align:center;margin-top:10px">
          <button class="gobtn" style="max-width:320px" data-sys="${sysFilter}">Показать все ${other} записей системы →</button></div>`:""}
      </div>
      ${showCharts?`<div class="card" id="s-ser"><h2>Динамика</h2>
        ${ser.map(s=>`<h3>${esc(s.name)}<span class="muted">, ${esc(s.unit)}</span></h3>${chart(s)}`).join("")}
      </div>`:""}
      ${(query&&S.ser.length&&!showCharts)?`<div class="card" id="s-ser"><h2>Ряды динамики — ${S.ser.length}</h2>
        ${S.ser.map(x=>`<h3>${hl(x.name)}<span class="muted">, ${esc(x.unit)}</span></h3>${chart(x)}`).join("")}
      </div>`:""}`;
  }
  nutBind();
}

// ── События
const modal=document.getElementById("modal");
const closeModal=()=>modal.classList.remove("on");
const toSys=(s)=>{sysFilter=s;tab="sys";symSel=null;medSel=null;render();window.scrollTo({top:0,behavior:"smooth"})};

document.addEventListener("click",e=>{
  const gz=e.target.closest("[data-goto]");
  if(gz&&gz.dataset.goto){
    const el=document.getElementById(gz.dataset.goto);
    if(el){
      // отступ считаем по реальной высоте липкой шапки — она разная на телефоне и на мониторе
      const pad=(document.querySelector("header")?.offsetHeight||0)+(document.querySelector("nav")?.offsetHeight||0)+12;
      el.style.scrollMarginTop=pad+"px";
      el.scrollIntoView({behavior:"smooth",block:"start"});
      el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1400);
    }
    return;
  }
  if(e.target.closest("[data-close]")){
    const f=e.target.closest("[data-f]");
    closeModal();
    if(f&&f.dataset.f)toSys(f.dataset.f);
    return;
  }
  if(e.target===modal){closeModal();return}

  const w=e.target.closest("[data-w]"); if(w){cur=w.dataset.w;sysFilter=null;symSel=null;medSel=null;symView="list";tab="home";closeModal();render();return}
  const sv=e.target.closest("[data-symview]"); if(sv){symView=sv.dataset.symview;symSel=null;medSel=null;render();window.scrollTo({top:0});return}
  if(e.target.closest("#todoAll")){ todoAll=!todoAll; render(); return; }
  if(e.target.closest("#pendBar")){ showPending(); return; }
  if(e.target.closest("#newSym")){ newSymForm(); return; }
  if(e.target.closest("#newEp")){ newEpForm(); return; }
  const ea=e.target.closest(".editadd"); if(ea){ e.stopPropagation(); editAddForm(ea.dataset.aid); return; }
  const da=e.target.closest(".deladd"); if(da){ e.stopPropagation(); delAddForm(da.dataset.aid); return; }
  const ed=e.target.closest(".editep"); if(ed){ e.stopPropagation(); editEpForm(ed.dataset.ep); return; }
  const as=e.target.closest(".addsym"); if(as){ e.stopPropagation(); addSymForm(as.dataset.ep); return; }
  const mw=e.target.closest("[data-medwho]");
  if(mw){cur=mw.dataset.medwho;tab="sym";symSel=null;sysFilter=null;closeModal();render();window.scrollTo({top:0});return}
  const md=e.target.closest("[data-med]"); if(md){medSel=md.dataset.med||null;symSel=null;tab="sym";sysFilter=null;render();window.scrollTo({top:0});return}
  const sm=e.target.closest("[data-sym]"); if(sm){symSel=sm.dataset.sym||null;medSel=null;tab="sym";sysFilter=null;render();window.scrollTo({top:0});return}
  const t=e.target.closest("[data-t]"); if(t){tab=t.dataset.t;sysFilter=null;symSel=null;medSel=null;render();window.scrollTo({top:0});return}
  const r=e.target.closest("[data-rec]"); if(r){openRec(+r.dataset.rec);return}
  const k=e.target.closest("[data-task]"); if(k){taskIdx=+k.dataset.task;tab="task";sysFilter=null;
    render();window.scrollTo({top:0,behavior:"smooth"});return}
  const g=e.target.closest("[data-sys]"); if(g){toSys(g.dataset.sys);return}
  const f=e.target.closest("[data-f]"); if(f){sysFilter=f.dataset.f||null;render();return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
document.getElementById("q").addEventListener("input",e=>{
  query=e.target.value.trim();
  if(query){sysFilter=null;tab="all";}   // поиск всегда по всему архиву
  render();
});
const vEl=document.getElementById("ver"); if(vEl) vEl.textContent="сборка "+BUILD;
ovApply();
render();

// Тихо подтягиваем правки, сделанные на других устройствах. Без вопросов и окон:
// если вход ещё живёт — забираем и перерисовываем, если нет — молчим.
(async function autoPull(){
  if(!gToken) return;
  try{
    const q=encodeURIComponent(`'${G_FOLDER}' in parents and trashed=false`);
    const list=await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=200`);
    const byName={}; (list.files||[]).forEach(f=>byName[f.name]=f.id);
    const got=await pullShared(byName);
    if(got){
      render();
      const b=document.getElementById("sync");
      if(b) b.insertAdjacentHTML("afterend",
        `<span id="pulled" style="font-size:11px;color:var(--ok);margin-left:8px">подтянуто с других устройств: ${got}</span>`);
      setTimeout(()=>{const e=document.getElementById("pulled"); if(e) e.remove();},8000);
    }
  }catch(e){ /* нет связи или вход истёк — не мешаем работать */ }
})();
</script>
</body>
</html>
