<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>Медкнижка семьи</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#16202a; --muted:#5d6b7a; --line:#e2e8ee;
  --ok:#1f9d55; --warn:#d99400; --bad:#d64545; --none:#9aa7b4;
  --okbg:#e8f6ee; --warnbg:#fdf3dd; --badbg:#fdeaea; --nonebg:#eef1f4;
  --accent:#2b6cb0; --accentbg:#e8f0f9;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12171d;--card:#1a222b;--ink:#e6edf3;--muted:#9fb0c0;--line:#2a3541;
  --okbg:#16302250;--warnbg:#3a2f1050;--badbg:#3a1c1c50;--nonebg:#232c35;--accentbg:#1b2a3d;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;white-space:nowrap}
.who{display:flex;gap:4px;background:var(--bg);border-radius:9px;padding:3px}
.who button{border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:7px;
  cursor:pointer;font:inherit;font-weight:600}
.who button.on{background:var(--accent);color:#fff}
#q{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font:inherit}
nav{display:flex;gap:2px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);
  overflow-x:auto;position:sticky;top:52px;z-index:19}
nav button{border:0;background:none;color:var(--muted);padding:11px 14px;cursor:pointer;
  font:inherit;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1120px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
h3{font-size:15px;margin:18px 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--bg);border-radius:10px;padding:11px 13px;border:1px solid transparent}
.kpi[data-t],.kpi[data-goto],.kpi.go{cursor:pointer}
.kpi[data-t]:hover,.kpi[data-goto]:hover,.kpi.go:hover{border-color:var(--accent)}
.kpi.off{opacity:.45;cursor:default}
.kpi.off:hover{border-color:transparent}
.card.flash{outline:2px solid var(--accent);outline-offset:2px}
.hitline{font-size:13px;color:var(--muted);margin-top:3px}
.kpi .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kpi .val{font-size:21px;font-weight:700;margin-top:3px}
.kpi .sub{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);padding:7px 9px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:8px 9px;vertical-align:top}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
/* карта симптомов */
.strip{display:flex;gap:2px;align-items:flex-end;min-height:22px}
.cell{width:11px;height:20px;border-radius:2px;background:var(--nonebg);flex:0 0 auto}
.dcell{width:5px;height:18px;border-radius:1px;background:var(--nonebg);flex:0 0 auto}
.stripwrap{overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
.striprow{display:flex;align-items:center;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);width:max-content;min-width:100%}
.striprow:last-child{border-bottom:0}
.striprow .nm{position:sticky;left:0;background:var(--card);width:190px;min-width:190px;font-size:13px;
  line-height:1.25;padding-right:10px;z-index:2;cursor:pointer}
.striprow .nm:hover{color:var(--accent)}
.axis{display:flex;gap:2px;font-size:10px;color:var(--muted)}
.axis span{width:11px;flex:0 0 auto;text-align:center}
.vsw{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.vsw button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:7px;
  padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.vsw button.on{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--accentbg)}
.medchip{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:0 5px 5px 0;font-size:13px}
.medchip b{color:var(--accent)}
.medchip.go{cursor:pointer}
.medchip.go:hover{border-color:var(--accent);color:var(--accent)}
.medlink{color:var(--accent);cursor:pointer;border-bottom:1px dashed currentColor}
.medlink:hover{border-bottom-style:solid}
.eprow td{vertical-align:top}
.tag2{display:inline-block;background:var(--nonebg);border-radius:6px;padding:2px 8px;font-size:12px;margin:0 4px 4px 0}
.fwrap{overflow-x:auto;padding-bottom:4px}
.fbars{display:flex;gap:3px;align-items:flex-end;height:92px;width:max-content;min-width:100%}
.fbar{width:24px;flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.fbar i{display:block;border-radius:2px 2px 0 0;background:var(--accent);min-height:2px}
.fbar b{text-align:center;font-size:10px;color:var(--muted);font-weight:600;line-height:1.1;margin-bottom:2px}
.fbar.zero i{background:var(--nonebg);height:2px}
.faxis{display:flex;gap:3px;font-size:10px;color:var(--muted);margin-top:4px;width:max-content;min-width:100%}
.faxis span{width:24px;flex:0 0 auto;text-align:center}
.faxis span.jan{color:var(--ink);font-weight:700}
.yband{display:flex;gap:3px;width:max-content;min-width:100%;margin-top:3px}
.yband div{flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:600;border-top:2px solid var(--line);
  padding-top:3px;text-align:center;overflow:hidden;white-space:nowrap}
.verdict{padding:9px 12px;border-radius:8px;font-size:14px;margin-top:10px}
.verdict.up{background:var(--badbg);color:var(--bad);font-weight:600}
.verdict.dn{background:var(--okbg);color:var(--ok)}
.verdict.flat{background:var(--nonebg);color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.symlink{cursor:pointer}
.symlink:hover{background:var(--hov,rgba(127,127,127,.09))}
.red-dot{color:var(--bad);font-weight:700}
.trend-up{color:var(--bad);font-weight:600}
.trend-dn{color:var(--ok);font-weight:600}
.logline{padding:9px 0;border-bottom:1px solid var(--line)}
.logline:last-child{border-bottom:0}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:700;color:#fff}
@media(max-width:640px){.striprow .nm{width:130px;min-width:130px;font-size:12px}}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.s-ok{background:var(--okbg);color:var(--ok)} .s-warn{background:var(--warnbg);color:var(--warn)}
.s-bad{background:var(--badbg);color:var(--bad)} .s-none{background:var(--nonebg);color:var(--none)}
.tag{display:inline-block;background:var(--accentbg);color:var(--accent);border-radius:6px;
  padding:1px 7px;font-size:12px;margin:1px 3px 1px 0}
.muted{color:var(--muted)}
.body-wrap{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;align-items:start}
@media(max-width:780px){.body-wrap{grid-template-columns:1fr}}
.organ{cursor:pointer}
.organ circle{transition:r .12s}
.organ:hover circle.dot{r:23}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:10px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:5px}
.olist{display:flex;flex-direction:column;gap:7px;max-height:520px;overflow:auto}
.orow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:9px;
  background:var(--bg);cursor:pointer;border:1px solid transparent}
.orow:hover{border-color:var(--accent)}
.orow .ic{font-size:18px;line-height:1.2}
.orow b{display:block;font-size:14px}
.orow span{font-size:12.5px;color:var(--muted)}
.dot.dxrow{cursor:pointer}
.dxrow:hover{background:var(--hov,rgba(127,127,127,.09))}
.dxrow td:last-child{color:var(--acc,#2b5fd9);font-weight:600}
mark{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:6px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:5px 11px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chart{width:100%;height:190px}
.chart text{font-size:10px;fill:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted)}
details{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
summary{cursor:pointer;font-weight:600}
.note{background:var(--warnbg);border-radius:9px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.src{font-size:12px;color:var(--muted);margin-top:10px}
mark{background:#ffe680;color:#000;border-radius:3px}
tr.row{cursor:pointer} tr.row:hover td{background:var(--accentbg)}
.modal{position:fixed;inset:0;background:#0008;display:none;z-index:50;padding:20px;overflow:auto}
.modal.on{display:block}
.mbox{max-width:640px;margin:30px auto;background:var(--card);border-radius:14px;padding:20px;position:relative}
.mclose{position:absolute;top:12px;right:12px;border:0;background:var(--bg);color:var(--ink);
  width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px}
.gobtn{margin-top:16px;width:100%;border:0;background:var(--accent);color:#fff;padding:11px;
  border-radius:10px;cursor:pointer;font:inherit;font-weight:600}
.back{border:0;background:var(--accentbg);color:var(--accent);padding:6px 12px;border-radius:99px;
  cursor:pointer;font:inherit;font-size:13px;font-weight:600;margin-bottom:12px}
.soon{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.soonitem{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--bad);
  border-radius:10px;padding:11px 13px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.soonitem:hover{border-color:var(--accent)}
.soonitem b{font-size:14px;line-height:1.35}
.soonitem .s-warn~b{}
.soonitem:has(.s-warn){border-left-color:var(--warn)}
</style>
</head>

<main id="main"></main>

  attention:[
    {p:1,t:"Онкогенетика: консультация + панель (BRCA1/2, PTEN)",w:"РМЖ у матери в 30–32 года",d:"никогда не делалось",st:"bad",sys:"gen",fam:1,
     why:"Рак молочной железы у родственницы первой линии до 45 лет — самостоятельное показание к генетическому тестированию, а в 30 лет — прямое. Наблюдение принято начинать за 10 лет до возраста родственницы на момент диагноза: 30 − 10 = 20 лет. Смотреть нужно панелью, а не только BRCA1/2: рак груди в 30 лет плюс удалённая щитовидная железа у одного человека — узнаваемая комбинация (синдром Коудена, ген PTEN).",
     facts:["Мать умерла от РМЖ, диагноз в 30–32 года","У матери же — практически полностью удалённая щитовидная железа","Свои: фиброзно-кистозная мастопатия, плотность желёз ACR C","Результат теста определяет протокол наблюдения на всю жизнь: при BRCA+ добавляется ежегодная МРТ молочных желёз и обсуждается удаление яичников"]},
    {p:2,t:"Эндокринолог по предиабету + инсулин, HOMA-IR, повтор HbA1c",w:"6,0 % и растёт",d:"назначено 08.2022",st:"bad",sys:"endo",fam:1,
     why:"HbA1c показывает средний сахар за три месяца: до 5,6 % — норма, 5,7–6,4 % — предиабет. Углеводный обмен сломался ещё до второй беременности: в августе 2021 было 6,2 % и ПГТТ 10,83. Контроль, назначенный «через 6 месяцев» в августе 2022, состоялся через 3 года 8 месяцев.",
     facts:["HbA1c: 5,30 (2019) → 6,2 (2021) → 5,2 на инсулине (2022) → 6,0 (2026)","Два гестационных диабета на инсулине","Мониторинг FreeStyle Libre 2026: ночью 4,5–5,5, но пики после еды до 9,8","Ожирение 1 степени, ИМТ 31,2","Мать и бабушка — сахарный диабет 2 типа"]},
    {p:3,t:"Дневник АД 2 недели или СМАД + терапевт",w:"«хроническая АГ» висит неподтверждённой",d:"с 2022",st:"bad",sys:"heart",
     why:"Роддом в 2022 г. записал «хроническую артериальную гипертензию» в перечень перенесённых заболеваний, но после родов ни один терапевт диагноз не подтвердил и не снял: терапии нет, диспансерного наблюдения нет. Разовые замеры в кабинете эпизоды не ловят — нужен дневник две недели или СМАД, и по результату либо снять диагноз, либо начать лечить.",
     facts:["Дневник 11–12.2021: до 151/88 на 6-й неделе беременности, допегит утром и вечером","Терапия шла с 6-й недели — вдвое раньше порога в 20 недель, поэтому «хроническая», а не «гестационная»","01–03.2024: эпизод 140/90 тянулся два месяца, лечения и исхода нет","АД не измерялось врачом с 13.09.2023","Фон: холестерин 5,76, ЛПНП 3,27, предиабет, ИМТ 31"]},
    {p:4,t:"УЗИ малого таза",w:"узел 42 мм, образование яичника 36 мм",d:"с 10.2023",st:"bad",sys:"repro",
     why:"Самый быстрый рост во всём архиве: объём матки утроился за 14 месяцев, доминантный узел прибавил 50 % за год. И с тех пор три года без контроля. Отдельно — образование 36 мм в единственном оставшемся яичнике.",
     facts:["Объём матки: 31 мл (08.2022) → 53 мл (08.2023) → 84 мл (10.2023)","Доминантный узел: 28 → 35 → 42 мм","Образование яичника 36 × 30 × 32 мм, O-RADS 2 (10.2023)","Левый яичник удалён в 2017 г. — остался один","В протоколе 02.10.2023 стороны перепутаны: «левый» относится к оставшемуся правому","Рост сдерживает Мирена, установленная 02.10.2023"]},
    {p:5,t:"Ферритин, витамин D, B12, фолаты",w:"ферритин 12,1 в 2022, кровопотеря 2500 мл",d:"с 07.2022",st:"bad",sys:"vit",
     why:"Ферритин — запас железа: он падает задолго до гемоглобина и восстанавливается последним. Гемоглобин сейчас нормальный (128), но это не значит, что запас восстановился — гемоглобин дефицит скрывает. Витамин D, B12 и фолаты не сдавались ни разу за всю историю.",
     facts:["Ферритин 12,1 нг/мл (05.2022) — выраженный дефицит; полноценным считается выше 30","На фоне лечения поднялся до 32,0 (07.2022) и больше не проверялся","Железо сыворотки: 16,5 → 8,3 → 7,5 → 11,5","Кровопотеря 2500 мл при вторых родах","Обильные менструации, две беременности с анемией, Hb 96 после первых родов"]},
    {p:6,t:"Офтальмолог: осмотр глазного дна с мидриазом",w:"ПВХРД, ПЗО 25,9",d:"последний 11.05.2022",st:"bad",sys:"eye",
     why:"Лазерная коррекция исправила рефракцию, но не строение глаза: переднезадняя ось осталась 25,9 мм, сетчатка растянута, риск разрывов и отслойки пожизненный. Осмотр глазного дна с широким зрачком нужен раз в год — последний полноценный был в мае 2022 года.",
     facts:["ПВХРД обоих глаз; слева зона предразрыва отграничена лазером 27.03.2019","ПЗО 25,94 / 25,95 мм (2021) — норма около 23–24 мм","Осмотр с мидриазом рекомендован повторно 10.03.2026, не выполнен","ВГД 6/6 в 2026 — заниженное измерение после LASIK, об операции нужно предупреждать врача"]},
    {p:7,t:"Ревмопробы (РФ, АЦЦП, СРБ)",w:"«артроз» выставлен без анализов",d:"с 04.2026",st:"warn",sys:"spine",
     why:"Диагноз «артроз мелких суставов кистей» выставлен 03.04.2026 по жалобам, без единого анализа. Симметричные боли в мелких суставах кистей — та картина, которую положено разводить с воспалительными артритами, а это делается анализами.",
     facts:["Жалобы: симметричные боли во всех суставах кистей (04.2026)","Ревмопробы (РФ, АЦЦП) не сдавались ни разу","Рентген мелких суставов назначался ещё 22.01.2018 — результата в архиве нет"]},
    {p:8,t:"Невролог + МРТ грудного отдела с контрастом",w:"расширенные арахноидальные пространства",d:"с 12.2022",st:"warn",sys:"neuro",
     why:"МРТ 07.12.2022 описала расширение задних арахноидальных пространств на уровне Th2–Th11 с формулировкой «возможно вариант нормы, не исключены спаечный процесс или аномальные сосуды». Обе рекомендации — МРТ с контрастом и осмотр невролога — не выполнены.",
     facts:["МРТ 2022: гемангиомы Th4 и Th7 до 7 мм, протрузия Th11–Th12","Поясничный лордоз из «сохранён» (2018) стал «усилен» (2022)","Невролог последний раз осматривал 08.02.2019"]},
    {p:9,t:"Печёночные пробы",w:"был холестаз с АЛТ 63,5",d:"с 07.2022",st:"warn",sys:"liver",
     why:"Внутрипечёночный холестаз беременных в 2022 г. подтверждён лабораторно и разрешился после родов, как и должно быть. Но с июля 2022 года печёночные пробы не сдавались ни разу — в биохимии 15.04.2026 их просто нет. Холестаз беременных — самостоятельный фактор риска желчнокаменной болезни в дальнейшем.",
     facts:["АЛТ: 18,3 (12.2021) → 63,5 (05.2022) → 19,2 (07.2022)","После 07.2022 АЛТ, АСТ, ГГТ и билирубин не проверялись","Сопутствует: перегиб жёлчного пузыря, ожирение, колебания веса"]},
    {p:10,t:"УЗИ шейных лимфоузлов",w:"узел 4 см описан один раз и потерян",d:"с 06.2022",st:"warn",sys:"lymph",
     why:"На приёме терапевта 22.06.2022 описан шейный лимфоузел 4 см. Больше он не упоминается нигде: ни УЗИ, ни повторного осмотра, ни записи о том, что он уменьшился. Узел такого размера либо имеет объяснение, либо требует проверки.",
     facts:["Единственное упоминание — приём терапевта 22.06.2022, через 10 дней после вторых родов","Ни одного контрольного исследования","На фоне отягощённой онконаследственности такие находки не оставляют без ответа"]}

  attention:[
    {p:1,t:"Забор крови 24.09.2026: ферритин, ТТГ, анти-тТГ IgA + общий IgA",w:"6 недель от старта Тотемы",d:"назначено 15.08.2026",st:"bad",sys:"blood",fam:1,
     why:"Врач назначила контроль только через три месяца — промежуточную точку берём сами, чтобы не потерять полкурса, если препарат не работает. Ровно это случилось у Дани: Мальтофер за 11 месяцев не поднял ферритин, а увидели это поздно. Три вопроса закрываются одной иглой: работает ли железо, в порядке ли щитовидка и не мешает ли всасыванию целиакия.",
     facts:["Ферритин 12,75 нг/мл при норме от 21,81 (10.08.2026) — депо пустое","Гемоглобин 117 при норме от 115 — анемии ещё нет, это стадия истощения запасов","MCH 26,1, MCHC 321, MCV 81,5 — все три у нижней границы","Общий белок 61 при норме от 65 плюс лёгкая стеаторея — повод проверить всасывание","Цель по ферритину 40–50, а не нижняя граница нормы","Условия: та же лаборатория, глютен в рационе перед скринингом целиакии"]},
    {p:2,t:"Медосмотр перед школой до 01.09.2026 — закрыть Манту",w:"проба 2024 сомнительная, повтора нет",d:"с 2024",st:"bad",sys:"immun",
     why:"Школа требует актуальный результат пробы или Диаскинтест. Сомнительная проба 2024 года (гиперемия 5 мм) без повтора — это открытый хвост в форме 026/у, из-за которого справку могут не принять. Отдельная сложность: аллерголог запретил пробы в апреле–августе, то есть окно на пробу узкое.",
     facts:["Манту 2024 — сомнительная, гиперемия 5 мм","БЦЖ-М сделана в 2020","Данных о повторной пробе после 2024 нет","Сезонное ограничение аллерголога: без проб и прививок апрель–август","Пройдены: педиатр 08.2026, невролог 10.08.2026, ЛОР — без отклонений, хирург-ортопед 16.08.2026","Остались: стоматолог (14.09.2026) и вопрос по группе физкультуры"]},
    {p:3,t:"Психиатр 07.09.2026 — приём идёт по энурезу",w:"почти три года, 5 мокрых ночей из 7",d:"с 21.11.2023",st:"bad",sys:"uro",
     why:"Невролог 10.08.2026 свою линию закрыл и передал энурез психиатру. Формулировать приём нужно именно как «энурез», а не «по поведению» — иначе разговор уедет в характер и внимание, а лечить будут не то. С собой — счёт сухих ночей по неделям: без ряда любой отклик не отличить от спонтанного улучшения, которое само по себе бывает у 15 % детей в год.",
     facts:["Ночной энурез с 21.11.2023, на 08.2026 сохраняется","Базовая неделя 09–15.08.2026: 2 сухих ночи из 7","4 и более мокрых ночи в неделю — частый энурез","Диабет и инфекция сняты: анализ мочи 10.08.2026 полностью чистый, глюкоза 4,99","Рентген пояснично-крестцового отдела 15.08.2026 сделан именно по этому поводу","Ночные подъёмы без полного пробуждения к сухим ночам не приближают"]},
    {p:4,t:"Ортопед (Зыков) повторно 24–28.08.2026",w:"длину ног мерили лёжа, тест Адамса не делали",d:"с 09.08.2026",st:"bad",sys:"ortho",
     why:"Лёжа не отличить истинное укорочение ноги от кажущегося: перекос таза даёт ту же картину. Тест Адамса — наклон вперёд — единственная простая проба, которая отделяет структурный сколиоз от нарушения осанки, и её не делали ни разу. Плюс степень плоскостопия появилась в школьной форме без плантографии, а группа по физкультуре в карте стоит первой при том, что кувырки запрещены неврологом.",
     facts:["Укорочение правой ноги 0,5 см, измерено линейкой лёжа 16.08.2026","Тест Адамса не проводили — подтверждено 16.08.2026","Плоскостопие 1–2 степени появилось в форме 026/у 16.08.2026, ортопед 09.08.2026 степень не ставил","Стельки Ortman pro — рекомендация марки, реклама сети выдана на приёме","В форме 026/у у хирурга стоит «Здоров», ограничений нет","Кувырки запрещены неврологом 10.08.2026, в школьную карту это не попало"]},
    {p:5,t:"Невролог повторно — решить по позвоночнику",w:"три специалиста, три мнения, ни одного решения",d:"с 10.08.2026",st:"bad",sys:"spine",
     why:"Ортопед 09.08.2026 говорит про осанку и стельки, невролог 10.08.2026 нашёл искривление и связал головные боли с позвоночной артерией, хирург 16.08.2026 записала диагноз в школьную форму и вернула вопрос неврологу. Круг замкнулся, снимок сделан, а плана наблюдения нет. Нужен один человек, который сведёт это в решение: наблюдать, ЛФК или что-то ещё.",
     facts:["Невролог 10.08.2026: искривление позвоночника, версия про пережатие позвоночной артерии","Дуплекс БЦА 08.01.2026: умеренная непрямолинейность хода обеих позвоночных артерий, гемодинамика не нарушена","Дуплекс транскраниальный и вены шеи 08.01.2026 — норма","Рентген пояснично-крестцового отдела 15.08.2026 сделан","Направление на рентген грудного и шейного отделов выдано, делать не советуют","ЛФК ежедневно, бассейн 2 раза в неделю с 29.07.2026"]},
    {p:6,t:"ЭхоКГ — контроль малых аномалий сердца",w:"не делали с 13.11.2020, шесть лет",d:"с 11.2020",st:"bad",sys:"heart",
     why:"Открытое овальное окно уменьшается правильно, с 1,4 до 1,0 мм, и само по себе не мешает. Но малые аномалии смотрят раз в 1–2 года, а здесь пропущено три интервала. Отдельно к тому же приёму — вопрос по QTc: цифра выросла с 0,39 до 0,43 за 17 месяцев, оба значения в норме, но направление одно, и это меняет список безопасных лекарств.",
     facts:["ООО 1,4 мм (17.07.2019) → межпредсердное сообщение 1,0 мм (13.11.2020)","Фракция выброса 72 % → 67,8 % — обе в норме","Дополнительные хорды левого желудочка","QTc 0,39 (06.03.2025) → 0,43 (06.08.2026) при границе 0,44","ЭКГ 06.08.2026: синусовая аритмия, ЧСС 82 — возрастная норма","Допуск к спорту дан 07.04.2026"]},
    {p:7,t:"Аллерголог до марта 2027 — пересмотреть ограничения 2023 года",w:"пищевые запреты не подтверждались три года",d:"с 13.03.2023",st:"bad",sys:"allerg",
     why:"Лекарственная схема свежая, её переназначили 20.04.2026. А пищевые ограничения и запрет фитопрепаратов держатся с марта 2023 года и с тех пор ни разу не проверялись — ребёнок три года ест по списку, который могли уже перерасти. Успеть надо до сезона берёзы: в обострение пробы не делают. Тем же приёмом закрываются освобождение от физкультуры на улице и панель на сорные травы.",
     facts:["Ограничения аллерголога ГБУЗ ДГП №48 от 13.03.2023: не применять фитопрепараты, исключения по еде","Сезонные ограничения апрель–август: без прививок, Манту, плановых операций","Сенсибилизация 20.04.2026: пыльца деревьев (+++), молоко (+)","IgE к ранне- и поздноцветущим деревьям 3,00 и 2,80 при норме до 0,35","Общий IgE 76,9 при норме до 52 (21.04.2026)","Эозинофилы выросли 0,23 → 0,40 вне сезона берёзы — панель по травам не делали"]},
    {p:8,t:"Справка об ограничениях по физкультуре к 1 сентября",w:"кувырки запрещены, в карте стоит I группа",d:"с 10.08.2026",st:"bad",sys:"ortho",
     why:"Расхождение между тем, что сказал невролог, и тем, что записано в школьной карте. Школьный учитель физкультуры читает карту, а не чужие заключения. Без письменного ограничения гимнастика с кувырками будет по умолчанию разрешена.",
     facts:["Кувырки запрещены неврологом 10.08.2026, плавать можно","В карте с 29.04.2025 стоит «физкультура I группа»","В форме 026/у у хирурга 16.08.2026 — «Здоров», ограничений нет","Отдельно нужно освобождение от физкультуры на улице в апреле–мае (сезон берёзы)","Запись в форме 026/у от руки читается с трудом — просить печатное заключение"]},
    {p:9,t:"25(OH)D — измерить в ноябрьское окно",w:"не измеряли ни разу",d:"никогда",st:"warn",sys:"vit",
     why:"Ночные боли в ногах шли с апреля 2024 года и так и не разобраны, а дефицит витамина D даёт ровно такие боли плюс мышечную слабость. Сдавать имеет смысл в окне ноябрь–февраль: летом цифра завышена солнцем и ничего не значит.",
     facts:["25(OH)D не измеряли ни разу","Жалобы на боли в ногах, включая ночные, с 04.2024","Ориентир по дате — 12.11.2026, к ноябрьскому забору","Цинк 13,0 (норма 11,1–19,5) и селен 78,1 (норма 23–190) — 03.2026, оба в норме"]},
    {p:10,t:"Соскоб на энтеробиоз, трёхкратно",w:"эозинофилы 7,7 % требуют второй версии",d:"не делался",st:"warn",sys:"gi",
     why:"Аллергия объясняет эозинофилию, но не единственная. Вторая причина — паразиты, и копрограмма их не заменяет: яйца остриц в кале почти не находят, нужен перианальный соскоб, причём трёхкратный — одна проба ловит меньше половины случаев.",
     facts:["Эозинофилы 7,7 % / 0,40 при норме до 5 % (10.08.2026)","Копрограмма 10.08.2026: паразитов, крови, лейкоцитов и слизи нет","Одна проба копрограммы — недостаточная чувствительность","Альтернатива по лямблиям — антиген в кале методом ИФА"]},
    {p:11,t:"Стоматолог 14.09.2026",w:"ни одного осмотра в файле",d:"с 2019",st:"warn",sys:"teeth",
     why:"Плановая часть медосмотра перед школой и единственная система, по которой в архиве вообще нет записей после справки о санации 2019 года. Идёт вместе с Даней.",

  attention:[
    {p:1,t:"Гематолог: получить целевой ферритин и дату окончания курса",w:"дозу вернули сами 17.08.2026, но цели и срока по-прежнему нет",d:"висит с 01.2026",st:"bad",sys:"blood",fam:1,by:"записаться",
     why:"Дозу вернули 17.08.2026 решением родителей, без врача — по арифметике из таблицы фаз: на 50 мг в сутки ферритин рос по 7,6 в месяц, на 18,4 не рос вообще. Это закрывает главную дыру, но не все. Остаются две цифры, которых нет в данных с января: до какого ферритина лечим и когда курс заканчивается. Без них курс кончится там, где кончится упаковка. Разговор вести цифрами из таблицы, а не ссылками на прошлые приёмы: приём был по ОМС, врач не вникал.",
     facts:["02.2025 → 01.2026, Мальтофер 11 месяцев: ферритин 25 → 15, минус 0,9 в месяц","16.01 → 19.03.2026, Тотема 50 мг/сут: 15 → 32, плюс 7,6 в месяц","19.03 → 10.08.2026, Тотема 18,4 мг/сут: 32 → 27, прирост ноль","С 17.08.2026 лечебная доза возвращена — решением родителей, врач не участвовал","Восемь недель от 17.08 — контроль около 12.10.2026","Уточнить и записать: точную дозу фазы 3 и фактический первый день","Из 18 месяцев лечения продуктивными были два","32 → 27 — это не падение: критическая разница для ферритина около 40 %, здесь 16 %","Норма лаборатории по ферритину — от 30,0 мкг/л","Ферритин сдаётся на фоне терапии, отменять приём ради анализа не нужно"]},
    {p:2,t:"Забор крови одной иглой: ферритин, ОАК с лейкоформулой, ретикулоциты, СРБ, цинк, ТТГ, общий IgE",w:"10.08.2026 сдали только железо и ферритин",d:"назначено было полностью",st:"bad",sys:"blood",
     why:"Пять открытых строк закрываются одним проколом, а ребёнку четыре года — второй заход дорого стоит всем. Главная дыра — гемоглобин: последний раз мерили 13.01.2026, семь месяцев назад, и без ОАК не видно, откатилась анемия или нет. Ретикулоциты — самый ранний маркер отклика, растут за 5–7 дней, и именно их не сдали. СРБ нужен, чтобы знать, не завышен ли ферритин воспалением.",
     facts:["10.08.2026 назначены были ОАК, ферритин и ретикулоциты — сдали только железо и ферритин","Гемоглобин последний раз 13.01.2026 — 107 г/л, порог анемии ВОЗ для возраста 110","Цинк не измеряли ни разу; Диме мерили — 13,0 мкмоль/л","ТТГ не измеряли ни разу за четыре года","Общий IgE не сдавался, хотя эозинофилы дважды были выше нормы","Пауза 24–48 часов нужна только для сывороточного железа, ферритину она не нужна"]},
    {p:3,t:"ЭхоКГ и ЭКГ одним визитом — 31.08.2026",w:"ООО 2,0 мм, контроль не делали четыре года",d:"с 06.07.2022",st:"bad",sys:"heart",
     why:"Протокол ЭхоКГ нашёлся внутри комплексного УЗИ от 06.07.2022: окно уменьшилось с 2,8 до 2,0 мм, артериальный проток закрылся, фракция выброса 69 %. Там же стоит рекомендация «контроль в динамике», которую не выполнили ни разу за четыре года. ЭКГ за жизнь одна, от 14.06.2023, и на ней синусовая брадикардия. Перед стартом бассейна обе процедуры нужны в любом случае — берём одним визитом.",
     facts:["ООО 2,8 мм при выписке (24.06.2022) → 2,0 мм (06.07.2022)","Открытый артериальный проток 1,9 мм закрылся","Фракция выброса 69 %, ускорение кровотока описано","ЭКГ 14.06.2023: ЧСС 95 при возрастной норме 120–125; интервалы в норме","Бассейн планируется с сентября 2026","Записаны на 31.08.2026, обе процедуры за один заход"]},
    {p:4,t:"Контрольный ферритин, ОАК и ретикулоциты — 12.10.2026",w:"8 недель на лечебной дозе",d:"держим дату сами",st:"bad",sys:"blood",
     why:"Главный урок этой истории: за 18 месяцев ни одна контрольная точка не была взята вовремя. В 2025-м отсутствие отклика на Мальтофер было видно уже через пять недель, а следующий анализ сдали через шесть с половиной месяцев — препарат меняли одиннадцать месяцев. В апреле 2026 Денис собирался мерить через шесть недель, врач отговорил, померили через три с половиной месяца. Дату держим сами и сдаём по ней, независимо от «попейте ещё, потом померяем».",
     facts:["Отсчёт от 16.08.2026 — фактическую дату старта лечебной дозы надо сверить","Ретикулоциты растут за 5–7 дней — они покажут отклик раньше ферритина","Если за 8 недель на лечебной дозе ферритин не вырастет — тогда скрининг целиакии","Единственная непрерывная линия в этой истории — сам Денис","Каждый раз, когда что-то сдвигалось, это происходило после появления цифры"]},
    {p:5,t:"Целевой ферритин и срок курса — получить цифру и дату",w:"в данных нет ни того, ни другого",d:"висит с 01.2026",st:"bad",sys:"blood",
     why:"Пункт открыт с января 2026: сколько ещё принимать препарат и до какой цифры — не записано нигде. Без цели курс кончается там, где кончилась упаковка. Отдельный вопрос, который лучше задать сразу: ребёнку, который не ест красное мясо, может быть нужен не курс с отменой, а постоянная поддерживающая доза.",
     facts:["Поддерживающую дозу назначать только выше ферритина 40, а не 30","19.03.2026 на поддерживающую перешли при 32 — на этом и развалилось","Даты окончания курса в данных нет","Решение «курс или постоянная поддержка» лучше принять осознанно, а не по факту окончания пачки"]},
    {p:6,t:"Меню под текстуру, а не «заставить есть мясо»",w:"дело не в мясе и не в размере кусочка",d:"проверено дома 11.08.2026",st:"warn",sys:"gi",
     why:"Домашние пробы уточнили правило и сделали задачу решаемой. Котлеты идут, а просто пожаренный говяжий фарш — нет, при том же мясе и том же размере частиц. Мелко порезанный шашлык — неохотно. Значит, дело в сухости и рассыпчатости: проходит мягкое, влажное, связное и узнаваемое. Состав фарша целиком в руках взрослых, а коридор у Дани уже, чем у Димы, — меню строить под него, старший съест то же самое.",
     facts:["Котлеты ест; пожаренный говяжий фарш не ест; мелко порезанный шашлык — неохотно","Формулировка «не ест мясо» неточна и вводит врачей в заблуждение","Гемовое железо из говядины, телятины и печени усваивается в разы лучше, чем из круп","Витамин C рядом усвоение повышает; чай, молоко и кальций рядом — снижают","Растёт нормально и физически силён — калорий хватает, проблема не в количестве"]},
    {p:7,t:"Стоматолог — 14.09.2026",w:"ни одного осмотра за четыре года",d:"никогда",st:"warn",sys:"teeth",
     why:"Больной зуб — самая простая причина того, что ребёнок ест долго и мучительно, и она проверяется одним визитом. Прежде чем разбирать сенсорику и текстуру, эту версию надо просто снять. Идёт вместе с Димой.",
     facts:["Ни одного осмотра стоматолога не записано","Ест долго и с сопротивлением, независимо от того, что положили","Приём назначен на 14.09.2026, вместе с братом"]},
    {p:8,t:"Дышит ли ртом",w:"ртом нельзя одновременно дышать и жевать",d:"не выяснено",st:"warn",sys:"ent",
     why:"При заложенном носе или больших аденоидах еда физически растягивается: ребёнок вынужден прерываться на дыхание. У Дани были два эпизода с хрипами и Пульмикортом, так что верхние и нижние дыхательные пути в этой истории уже отметились. Наблюдение бесплатное — достаточно посмотреть, как он спит и как ест.",
     facts:["Два эпизода хрипов и затруднённого дыхания: 10.2023 и 04.2024, оба на Пульмикорте","До 02.2023 получал профилактику РСВ — лёгкие считались уязвимым местом","У брата Димы этот вопрос закрыли наблюдением: спит с закрытым ртом, храпа нет","При любом кашле с хрипами говорить врачу про оба прошлых эпизода"]},
    {p:9,t:"Цинк — измерить, ни разу не мерили",w:"дефицит цинка снижает вкус и аппетит",d:"никогда",st:"warn",sys:"vit",
     why:"Цинк ходит в паре с дефицитом железа и напрямую бьёт по вкусу и аппетиту — то есть по той самой жалобе, вокруг которой всё крутится. Диме его измерили, Дане нет. Сдаётся из той же пробирки, что и ферритин, отдельного захода не требует.",
     facts:["Цинк не измеряли ни разу за четыре года","У Димы 13,0 мкмоль/л при норме 11,1–19,5 (07.03.2026)","B9 12,2 нг/мл и B12 415 пг/мл (18.02.2026) — оба в норме","Входит в общий список ближайшего забора"]},
    {p:10,t:"Измерить давление на плановом осмотре",w:"гипертония в роду с дебютом «со школы»",d:"не измеряли",st:"warn",sys:"heart",
     why:"У бабушки по отцовской линии гипертония началась «со школы» — ранний старт в роду уже был. Детям давление часто не меряют вовсе, поэтому надо попросить отдельно и проследить, чтобы взяли детскую манжету: на взрослой цифра завышается.",
     facts:["Гипертония у бабушки по линии отца с дебютом «со школы»","Ни одного измерения АД в файле","Тот же пункт открыт и у брата Димы"]},
    {p:11,t:"ТТГ — ни разу за четыре года",w:"щитовидная линия по маме нагружена",d:"никогда",st:"warn",sys:"thyro",
     why:"У мамы гипотиреоз, у бабушки по маминой линии щитовидная железа удалена почти полностью. Это та же линия, по которой открыт вопрос у Димы. Один показатель, входит в общий забор.",
     facts:["ТТГ не измеряли ни разу","Гипотиреоз у мамы (выписка 2019)","У бабушки по маминой линии железа удалена почти полностью, пожизненно L-тироксин","У брата Димы этот же пункт стоит в заборе 24.09.2026"]},
    {p:12,t:"Скрининг целиакии — запасной сценарий",w:"первый шаг всё-таки доза",d:"условно",st:"warn",sys:"gi",
     why:"Не первый шаг: недодоза железа объясняет картину полностью, и пока эта версия не отработана, гонять ребёнка на дополнительные анализы незачем. Но если на лечебной дозе за восемь недель ферритин не вырастет — тогда анти-тТГ IgA плюс общий IgA. Сиблинговый риск здесь около 10 % против 1 % в популяции, и у брата тот же пустой запас.",
     facts:["У обоих детей депо железа не держится годами","Риск целиакии у сиблингов около 10 % против 1 % в популяции","Условие запуска: 8 недель на лечебной дозе без прироста ферритина","Перед скринингом глютен должен быть в рационе, иначе анализ ложноотрицательный"]},
    {p:13,t:"Прививка от гриппа — 07.09.2026",w:"делаем ежегодно, последняя 05.09.2025",d:"по календарю",st:"warn",sys:"immun",
     why:"Плановая ежегодная прививка, идёт вместе с Димой одним походом. Остальной календарь закрыт полностью, включая завершённый курс Синагиса и Менактру.",
     facts:["Последняя прививка от гриппа 05.09.2025, Ультрикс Квадри","Календарь закрыт: АКДС+ИПВ+Хиб R1, гепатит A и B завершены, корь, краснуха, паротит, пневмококк, менингококк","Манту 18.05.2026 сомнительная — плановая следующая в 2027, фтизиатр не нужен"]}

  attention:[
    {p:1,t:"Один забор крови: HbA1c, свободный тестостерон, анти-ТПО, липопротеин(а), ГГТ, мочевая кислота, АЛТ/АСТ, 25(OH)D, группа крови",w:"девять висящих вопросов закрываются одним походом",d:"назначено 08.2022 и 01.2026",st:"bad",sys:"endo",
     why:"Каждый из этих показателей отдельно уже висит в открытых вопросах, а сдаются они из одной пробирки. Три решают счётчик метаболического синдрома, анти-ТПО закрывает связку витилиго и ползущего ТТГ, липопротеин(а) сдаётся один раз в жизни и получил основание после ЭхоКГ, а мочевую кислоту и печёночные надо переснять в чистых условиях. Условие одно и жёсткое: трое суток без алкоголя, утро, натощак.",
     facts:["HbA1c 5,7 % (15.04.2025) — нижняя граница коридора преддиабета 5,7–6,4","Тестостерон 8,93 нмоль/л — «серая зона» 8–12; сама лаборатория написала «нужен свободный»","Анти-ТПО не сдавались ни разу, при витилиго это стандарт; ТТГ 1,57 → 2,46 → 2,81 за два года","Липопротеин(а) — показание появилось после уплотнения створок АК в 40 лет при ЛПНП 2,7","Забор 08.08.2026 прошёл после вечернего пива — мочевая кислота 439 и АЛТ 48,1 по нему не трактуются","Витамин D не проверяли с 12.2023, когда был дефицит с симптомами","Группа крови записана только со слов — по словам не переливают"]},
    {p:2,t:"Офтальмолог, февраль 2027: ОКТ зрительного нерва + периметрия + ПЗО",w:"глаукома у отца, матери и бабушки",d:"наблюдение раз в 6 месяцев",st:"bad",sys:"eye",fam:1,
     why:"Прежний план звучал так: «ВГД 20+ в феврале — повод для ОКТ». С таким анамнезом это неверно. Примерно у половины людей с глаукомой давление на разовом замере попадает в нормальный коридор, а поле зрения глаукома отнимает с периферии незаметно, и погибшие волокна не восстанавливаются. То есть ждать цифру 20+ означает ловить болезнь прибором, который у половины больных её не видит. Базовая точка по ОКТ и периметрии нужна независимо от давления.",
     facts:["Глаукома у обоих родителей и у бабушки по материнской линии — три поколения","Один родственник первой линии поднимает риск открытоугольной глаукомы в 4–9 раз, здесь их двое","Своё сверху: миопия средней степени (2–3× к риску) и ПЗО 26,5 мм","ВГД: 21/19 (2021) → 15/16 (2025) → 18,3/18,4 (2026) — всё в норме","Периметрия делалась один раз, в 2021: 113 точек, норма — вторая точка нужна и для этого ряда","ПЗО не измеряли ни в 2025, ни 14.08.2026 — два приёма подряд мимо","Пропуск февральского приёма — единственная реальная угроза по глазам"]},
    {p:3,t:"Решение по левому глазу: лазер или наблюдение",w:"истончения без отграничения, тип дистрофии не назван",d:"с 14.08.2026",st:"bad",sys:"eye",
     why:"На правом глазу очаги отграничены зрелыми коагулятами с пигментом — там всё сделано в 2021 году. На левом описаны дистрофические очаги и участки истончения без отграничения, тип дистрофии в заключении не назван, решение не вынесено. При ПЗО 26,5 мм и уже случившемся разрыве справа это самый прямой предиктор повторения — вопрос надо задать явно и получить ответ письменно.",
     facts:["OD: дистрофические очаги, отграниченные зрелыми ЛК с отложением пигмента","OS: дистрофические очаги и участки истончения, отграничения нет","Разрыв с локальной отслойкой на правом глазу уже был в 2021 году","Стекловидное тело прозрачное, мушки при этом есть постоянно, вспышек нет","Сторона лазера закрыта: правый, подтверждено осмотром 14.08.2026","Резкий прирост мушек, «сажа», «паутина», вспышки или тень — осмотр в течение суток, не дожидаясь февраля"]},
    {p:4,t:"Вернуться к дерматовенерологу или урологу по баланопоститу",w:"возбудитель определён, антибиотик по чувствительности не сработал",d:"явка была 08.10.2025",st:"bad",sys:"uro",
     why:"Десять месяцев без наблюдения при том, что диагноз до конца не поставлен. Идти надо не за лечением, а за диагнозом: инфекция исключена трижды, антибиотик, к которому возбудитель чувствителен по антибиотикограмме, эффекта не дал, а стероид дал временный. Такая картина заставляет спросить прямо про неинфекционные причины, включая генитальный псориаз — тем более что псориаз у отца есть.",
     facts:["Стойкое течение с начала 2025, эпизод был и в 2024","ПЦР-12 на ИППП 19.08.2025 — всё не обнаружено, включая кандиду","Посев 18.08.2025 — роста нет; посев 21.09.2025 — Streptococcus agalactiae 10⁷ КОЕ/мл","Амоксиклав не помог, хотя возбудитель к нему чувствителен (S)","Тридерм дал временный эффект, симптом возвращался","Ванночки с марганцовкой — улучшение на 10 дней","Анализ мочи 08.08.2026 чист: глюкозурии нет, грибов нет — сахар и кандида процесс не питают","Мытьё несколько раз в день с мылом само может поддерживать раздражение"]},
    {p:5,t:"Пересдать АЛТ, АСТ, ГГТ и мочевую кислоту в корректных условиях",w:"забор прошёл после вечернего пива",d:"с 08.08.2026",st:"bad",sys:"liver",
     why:"По цифрам от 08.08.2026 нельзя ни поставить гиперурикемию, ни трактовать рост АЛТ: накануне вечером было пиво, а оно поднимает мочевую кислоту на 30–60 мкмоль/л при том, что превышение здесь всего на 2,5 %. Отдельная дыра — ГГТ, которую в набор не включили: без неё непонятно, растёт печень от жира или от чего-то ещё.",
     facts:["АЛТ 36,6 (12.2025) → 48,1 (08.2026), рост на 31 % за 8 месяцев","АСТ 24,3 → 30,8; соотношение АСТ/АЛТ 0,64 — картина неалкогольной жировой болезни печени","Мочевая кислота 439 при норме до 428,4 — первое превышение в архиве","ГГТ была 25,9 в декабре, в августе не сдана","Алкоголь: одна банка пива в неделю — регулярной нагрузки на печень нет","Уратных кристаллов в моче нет, pH 5,5, плотность 1,025 — моча кислая и концентрированная","Условие пересдачи: трое суток без алкоголя"]},
    {p:6,t:"Кардиолог: липопротеин(а), коронарный кальций, срок повторной ЭхоКГ, SCORE2",w:"склероз створок клапана в 40 лет при нормальных липидах",d:"приём 22.08.2026",st:"bad",sys:"heart",
     why:"Первая в жизни ЭхоКГ дала базовую точку и два повода для разговора. Уплотнение стенок аорты и створок аортального клапана в 40 лет при ЛПНП 2,7 означает, что маркер обогнал липидограмму — обычная липидная панель этот риск не видит, а липопротеин(а) сдаётся один раз в жизни. Второе — ОТС 0,45: это та геометрия левого желудочка, которую даёт нагрузка давлением, при том что давление сейчас нормальное.",
     facts:["ЭхоКГ 15.08.2026: ФВ 68 %, камеры не расширены, гипертрофии нет, давление наполнения нормальное","ОТС 0,45 при норме до 0,42 — концентрическое ремоделирование, держится на одном миллиметре задней стенки","Аорта не расширена, но стенки и створки аортального клапана уплотнены; стеноза и регургитации нет","Визуализация на исследовании была затруднена","Три ЭКГ подряд чистые: 06.04.2025, 14.12.2025, 09.08.2026","Липиды все целевые: холестерин 4,3, ЛПНП 2,7, ЛПВП 1,15, триглицериды 1,28","Повторная ЭхоКГ — ориентир 2 года и обязательно та же клиника, иначе ОТС не сравнить","У матери гипертония с дебютом «со школы» — по давлению наследственность отягощена"]},
    {p:7,t:"Невролог по позвоночнику",w:"рекомендован два года назад, не пройден",d:"с 26.07.2024",st:"bad",sys:"spine",
     why:"Рентгенолог рекомендовал невролога в июле 2024 года. За два года остеохондроз из локального шейного стал распространённым — шейный, грудной и пояснично-крестцовый отделы. Мануальная терапия снимает обострение, но диагноз и план наблюдения не заменяет.",
     facts:["26.07.2024: начальные признаки остеохондроза и спондилоартроза шейного отдела","11.04.2025: рентген грудного отдела","14.03.2026: дорсопатия, распространённый остеохондроз — три отдела","Выпрямление шейного лордоза, остеофиты C5–C6","Эпизод 20.07–30.09.2024: головная боль, давление в шее, нарушение концентрации — два месяца","Сидячая работа, много времени за компьютером","Профилактические курсы мануальной терапии: 11.2025 и 03.2026"]},
    {p:8,t:"Сон: сдвинуть отбой раньше полуночи",w:"ни одной недели с засыпанием до полуночи за 23 недели",d:"март – август 2026",st:"bad",sys:"sleep",
     why:"Это не жалоба, а измеренный факт по трекеру за 23 недели подряд. Сон тянет за собой сразу три строки из этого же файла: тестостерон, вес и печень — все три ухудшаются от позднего отбоя и нерегулярности сами по себе, без других причин. Из всех открытых пунктов этот единственный не требует ни врача, ни анализа.",
     facts:["23 недели, март–август 2026: ноль недель с отходом ко сну до полуночи","Медиана отбоя 01:05, диапазон 00:28–02:17","Ноль недель с регулярностью в норме: 56–69 при норме 70–100","Средний сон около 7 часов","Тестостерон 8,93 — поздний отбой и ИМТ 27 снижают его сами по себе","Вес вырос на 2,8 кг с января при стабильных 9 000 шагов — рычаг не в шагах"]},
    {p:9,t:"Кал на скрытую кровь (FIT)",w:"плановый скрининг с 40 лет, ему 40",d:"никогда",st:"warn",sys:"gi",
     why:"Обычный возрастной скрининг: с 40 лет раз в два года, входит в диспансеризацию. Рак прямой кишки у деда в 75 лет порог не сдвигает — это популяционный риск, а не семейный. Просто первый раз выпадает на сейчас.",
     facts:["Возраст 40 лет — порог начала скрининга","Рак прямой кишки у деда по материнской линии, обнаружен в 75 лет","Наследственный сдвиг порога начинается с диагнозов до 60 лет у родственников первой линии","Периодичность — раз в 2 года"]},
    {p:10,t:"Силовая нагрузка и перезапуск бега",w:"выносливость не измерялась ни разу",d:"бег прервался 05.05.2026",st:"warn",sys:"fit",
     why:"Кардиореспираторная выносливость — один из самых сильных известных предикторов общей смертности, в крупных когортах сильнее холестерина, и у Дениса она не измерялась ни разу. Отдельно: после 40 лет без силовой нагрузки уходит примерно 0,5–1 % мышц в год, а мышцы — главный потребитель глюкозы. Силовая работа улучшает печень и сахар даже без потери веса.",
     facts:["Около 9 000 шагов в день стабильно с марта: март 9 521, апрель 9 216","9 пробежек в апреле — 05.05.2026, дальше перерыв","Каденс доведён со 117 до 146","Гипотеза срыва: темп вырос на треть за 8 дней","Силовых нагрузок нет ни одной","Сидячая работа — множитель к четырём уже записанным строкам: диабет, печень, тестостерон, остеохондроз"]},
    {p:11,t:"H. pylori после ЭГДС 2023 года",w:"при гастродуоденопатии обычно проверяют",d:"с 12.2023",st:"warn",sys:"gi",
     why:"ЭГДС 17.12.2023 показала эритематозную гастродуоденопатию. При такой картине H. pylori проверяют почти всегда, но в данных проверки нет, как нет и контрольной ЭГДС. Заодно стоит запросить в ЭМК заключение гастроэнтеролога — приём был, а документа не осталось.",
     facts:["ЭГДС 17.12.2023: умеренная гиперемия слизистой желудка и двенадцатиперстной кишки","Проверки на H. pylori в данных нет","Контрольной ЭГДС не было","Гастроэнтеролог пройден после 14.12.2025, со слов — нарушений нет, документов не сохранилось","Заключение должно лежать в ЭМК 6771715"]},
    {p:12,t:"Лимит подъёма тяжестей: 7 или 70 кг",w:"расхождение в десять раз",d:"с 14.08.2026",st:"warn",sys:"eye",
     why:"В заключении офтальмолога напечатано «более 7 кг», врач вслух сказала «более 70 кг». Разница принципиальная в быту: 7 кг запрещает брать детей на руки, 70 кг в обычной жизни не встречается вовсе. Смысл ограничения в любом случае про натуживание, а не про сам вес, но формулировку надо уточнить письменно.",
     facts:["Ограничение введено 14.08.2026 вместе с наблюдением раз в 6 месяцев под мидриазом","Устная версия «70 кг» — со слов Дениса","Режимные назначения того же приёма: правило 20/20 при работе за компьютером","Смысл ограничения — избегать натуживания при растянутой сетчатке"]},
    {p:13,t:"Спросить у родителей, оперированы ли они по катаракте",w:"в семье уже есть прецедент отказа, закончившийся слепотой",d:"открыто с 14.08.2026",st:"warn",sys:"gen",
     why:"Это вопрос не про Дениса через тридцать лет, а про зрение его родителей сегодня. Катарактальная слепота полностью предотвратима, операция по катаракте — одна из самых результативных в медицине. Бабушка от операции отказалась и практически ослепла. У обоих родителей катаракта прямо сейчас.",
     facts:["Катаракта и глаукома у отца и у матери","Бабушка по материнской линии отказалась от операции и к старости практически ослепла","Прабабушка тоже ослепла к старости, причина неизвестна","Оперированы ли родители — неизвестно","При длинном глазе ядерная катаракта развивается раньше среднего возраста"]},
    {p:14,t:"Промерить глубину пародонтальных карманов",w:"пародонтоз у обоих родителей",d:"ни разу",st:"warn",sys:"teeth",
     why:"Стоматолога наблюдает регулярно, УЗ-чистка делается, жалоб нет — базовая гигиена закрыта. Не хватает одной процедуры: промера карманов. Связь сахара и дёсен двусторонняя, а глюкоза стоит у порога, поэтому цифра нужна как отправная точка.",
     facts:["Пародонтоз у отца и у матери","Наблюдение регулярное, УЗ-чистка делается, проблем нет (уточнено 14.08.2026)","Глубину карманов не измеряли ни разу","Глюкоза натощак 5,58 — у порога ADA 5,6"]}

const el=(h)=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild};
const ru=(iso)=>{const[y,m,d]=iso.split("-");return `${d}.${m}.${y}`};
const yrs=(n)=>{const a=n%100,b=n%10;if(a>=11&&a<=14)return n+" лет";if(b===1)return n+" год";if(b>=2&&b<=4)return n+" года";return n+" лет"};
const esc=(s)=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
// ── Поиск: ё=е, окончания срезаются, все слова запроса должны встретиться где угодно в записи
const norm=(s)=>String(s).toLowerCase().replace(/\u0451/g,"\u0435");
const LET=/[\u0430-\u044fa-z0-9]/;
const stem=(t)=>{let x=t;while(x.length>4&&/[\u0430\u0435\u0438\u043e\u0443\u044b\u044d\u044e\u044f\u044c\u0439\u044a]$/.test(x))x=x.slice(0,-1);return x};
// каждое слово запроса → [само слово, его основа]; достаточно совпадения любого варианта
const toks=()=>{const t=query?norm(query).split(/\s+/).filter(Boolean):[];
  return t.map(x=>{const st=stem(x);return st!==x?[x,st]:[x]})};
const hit=(hay)=>{const t=toks();if(!t.length)return true;const h=norm(hay);
  return t.every(v=>v.some(x=>h.includes(x)))};
// границы совпадений; хвост слова дотягиваем, чтобы подсветка не рвала слово пополам
function marksOf(s){
  const t=toks();if(!t.length)return[];
  const h=norm(s),raw=[];
  t.forEach(v=>{const x=v.find(y=>h.includes(y));if(!x)return;
    let i=h.indexOf(x);
    while(i>=0){let e=i+x.length;
      if(LET.test(h[e-1]||""))while(e<h.length&&LET.test(h[e]))e++;
      raw.push([i,e]);i=h.indexOf(x,i+x.length)}});
  if(!raw.length)return[];
  raw.sort((a,b)=>a[0]-b[0]);
  const m=[];
  for(const p of raw){const last=m[m.length-1];
    if(last&&p[0]<=last[1])last[1]=Math.max(last[1],p[1]);else m.push([p[0],p[1]])}
  return m;
}
const hl=(s)=>{s=String(s);const m=marksOf(s);if(!m.length)return esc(s);
  let out="",pos=0;
  for(const p of m){out+=esc(s.slice(pos,p[0]))+"<mark>"+esc(s.slice(p[0],p[1]))+"</mark>";pos=p[1]}
  return out+esc(s.slice(pos))};
// кусок длинного текста вокруг первого совпадения — чтобы было видно, за что нашлось
function snip(txt){
  txt=String(txt||"");const m=marksOf(txt);if(!m.length)return"";
  const a=Math.max(0,m[0][0]-70),b=Math.min(txt.length,m[0][1]+110);
  return (a?"…":"")+txt.slice(a,b)+(b<txt.length?"…":"");
}

// что физически надо сделать по пункту — вместо оценки тревожности
function actionOf(a){
  const t=((a.t||"")+" "+(a.w||"")).toLowerCase();
  // 1. то, что делается дома и ни от кого не зависит
  if(/дневник|считать|счёт|меню|текстур|сон|отбой|шагов|шагам|бег|силов|нагрузк|справк|напоминани|держать дату|дышит ли|наблюдать дома/.test(t))
    return "сделать самому";
  // 2. приёмы, консультации и процедуры по записи
  if(/записаться|консультац|приём|онкогенетик|генетик|маммолог|гинеколог|гематолог|невролог|офтальмолог|психиатр|ортопед|стоматолог|дерматовенеролог|уролог|аллерголог|эндокринолог|кардиолог|терапевт|педиатр|фтизиатр|физиотерапевт|медосмотр|прививк|манту|эхокг|экг|узи|окт|периметри|рентген|дуплекс|маммографи|смад|колоноскоп/.test(t))
    return "записаться";
  // 3. то, что закрывается забором крови или другой пробой
  if(/забор|сдать|пересдать|сдаётся|анализ|ферритин|hba1c|тестостерон|анти-тпо|анти-ттг|липопротеин|25\(oh\)d|витамин d|цинк|ттг|кальций|скрытую кровь|fit|ige|соскоб|энтеробиоз|мочев|алт|аст|ггт|группа крови|целиаки|h\. pylori|pylori/.test(t))
    return "сдать";
  // 4. вопрос к врачу на ближайшем визите
  if(/спросить|уточнить|получить цифру|целевой|оперированы|промерить|лимит|решение|расчёт|qtc|когда|измерить давление|давление на/.test(t))
    return "спросить";
  return "разобраться";
}
// на плашке: конкретный срок, если он есть, иначе — что физически сделать
function labelOf(a){return a.by||actionOf(a)}
function organOf(sys){return DATA[cur].organs.find(o=>o.sys===sys)}
const LNK={enurez:{ic:"🌙",name:"Ночной энурез — всё, что с ним связано"}};
function isLnk(f){return !!LNK[f]}
function inSys(r,f){return isLnk(f) ? r.lnk===f : r.sys===f}
function sysName(sys){if(LNK[sys])return LNK[sys].name;const o=organOf(sys);return o?o.name:sys}

function sysNameIn(k,sys){const o=DATA[k].organs.find(o=>o.sys===sys);return o?o.name:sys}
// весь текст записи одной строкой — по нему и ищем
function recHay(r,k){return [r.title,r.res,r.who,r.place,r.v,r.n,TYPE[r.t],
  sysNameIn(k||cur,r.sys),r.d,ru(r.d),r.op?"операция госпитализация":"",
  (r.full||[]).map(f=>Array.isArray(f)?f.join(" "):f).join(" ")].filter(Boolean).join(" ")}
function matches(r){
  if(sysFilter&&!inSys(r,sysFilter))return false;
  return hit(recHay(r));
}
// поиск по всему разделу человека: записи, диагнозы, планы, системы, ряды, родня
function searchIn(k){
  const d=DATA[k],sn=(x)=>x?sysNameIn(k,x):"";
  const at=d.attention.map(a=>{
    const facts=a.facts||[];
    const line=facts.find(f=>hit(f))||snip(a.why||"")||"";
    return {a,line,ok:hit([a.t,a.w,a.d,a.why||"",facts.join(" "),sn(a.sys)].join(" "))};
  }).filter(x=>x.ok);
  const R={
    rec:d.rec.filter(r=>hit(recHay(r,k))),
    dx :d.diagnoses.filter(x=>hit([x.n,x.c,x.y,x.s,sn(x.sys)].join(" "))),
    rs :(d.resolved||[]).filter(x=>hit([x.n,x.y,x.s].join(" "))),
    at :at,
    org:d.organs.filter(o=>hit([o.name,o.txt,o.sh].join(" "))),
    ser:d.series.filter(x=>hit([x.name,x.unit,sn(x.sys)].join(" "))),
    fam:(d.family||[]).filter(f=>hit(f.who+" "+f.what)),
    nev:(d.never||[]).filter(n=>hit(n)),
    kpi:(d.kpi||[]).filter(x=>hit([x.lab,x.val,x.sub||""].join(" ")))
  };
  R.total=R.rec.length+R.dx.length+R.rs.length+R.at.length+R.org.length+R.ser.length+R.fam.length+R.nev.length+R.kpi.length;
  return R;
}
// последние n значений того же показателя ДО указанной даты
function prevOf(r,n,k){
  const D=DATA[k||cur];
  return D.rec.filter(x=>x.t==="lab"&&x.title===r.title&&x.d<r.d)
    .sort((a,b)=>b.d.localeCompare(a.d)).slice(0,n||3);

// компактная строка «было раньше» для таблиц
function prevCell(r,k){
  const pr=prevOf(r,3,k);
  if(!pr.length)return '<span class="muted">первая сдача</span>';
  return pr.map(h=>`<span style="white-space:nowrap"><b style="color:var(--${h.st==='ok'?'muted':h.st})">${esc(h.v||"—")}</b>
    <span class="muted">${ru(h.d).slice(3)}</span></span>`).join('<span class="muted"> · </span>');
}
function recs(type){
  return DATA[cur].rec.filter(r=>(!type||r.t===type)&&matches(r))
    .sort((a,b)=>b.d.localeCompare(a.d));
}

// ── График
function chart(s){
  const W=620,H=190,P={l:44,r:14,t:14,b:26};
  const vals=s.pts.map(p=>p[1]);
  let min=Math.min(...vals),max=Math.max(...vals);
  if(s.hi!=null){max=Math.max(max,s.hi);min=Math.min(min,s.hi)}
  if(s.lo!=null){min=Math.min(min,s.lo);max=Math.max(max,s.lo)}
  const pad=(max-min)*0.15||Math.abs(max*0.1)||1; min-=pad; max+=pad;
  const X=i=>P.l+i*(W-P.l-P.r)/Math.max(1,s.pts.length-1);
  const Y=v=>P.t+(max-v)*(H-P.t-P.b)/(max-min||1);
  let g="";
  // зона нормы
  if(s.hi!=null){const y=Y(s.hi);g+=`<rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${Math.max(0,y-P.t)}" fill="var(--badbg)"/>
    <line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="var(--bad)" stroke-dasharray="4 3" stroke-width="1"/>
    <text x="${W-P.r}" y="${y-4}" text-anchor="end">порог ${String(s.hi).replace(".",",")}</text>`}
  if(s.lo!=null){const y=Y(s.lo);g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="var(--warn)" stroke-dasharray="4 3" stroke-width="1"/>
    <text x="${W-P.r}" y="${y-4}" text-anchor="end">мин ${String(s.lo).replace(".",",")}</text>`}
  // сетка
  [min,(min+max)/2,max].forEach(v=>{g+=`<line x1="${P.l}" y1="${Y(v)}" x2="${W-P.r}" y2="${Y(v)}" stroke="var(--line)"/>
    <text x="${P.l-6}" y="${Y(v)+3}" text-anchor="end">${(Math.round(v*100)/100).toString().replace(".",",")}</text>`});
  const line=s.pts.map((p,i)=>`${i?"L":"M"}${X(i)},${Y(p[1])}`).join(" ");
  g+=`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  s.pts.forEach((p,i)=>{
    const bad=(s.hi!=null&&p[1]>s.hi)||(s.lo!=null&&p[1]<s.lo);
    g+=`<circle cx="${X(i)}" cy="${Y(p[1])}" r="4.5" fill="${bad?"var(--bad)":"var(--accent)"}"><title>${p[0]}: ${p[1]} ${s.unit}</title></circle>
    <text x="${X(i)}" y="${Y(p[1])-10}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">${String(p[1]).replace(".",",")}</text>
    <text x="${X(i)}" y="${H-8}" text-anchor="middle">${p[0].slice(3)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

// ── Силуэт с выносками
function silhouette(){
  const d=DATA[cur], W=560, BODY=520, GAP=68, LX=64, RX=496;
  const items=d.organs.slice().sort((a,b)=>a.y-b.y);

  // точка на теле: x 0–100 → поперёк корпуса, y 0–100 → от макушки до стоп
  const PX=o=>280+(o.x-50)*2.4;
  // голова и шея занимают мало места по вертикали — растягиваем их, иначе зубы уезжают в грудь
  const PYraw=o=>o.y<=22 ? 24+o.y*3.1 : 92+(o.y-22)*5.3;

  // сторону берём по самой анатомии, а не через одну — тогда линии не пересекаются
  const L=[],R=[];
  items.forEach(o=>(o.x<50?L:R).push(o));
  // выравниваем колонки: лишние отдаём с той стороны, где точка ближе к середине
  const move=(from,to)=>{
    let k=0,best=1e9;
    from.forEach((o,i)=>{const dist=Math.abs(o.x-50); if(dist<best){best=dist;k=i}});
    to.push(from.splice(k,1)[0]);
    to.sort((a,b)=>a.y-b.y);
  };
  while(L.length-R.length>1) move(L,R);
  while(R.length-L.length>1) move(R,L);

  const n=Math.max(L.length,R.length);
  const H=Math.max(BODY+40, n*GAP+56);
  const dy=Math.max(0,(H-BODY)/2);
  const PY=o=>dy+PYraw(o);

  // подписи ставим против своей точки, потом раздвигаем до минимального зазора
  const layout=(arr)=>{
    const out=arr.map(o=>({o,ly:PY(o)}));
    for(let i=1;i<out.length;i++) out[i].ly=Math.max(out[i].ly,out[i-1].ly+GAP);
    const over=out.length?out[out.length-1].ly-(H-34):0;
    if(over>0) out.forEach(x=>x.ly-=over);
    for(let i=out.length-2;i>=0;i--) out[i].ly=Math.min(out[i].ly,out[i+1].ly-GAP);
    out.forEach(x=>{if(x.ly<38)x.ly=38});
    return out;
  };
  const marks=[...layout(L).map(x=>({...x,lx:LX})),...layout(R).map(x=>({...x,lx:RX}))];

  const body=`<g fill="var(--line)" transform="translate(0,${dy})">
    <circle cx="280" cy="50" r="32"/>
    <rect x="267" y="76" width="26" height="22" rx="10"/>
    <rect x="224" y="92" width="112" height="228" rx="30"/>
    <rect x="199" y="106" width="27" height="142" rx="13"/>
    <rect x="334" y="106" width="27" height="142" rx="13"/>
    <rect x="238" y="306" width="35" height="198" rx="17"/>
    <rect x="287" y="306" width="35" height="198" rx="17"/>
  </g>`;

  const dots=marks.map(({o,lx,ly})=>{
    const c=`var(--${o.st==='none'?'none':o.st})`;
    const bx=PX(o), by=PY(o);
    const mid=lx<280?lx+40:lx-40;   // короткое колено у подписи, дальше прямая к точке
    return `<g class="organ" data-sys="${o.sys}">
      <title>${esc(o.name)} — ${ST[o.st]}. ${esc(o.txt)}</title>
      <path d="M${mid} ${ly} L${(mid+bx)/2} ${ly} L${bx} ${by}" fill="none" stroke="${c}" stroke-width="1.5" opacity=".45"/>
      <circle cx="${bx}" cy="${by}" r="6" fill="${c}"/>
      <circle class="dot" cx="${lx}" cy="${ly}" r="20" fill="var(--card)" stroke="${c}" stroke-width="3"/>
      <text x="${lx}" y="${ly+7}" text-anchor="middle" style="font-size:18px">${o.ic}</text>
      <text x="${lx}" y="${ly+35}" text-anchor="middle" style="font-size:12.5px;fill:var(--ink);font-weight:600">${esc(o.sh||o.name)}</text>
    </g>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${body}${dots}</svg>`;
}

// ===== карта симптомов =====
const MON=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
function isoOf(dt){return dt.toISOString().slice(0,10)}
function shiftDays(n){const t=new Date();t.setHours(12,0,0,0);t.setDate(t.getDate()-n);return t}
function symAgg(list,from,to){
  const sel=list.filter(x=>x.d>=from&&x.d<=to);
  const ii=sel.map(x=>x.i).filter(v=>v!=null);
  return {n:sel.length,days:new Set(sel.map(x=>x.d)).size,
          avg:ii.length?Math.round(ii.reduce((a,b)=>a+b,0)/ii.length*10)/10:null,
          max:ii.length?Math.max(...ii):null};
}
const TSCALE=[[36.9,"#5b9bd5","норма"],[37.4,"#e0b400","субфебрильная"],[37.9,"#e07b1f","высокая субфебрильная"],
              [38.9,"#d64545","фебрильная"],[99,"#7d1212","очень высокая"]];
function intColor(v){ if(v==null) return "var(--accent)"; if(v>=8) return "#7d1212"; if(v>=7) return "var(--bad)"; if(v>=4) return "var(--warn)"; return "var(--ok)"; }
// тяжесть одной записи: цвет, вес 0..1 и подпись
function sevOf(x){
  if(x&&x.v!=null&&x.u==="°C"){
    for(const [lim,c,t] of TSCALE) if(x.v<=lim)
      return {c,k:Math.min(1,Math.max(.15,(x.v-36.5)/(40.5-36.5))),t:String(x.v).replace(".",",")+" °C",n:t};
  }
  if(x&&x.i!=null) return {c:intColor(x.i),k:Math.max(.15,x.i/10),t:x.i+"/10",n:""};
  return {c:"var(--accent)",k:.4,t:"",n:""};
}
function worstOf(list){
  if(!list||!list.length) return null;
  return list.map(sevOf).sort((a,b)=>b.k-a.k)[0];
}
function fillFor(cnt,recs){
  if(!cnt) return "background:var(--nonebg)";
  const w=worstOf(recs);
  const dens=cnt>=5?1:cnt>=3?.85:cnt>=2?.7:.55;
  const op=Math.min(1,(w?w.k:.4)*.65+dens*.45);
  return `background:${w?w.c:"var(--accent)"};opacity:${op.toFixed(2)}`;
}
function monthCells(list,from){
  const first=from||(list.length?list[list.length-1].d:null); if(!first) return [];
  const now=new Date();
  let y=+first.slice(0,4), mo=+first.slice(5,7)-1;
  const cells=[]; 
  while(y<now.getFullYear()||(y===now.getFullYear()&&mo<=now.getMonth())){
    const pre=`${y}-${String(mo+1).padStart(2,"0")}`;
    const sel=list.filter(x=>x.d.startsWith(pre));
    cells.push({y,mo,n:sel.length,recs:sel});
    mo++; if(mo>11){mo=0;y++}
  }
  return cells;
}
function monthStrip(list,from){
  return `<div class="strip">${monthCells(list,from).map(c=>{const w=worstOf(c.recs);
    return `<div class="cell" style="${fillFor(c.n,c.recs)}" title="${MON[c.mo]} ${c.y} — ${c.n?razy(c.n)+(w&&w.t?", максимум "+w.t:""):"тихо"}"></div>`;}).join("")}</div>`;
}
function monthAxis(from){
  const cells=monthCells([],from);
  return `<div class="axis">${cells.map(c=>
    `<span title="${MON[c.mo]} ${c.y}">${c.mo%3===0?MON[c.mo][0]:""}</span>`).join("")}</div>
    ${yearBand(cells,11,2)}`;
}
function medsOf(list){
  const m={};
  list.forEach(x=>{ if(!x.m) return;
    x.m.split(",").map(t=>t.trim().replace(/^(затем|и)\s+/i,"")).filter(Boolean).forEach(one=>{
      const key=(one.replace(/\s+[\d(].*$/,"").trim())||one;
      if(!m[key]) m[key]={n:0,full:new Set(),dates:[]};
      m[key].n++; m[key].full.add(one); m[key].dates.push(x.d);
    });
  });
  return Object.entries(m).map(([k,v])=>({name:k,n:v.n,full:[...v.full],last:v.dates.sort().reverse()[0]}))
    .sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
}
function medChips(list){
  const M=medsOf(list);
  if(!M.length) return `<div class="muted">В этих записях лекарств нет</div>`;
  return M.map(x=>`<span class="medchip go" data-med="${esc(x.name)}" title="${esc(x.full.join(" · "))}">${esc(x.name)}${x.n>1?` <b>×${x.n}</b>`:""}</span>`).join("");
}
function symsFor(d,sys){
  const S=d.sym||{cat:[],log:[]};
  const names=[...new Set([...S.cat.filter(c=>c.sys===sys).map(c=>c.n),...S.log.filter(l=>l.sys===sys).map(l=>l.n)])];
  return names.map(n=>({n,log:S.log.filter(l=>l.n===n),cat:S.cat.find(c=>c.n===n)||{}}))
    .sort((a,b)=>b.log.length-a.log.length);
}
function lastAgo(iso,today){
  const a=Math.round((new Date(today)-new Date(iso))/864e5);
  return a<1?"сегодня":a<31?a+" дн. назад":a<400?Math.round(a/30)+" мес. назад":Math.floor(a/365)+" г. назад";
}
function freqByMonth(list,months){
  const now=new Date(), out=[];
  for(let i=months-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const pre=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const sel=list.filter(x=>x.d.startsWith(pre));
    out.push({y:d.getFullYear(),mo:d.getMonth(),n:sel.length,recs:sel});
  }
  return out;
}
function yearBand(cells,w,gap){
  const seg=[]; cells.forEach(c=>{const l=seg[seg.length-1];
    if(l&&l.y===c.y) l.n++; else seg.push({y:c.y,n:1})});
  return `<div class="yband">${seg.map(g=>
    `<div style="width:${g.n*(w+gap)-gap}px">${g.n>1?g.y:"’"+String(g.y).slice(2)}</div>`).join("")}</div>`;
}
function freqChart(list,months){
  const cells=freqByMonth(list,months), mx=Math.max(1,...cells.map(c=>c.n));
  return `<div class="fwrap"><div class="fbars">${cells.map(c=>{const w=worstOf(c.recs);
    return `<div class="fbar${c.n?"":" zero"}" title="${MON[c.mo]} ${c.y} — ${razy(c.n)}${w&&w.t?", максимум "+w.t:""}">
      ${c.n?`<b>${c.n}</b>`:""}<i style="height:${c.n?Math.round(c.n/mx*100):0}%;${c.n&&w?`background:${w.c}`:""}"></i></div>`;}).join("")}</div>
    <div class="faxis">${cells.map(c=>`<span class="${c.mo===0?"jan":""}">${MON[c.mo]}</span>`).join("")}</div>
    ${yearBand(cells,24,3)}</div>`;
}
function trendVerdict(list,today){
  const d90=isoOf(shiftDays(89)), d180=isoOf(shiftDays(179));
  const a=list.filter(x=>x.d>=d90).length, b=list.filter(x=>x.d>=d180&&x.d<d90).length;
  if(!a&&!b) return `<div class="verdict flat">За последние полгода записей нет</div>`;
  if(a>b) return `<div class="verdict up">Участился: ${a} раз за 90 дней против ${b} за предыдущие 90. Повод показаться врачу, даже если каждый раз терпимо</div>`;
  if(a<b) return `<div class="verdict dn">Стало реже: ${a} за 90 дней против ${b} за предыдущие 90</div>`;
  return `<div class="verdict flat">Без изменений: ${a} и ${a} за два полугодия по 90 дней</div>`;
}
function isRising(list,today){
  const d90=isoOf(shiftDays(89)), d180=isoOf(shiftDays(179));
  const a=list.filter(x=>x.d>=d90).length, b=list.filter(x=>x.d>=d180&&x.d<d90).length;
  return a>b&&a>=2;
}
function medInfo(name){
  if(typeof MEDREF==="undefined") return null;
  if(MEDREF[name]) return MEDREF[name];
  const k=Object.keys(MEDREF).find(x=>x.toLowerCase()===name.toLowerCase()
    ||x.toLowerCase().startsWith(name.toLowerCase()+" ")
    ||name.toLowerCase().startsWith(x.toLowerCase()+" "));
  return k?MEDREF[k]:null;
}
function medHits(log,name){
  const n=name.toLowerCase();
  return log.filter(x=>x.m&&x.m.split(",").some(t=>{
    const one=t.trim().replace(/^(затем|и)\s+/i,"");
    const key=(one.replace(/\s+[\d(].*$/,"").trim()||one).toLowerCase();
    return key===n||one.toLowerCase()===n;
  }));
}
function epDays(e,today){
  const a=new Date(e.d1), b=new Date(e.d2||today);
  return Math.max(1,Math.round((b-a)/864e5)+1);
}
function epOpen(e,today){
  return !e.d2 && e.d1 < isoOf(shiftDays(30));
}
function razy(n){
  const t=n%100, o=n%10;
  if(t>=11&&t<=14) return n+" раз";
  if(o===1) return n+" раз"; if(o>=2&&o<=4) return n+" раза"; return n+" раз";
}
function human(n){
  const t=n%100, o=n%10;
  if(t>=11&&t<=14) return n+" дней";
  if(o===1) return n+" день"; if(o>=2&&o<=4) return n+" дня"; return n+" дней";
}
function byPovod(list){
  const g={};
  list.forEach(x=>{const k=x.p||"__none__"; (g[k]=g[k]||[]).push(x)});
  return Object.entries(g).map(([k,v])=>({p:k==="__none__"?"":k,list:v}))
    .sort((a,b)=>b.list.length-a.list.length||(a.p?1:-1));
}
function logLines(list){
  return list.map(x=>`<div class="logline">
    <div><b>${esc(x.n)}</b> <span class="muted">· ${x.d.split("-").reverse().join(".")}</span>
    ${(()=>{const w=sevOf(x);return w.t?`<span class="pill" style="background:${w.c};margin-left:6px">${w.t}</span>`:""})()}
    ${x.p?`<span class="muted" style="margin-left:6px;font-size:12px">повод: ${esc(x.p)}</span>`:""}</div>
    ${x.f?`<div style="margin-top:2px">${esc(x.f)}</div>`:""}
    ${x.m?`<div class="muted" style="margin-top:2px">💊 ${x.m.split(",").map(t=>{
      const one=t.trim().replace(/^(затем|и)\s+/i,""); if(!one) return "";
      const key=one.replace(/\s+[\d(].*$/,"").trim()||one;
      return `<span class="medlink" data-med="${esc(key)}">${esc(one)}</span>`;
    }).filter(Boolean).join(", ")}${x.h?` — ${esc(x.h)}`:""}</div>`:""}
  </div>`).join("");
}
function dayStrip(list,days){
  const cells=[];
  for(let i=days-1;i>=0;i--){
    const dd=isoOf(shiftDays(i));
    const sel=list.filter(x=>x.d===dd); const w=worstOf(sel);
    cells.push(`<div class="dcell" style="${fillFor(sel.length,sel)}" title="${dd.split("-").reverse().join(".")} — ${sel.length?(w&&w.t?w.t:sel.length+" раз"):"нет"}"></div>`);
  }
  return `<div class="strip">${cells.join("")}</div>`;
}

    else {
      const sw=`<div class="vsw">
        ${[["list","Симптомы"],["ill","Болезни"],["strip","Когда возвращалось"],["sum","Сводка"],["log","Журнал"]]
