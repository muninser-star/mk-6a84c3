<title>Медкнижка семьи</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#16202a; --muted:#5d6b7a; --line:#e2e8ee;
  --ok:#1f9d55; --warn:#d99400; --bad:#d64545; --none:#9aa7b4;
  --okbg:#e8f6ee; --warnbg:#fdf3dd; --badbg:#fdeaea; --nonebg:#eef1f4;
  --accent:#2b6cb0; --accentbg:#e8f0f9;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12171d;--card:#1a222b;--ink:#e6edf3;--muted:#9fb0c0;--line:#2a3541;
  --okbg:#16302250;--warnbg:#3a2f1050;--badbg:#3a1c1c50;--nonebg:#232c35;--accentbg:#1b2a3d;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;white-space:nowrap}
.who{display:flex;gap:4px;background:var(--bg);border-radius:9px;padding:3px}
.who button{border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:7px;
  cursor:pointer;font:inherit;font-weight:600}
.who button.on{background:var(--accent);color:#fff}
#q{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font:inherit}
nav{display:flex;gap:2px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);
  overflow-x:auto;position:sticky;top:52px;z-index:19}
nav button{border:0;background:none;color:var(--muted);padding:11px 14px;cursor:pointer;
  font:inherit;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1120px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
h3{font-size:15px;margin:18px 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--bg);border-radius:10px;padding:11px 13px;border:1px solid transparent}
.kpi[data-t],.kpi[data-goto],.kpi.go{cursor:pointer}
.kpi[data-t]:hover,.kpi[data-goto]:hover,.kpi.go:hover{border-color:var(--accent)}
.kpi.off{opacity:.45;cursor:default}
.kpi.off:hover{border-color:transparent}
.card.flash{outline:2px solid var(--accent);outline-offset:2px}
details.card{padding:16px;margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:13px}
details.card>summary{font-size:15px;margin:0;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);
  cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▸";margin-left:auto;font-size:13px;transition:transform .15s ease;flex:0 0 auto}
details.card[open]>summary::after{transform:rotate(90deg)}
details.card[open]>summary{margin-bottom:14px}
summary .sum-cnt{font-weight:500;text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted);opacity:.75}
.hitline{font-size:13px;color:var(--muted);margin-top:3px}
.kpi .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kpi .val{font-size:21px;font-weight:700;margin-top:3px;overflow-wrap:anywhere;line-height:1.15}
.kpi .val.long{font-size:16px;letter-spacing:-0.01em}
.kpi .val.xlong{font-size:14px;letter-spacing:-0.02em}
.kpi .sub{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);padding:7px 9px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:8px 9px;vertical-align:top}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
/* карта симптомов */
.strip{display:flex;gap:2px;align-items:flex-end;min-height:22px}
.cell{width:11px;height:20px;border-radius:2px;background:var(--nonebg);flex:0 0 auto}
.dcell{width:5px;height:18px;border-radius:1px;background:var(--nonebg);flex:0 0 auto}
.stripwrap{overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
.striprow{display:flex;align-items:center;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);width:max-content;min-width:100%}
.striprow:last-child{border-bottom:0}
.striprow .nm{position:sticky;left:0;background:var(--card);width:190px;min-width:190px;font-size:13px;
  line-height:1.25;padding-right:10px;z-index:2;cursor:pointer}
.striprow .nm:hover{color:var(--accent)}
.axis{display:flex;gap:2px;font-size:10px;color:var(--muted)}
.axis span{width:11px;flex:0 0 auto;text-align:center}
.vsw{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.vsw button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:7px;
  padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.vsw button.on{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--accentbg)}
.medchip{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:0 5px 5px 0;font-size:13px}
.medchip b{color:var(--accent)}
.medchip.go{cursor:pointer}
.medchip.go:hover{border-color:var(--accent);color:var(--accent)}
.medlink{color:var(--accent);cursor:pointer;border-bottom:1px dashed currentColor}
.medlink:hover{border-bottom-style:solid}
.addsym{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:6px;
  width:22px;height:22px;line-height:1;font-size:15px;font-weight:700;cursor:pointer;margin-left:6px;vertical-align:-3px;padding:0}
.addsym:hover{border-color:var(--accent);background:var(--accentbg)}
.editep{color:var(--muted);font-size:13px}
.pend{color:var(--warn);font-size:11px;vertical-align:2px}
#ver{font-size:11px;color:var(--muted);margin-left:8px;white-space:nowrap}
.addform{max-width:100%}
.addform .fld{margin-top:14px}
.addform label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px}
.addform .hint{font-size:12px;color:var(--muted);margin:0 0 6px;line-height:1.45}
.addform input{width:100%;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
  font:inherit;font-size:15px;background:var(--card);color:var(--ink)}
.addform input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.addform input#asInt{max-width:150px}
.addform .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}

  attention:[
    {p:1,t:"Онкогенетика: консультация + панель (BRCA1/2, PTEN)",w:"РМЖ у матери в 30–32 года",d:"никогда не делалось",st:"bad",sys:"gen",fam:1,
     why:"Рак молочной железы у родственницы первой линии до 45 лет — самостоятельное показание к генетическому тестированию, а в 30 лет — прямое. Наблюдение принято начинать за 10 лет до возраста родственницы на момент диагноза: 30 − 10 = 20 лет. Смотреть нужно панелью, а не только BRCA1/2: рак груди в 30 лет плюс удалённая щитовидная железа у одного человека — узнаваемая комбинация (синдром Коудена, ген PTEN).",
     facts:["Мать умерла от РМЖ, диагноз в 30–32 года","У матери же — практически полностью удалённая щитовидная железа","Свои: фиброзно-кистозная мастопатия, плотность желёз ACR C","Результат теста определяет протокол наблюдения на всю жизнь: при BRCA+ добавляется ежегодная МРТ молочных желёз и обсуждается удаление яичников"]},
    {p:2,t:"Эндокринолог по предиабету + инсулин, HOMA-IR, повтор HbA1c",w:"6,0 % и растёт",d:"назначено 08.2022",st:"bad",sys:"endo",fam:1,
     why:"HbA1c показывает средний сахар за три месяца: до 5,6 % — норма, 5,7–6,4 % — предиабет. Углеводный обмен сломался ещё до второй беременности: в августе 2021 было 6,2 % и ПГТТ 10,83. Контроль, назначенный «через 6 месяцев» в августе 2022, состоялся через 3 года 8 месяцев.",
     facts:["HbA1c: 5,30 (2019) → 6,2 (2021) → 5,2 на инсулине (2022) → 6,0 (2026)","Два гестационных диабета на инсулине","Мониторинг FreeStyle Libre 2026: ночью 4,5–5,5, но пики после еды до 9,8","Ожирение 1 степени, ИМТ 31,2","Мать и бабушка — сахарный диабет 2 типа"]},
    {p:3,t:"Дневник АД 2 недели или СМАД + терапевт",w:"«хроническая АГ» висит неподтверждённой",d:"с 2022",st:"bad",sys:"heart",
     why:"Роддом в 2022 г. записал «хроническую артериальную гипертензию» в перечень перенесённых заболеваний, но после родов ни один терапевт диагноз не подтвердил и не снял: терапии нет, диспансерного наблюдения нет. Разовые замеры в кабинете эпизоды не ловят — нужен дневник две недели или СМАД, и по результату либо снять диагноз, либо начать лечить.",
     facts:["Дневник 11–12.2021: до 151/88 на 6-й неделе беременности, допегит утром и вечером","Терапия шла с 6-й недели — вдвое раньше порога в 20 недель, поэтому «хроническая», а не «гестационная»","01–03.2024: эпизод 140/90 тянулся два месяца, лечения и исхода нет","АД не измерялось врачом с 13.09.2023","Фон: холестерин 5,76, ЛПНП 3,27, предиабет, ИМТ 31"]},
    {p:4,t:"УЗИ малого таза",w:"узел 42 мм, образование яичника 36 мм",d:"с 10.2023",st:"bad",sys:"repro",
     why:"Самый быстрый рост во всём архиве: объём матки утроился за 14 месяцев, доминантный узел прибавил 50 % за год. И с тех пор три года без контроля. Отдельно — образование 36 мм в единственном оставшемся яичнике.",
     facts:["Объём матки: 31 мл (08.2022) → 53 мл (08.2023) → 84 мл (10.2023)","Доминантный узел: 28 → 35 → 42 мм","Образование яичника 36 × 30 × 32 мм, O-RADS 2 (10.2023)","Левый яичник удалён в 2017 г. — остался один","В протоколе 02.10.2023 стороны перепутаны: «левый» относится к оставшемуся правому","Рост сдерживает Мирена, установленная 02.10.2023"]},
    {p:5,t:"Единый анализ крови",w:"четыре разных повода — одна пробирка",d:"с 07.2022",due:"ближайшие недели",st:"bad",sys:"vit",
     why:"Отдельными строками здесь висели три пункта — железо, печёночные пробы и обменный набор, — а сдаются они из одной пробирки, за один поход.\n**Что сдаём:**\n• ферритин, витамин B12, фолаты — запас железа и витамины, ни один не проверялся с 2022 года;\n• АЛТ, АСТ, ГГТ, билирубин — печень: был холестаз беременных с АЛТ 63,5, после 07.2022 не пересдавали;\n• глюкоза, HbA1c — предиабет висит с 2022 года;\n• ТТГ и Т4 свободный — щитовидная железа.\n**Витамин D сюда не кладём** — у него сезонное окно ноябрь–февраль, он идёт отдельной строкой.\n**Условия:** утро, натощак.\n**Почему ферритин важнее гемоглобина.** Запас железа падает задолго до гемоглобина и восстанавливается последним. Гемоглобин сейчас нормальный (128) — но это не значит, что запас восстановился: гемоглобин дефицит скрывает.",
     facts:["АЛТ: 18,3 (12.2021) → 63,5 (05.2022) → 19,2 (07.2022) — был холестаз беременных, разрешился","После 07.2022 АЛТ, АСТ, ГГТ и билирубин не проверялись ни разу","Сопутствует: перегиб жёлчного пузыря, колебания веса","Глюкоза, HbA1c, ТТГ и Т4 свободный — из того же захода","Ферритин 12,1 нг/мл (05.2022) — выраженный дефицит; полноценным считается выше 30","На фоне лечения поднялся до 32,0 (07.2022) и больше не проверялся","Железо сыворотки: 16,5 → 8,3 → 7,5 → 11,5","Кровопотеря 2500 мл при вторых родах","Обильные менструации, две беременности с анемией, Hb 96 после первых родов"]},
    {p:6,t:"Офтальмолог: осмотр глазного дна с мидриазом",w:"ПВХРД, ПЗО 25,9",d:"последний 11.05.2022",st:"bad",sys:"eye",
     why:"Лазерная коррекция исправила рефракцию, но не строение глаза: переднезадняя ось осталась 25,9 мм, сетчатка растянута, риск разрывов и отслойки пожизненный. Осмотр глазного дна с широким зрачком нужен раз в год — последний полноценный был в мае 2022 года.",
     facts:["ПВХРД обоих глаз; слева зона предразрыва отграничена лазером 27.03.2019","ПЗО 25,94 / 25,95 мм (2021) — норма около 23–24 мм","Осмотр с мидриазом рекомендован повторно 10.03.2026, не выполнен","ВГД 6/6 в 2026 — заниженное измерение после LASIK, об операции нужно предупреждать врача"]},
    {p:7,t:"Ревмопробы (РФ, АЦЦП, СРБ)",w:"«артроз» выставлен без анализов",d:"с 04.2026",st:"warn",sys:"spine",
     why:"Диагноз «артроз мелких суставов кистей» выставлен 03.04.2026 по жалобам, без единого анализа. Симметричные боли в мелких суставах кистей — та картина, которую положено разводить с воспалительными артритами, а это делается анализами.",
     facts:["Жалобы: симметричные боли во всех суставах кистей (04.2026)","Ревмопробы (РФ, АЦЦП) не сдавались ни разу","Рентген мелких суставов назначался ещё 22.01.2018 — результата в архиве нет"]},
    {p:8,t:"Невролог + МРТ грудного отдела с контрастом",w:"расширенные арахноидальные пространства",d:"с 12.2022",st:"warn",sys:"neuro",
     why:"МРТ 07.12.2022 описала расширение задних арахноидальных пространств на уровне Th2–Th11 с формулировкой «возможно вариант нормы, не исключены спаечный процесс или аномальные сосуды». Обе рекомендации — МРТ с контрастом и осмотр невролога — не выполнены.",
     facts:["МРТ 2022: гемангиомы Th4 и Th7 до 7 мм, протрузия Th11–Th12","Поясничный лордоз из «сохранён» (2018) стал «усилен» (2022)","Невролог последний раз осматривал 08.02.2019"]},
    {p:10,t:"УЗИ шейных лимфоузлов",w:"узел 4 см описан один раз и потерян",d:"с 06.2022",st:"warn",sys:"lymph",
     why:"На приёме терапевта 22.06.2022 описан шейный лимфоузел 4 см. Больше он не упоминается нигде: ни УЗИ, ни повторного осмотра, ни записи о том, что он уменьшился. Узел такого размера либо имеет объяснение, либо требует проверки.",
     facts:["Единственное упоминание — приём терапевта 22.06.2022, через 10 дней после вторых родов","Ни одного контрольного исследования","На фоне отягощённой онконаследственности такие находки не оставляют без ответа"]}

  attention:[
    {p:1,t:"Единый анализ крови",due:"24.09.2026",w:"6 недель от старта Тотемы",d:"назначено 15.08.2026",st:"bad",sys:"blood",fam:1,
     why:"**Забор 24.09.2026 — шесть недель от старта Тотемы 13.08.** Дата контрольная, двигать её нельзя: именно на этом сроке видно, работает курс или нет.\n**Что сдаём:**\n• 🔴 **ферритин** — главная цифра, было 12,75 при норме от 21,81;\n• 🔴 **СРБ** — не ради воспаления, а чтобы ферритин можно было прочитать: он белок острой фазы и при любой простуде взлетает, маскируя дефицит;\n• 🔴 **ОАК с MCH, MCHC, MCV** — все три были у нижней границы (26,1 / 321 / 81,5), это железодефицитная картина; к шести неделям они должны поползти вверх;\n• 🔴 **анти-тТГ IgA вместе с общим IgA** — скрининг целиакии; без общего IgA отрицательный результат ничего не значит;\n• 🟡 **ТТГ** — та же сыворотка, отдельного прокола не нужно, железо на него не влияет. Условие одно: **сдать до 10 утра** — у ТТГ суточный ритм, к середине дня он падает на 20–30 %. Это первый ТТГ в жизни, он станет точкой отсчёта;\n• 🟡 **специфический IgE к сорным травам** — можно сейчас: он показывает сенсибилизацию, а не текущее воспаление, и от сезона почти не зависит; антигистаминные на него тоже не влияют;\n• 🟡 ретикулоциты — из той же пробирки, но их пик приходится на 7–10 день от старта, к шестой неделе они уже нормализовались. Решают не они.\n**Чего в этот заход НЕ сдаём:** **общий IgE**. Сентябрь в Москве — сезон полыни и лебеды, в разгар цветения цифра будет завышена и с 76,9 от 21.04.2026 её не сравнить. Общий IgE идёт к ноябрьскому забору 12.11, вместе с 25(OH)D.\n**Условия сдачи:**\n• та же лаборатория, что 10.08.2026, и по возможности то же время суток — на эозинофилах уже был случай, когда 0,23 и 0,40 оказались несравнимы из-за разных коридоров и разного часа;\n• утро, натощак;\n• Тотему утром в день сдачи не давать: ферритин от разовой дозы не скачет, а сывороточное железо — очень;\n• хлеб из рациона не убирать до сдачи анти-тТГ, иначе скрининг даст ложноотрицательный результат;\n• если за две недели до забора Дима переболеет — ферритин и СРБ сдвинуть на неделю-две, по воспалению их не прочитать.",
     facts:["Ферритин 12,75 при норме от 21,81 (10.08.2026) — дефицит без анемии","MCH 26,1 / MCHC 321 / MCV 81,5 — все три у нижней границы","Гемоглобин 117 при норме от 115 — дефицит ещё не дошёл до анемии","Общий IgE 76,9 при норме до 52 (21.04.2026) — повторять вне сезона","Эозинофилы 7,7 % в августе — вне сезона берёзы, но в сезон сорных трав","ТТГ не измеряли ни разу; у бабушки по маминой линии щитовидная железа удалена","Ферритин 12,75 нг/мл при норме от 21,81 (10.08.2026) — депо пустое","Гемоглобин 117 при норме от 115 — анемии ещё нет, это стадия истощения запасов","MCH 26,1, MCHC 321, MCV 81,5 — все три у нижней границы","Общий белок 61 при норме от 65 плюс лёгкая стеаторея — повод проверить всасывание","Цель по ферритину 40–50, а не нижняя граница нормы","Условия: та же лаборатория, глютен в рационе перед скринингом целиакии"]},
    {p:2,t:"Педиатр — за направлениями на сентябрьский забор",w:"записан на 20.09.2026; направления нужны на руках до забора 24.09",d:"забор назначен на 24.09.2026",due:"20.09.2026",st:"warn",sys:"blood",by:"записан",
     why:"**Зачем отдельный визит.** Забор 24.09.2026 — это шесть недель от старта Тотемы 13.08, дату двигать нельзя: она и есть контрольная точка. Направления должны быть на руках заранее, иначе в день забора часть позиций просто не выпишут. На Дане это уже стоило потерянного цинка 31.08.2026.\n**Записан на 20 сентября** (02.09.2026). По ДМС выписывают весь список. Запас до забора четыре дня: этого достаточно, пока ДМС покрывает весь список. Раньше 7 сентября смысла не было — шесть недель от старта железа ещё не прошли.\n**Что просить, по приоритету:**\n• 🔴 ферритин — главная цифра курса, было 12,75 при норме от 21,81;\n• 🔴 ОАК с ретикулоцитами — ретикулоциты показывают отклик на железо за 5–7 дней, раньше ферритина;\n• 🔴 анти-тТГ IgA вместе с общим IgA — без общего IgA отрицательный результат скрининга целиакии ничего не значит;\n• 🔴 ТТГ — не измеряли ни разу, у бабушки по маминой линии щитовидная железа удалена;\n• 🟡 общий IgE и панель сорных трав — висит с 03.2025, сейчас как раз вне сезона берёзы;\n• 🟡 соскоб на энтеробиоз трёхкратно — эозинофилы 7,7 %, копрограмма его не заменяет;\n• 🟡 направление на 25(OH)D к ноябрю — сезонное окно, забор 12.11.\n**Два условия проговорить в кабинете:** та же лаборатория, что 10.08.2026, иначе ферритин не с чем сравнивать; и глютен в рационе до сдачи анти-тТГ — если убрать хлеб заранее, скрининг даст ложноотрицательный результат.",
     facts:["Забор 24.09.2026 — 6 недель от старта Тотемы 13.08.2026","Ферритин 12,75 при норме от 21,81 (10.08.2026)","У Дани 31.08.2026 цинк не выписали в день забора — позиция вне стандарта ОМС","Приём педиатра 20.09.2026, забор 24.09.2026 — запас 4 дня","По ДМС выписывают весь список, риск недовыписки низкий","25(OH)D не измеряли ни разу, окно ноябрь–февраль"]},
    {p:2,t:"Манту 2024 сомнительная — спросить у педиатра, нужен ли повтор",w:"школа ничего не потребовала, вопрос остался медицинским",d:"с 2024",due:"20.09.2026",st:"warn",sys:"immun",
     why:"**Школьная часть закрыта.** Уточнено 02.09.2026: Дима пошёл в школу, карта электронная, никаких справок и результатов проб у семьи не запросили. Значит срочности к 1 сентября больше нет и пункт перестал быть просроченным.\n**Медицинская часть осталась.** Сомнительная проба 2024 года (гиперемия 5 мм) без повтора — это по-прежнему незакрытый вопрос, только уже не перед школой, а перед фтизиатром: сомнительный результат обычно уточняют повторной пробой или Диаскинтестом.\n**Когда спрашивать.** На приёме педиатра 20.09.2026, вместе с направлениями на сентябрьский забор. Вопрос одной фразой: «В 2024 году Манту была сомнительной, повтора не делали. Нужен ли Диаскинтест и когда?»\n**Про окно.** Аллерголог 13.03.2023 запретил пробы и прививки с апреля по август — то есть делать её можно как раз сейчас, осенью или зимой.",
     facts:["Манту 2024 — сомнительная, гиперемия 5 мм","БЦЖ-М сделана в 2020","Данных о повторной пробе после 2024 нет","Сезонное ограничение аллерголога: без проб и прививок апрель–август","02.09.2026: школа приняла ребёнка, справок и проб не запрашивала — карта электронная","Пройдены: педиатр 08.2026, невролог 10.08.2026, ЛОР — без отклонений, хирург-ортопед 16.08.2026","Остался стоматолог — 14.09.2026"]},
    {p:3,t:"Психиатр 07.09.2026 — приём идёт по энурезу",w:"почти три года, 5 мокрых ночей из 7",d:"с 21.11.2023",st:"bad",sys:"uro",
     why:"Невролог 10.08.2026 свою линию закрыл и передал энурез психиатру. Формулировать приём нужно именно как «энурез», а не «по поведению» — иначе разговор уедет в характер и внимание, а лечить будут не то. С собой — счёт сухих ночей по неделям: без ряда любой отклик не отличить от спонтанного улучшения, которое само по себе бывает у 15 % детей в год.",
     facts:["Ночной энурез с 21.11.2023, на 08.2026 сохраняется","Базовая неделя 09–15.08.2026: 2 сухих ночи из 7","4 и более мокрых ночи в неделю — частый энурез","Диабет и инфекция сняты: анализ мочи 10.08.2026 полностью чистый, глюкоза 4,99","Рентген пояснично-крестцового отдела 15.08.2026 сделан именно по этому поводу","Ночные подъёмы без полного пробуждения к сухим ночам не приближают"]},
    {p:4,t:"Ортопед: контроль в конце ноября",due:"конец ноября 2026",w:"варус коленей — новая находка, тактики к ней нет",d:"осмотр был 01.09.2026",st:"warn",sys:"ortho",
     why:"Осмотр 01.09.2026 закрыл вопрос длины ног — они одинаковые, прежние 0,5 см оказались следствием вальгуса, компенсация не нужна. Взамен появился варус коленей: ось ноги искривлена выше стопы, из-за этого держится напряжение мышц, а что с этим делать — не сказано. Плоскостопие подтверждено, свод начал формироваться, стельки менять не нужно. Контроль назначен на конец ноября; забор 25(OH)D 12.11.2026 попадает как раз перед ним — витамин D ни разу не измеряли, а он даёт и деформацию оси ног, и боли в ногах, которые шли с 2024 года.",
     facts:["01.09.2026, Степаненко А. Г.: длина ног одинаковая — мерили лёжа на животе и на спине","Разница 0,5 см от 16.08.2026 объяснена вальгусом, а не длиной кости","Назначение хирурга от 16.08.2026 — подпяточник на правую ногу — отменяется: подкладка под ногу нормальной длины сама создаёт перекос таза","Плоскостопие подтверждено, свод стопы начал формироваться","Вальгус со слабыми изменениями, ухудшения нет","Варус коленей — новая находка, тактика не назначена","Роста стопы нет, стельки менять не нужно","Тест Адамса не делали три приёма подряд — 01.09.2026 решено не настаивать","В форме 026/у у хирурга стоит «Здоров», ограничений нет; кувырки запрещены неврологом 10.08.2026 и в школьную карту это не попало"]},
    {p:5,t:"Невролог повторно — решить по позвоночнику",w:"три специалиста, три мнения, ни одного решения",d:"с 10.08.2026",st:"bad",sys:"spine",
     why:"Ортопед 09.08.2026 говорит про осанку и стельки, невролог 10.08.2026 нашёл искривление и связал головные боли с позвоночной артерией, хирург 16.08.2026 записала диагноз в школьную форму и вернула вопрос неврологу. Круг замкнулся, снимок сделан, а плана наблюдения нет. Нужен один человек, который сведёт это в решение: наблюдать, ЛФК или что-то ещё.",
     facts:["Невролог 10.08.2026: искривление позвоночника, версия про пережатие позвоночной артерии","Дуплекс БЦА 08.01.2026: умеренная непрямолинейность хода обеих позвоночных артерий, гемодинамика не нарушена","Дуплекс транскраниальный и вены шеи 08.01.2026 — норма","Рентген пояснично-крестцового отдела 15.08.2026 сделан","Направление на рентген грудного и шейного отделов выдано, делать не советуют","ЛФК ежедневно, бассейн 2 раза в неделю с 29.07.2026"]},
    {p:6,t:"ЭхоКГ — контроль малых аномалий сердца",w:"не делали с 13.11.2020, шесть лет",d:"с 11.2020",st:"bad",sys:"heart",
     why:"Открытое овальное окно уменьшается правильно, с 1,4 до 1,0 мм, и само по себе не мешает. Но малые аномалии смотрят раз в 1–2 года, а здесь пропущено три интервала. Отдельно к тому же приёму — вопрос по QTc: цифра выросла с 0,39 до 0,43 за 17 месяцев, оба значения в норме, но направление одно, и это меняет список безопасных лекарств.",
     facts:["ООО 1,4 мм (17.07.2019) → межпредсердное сообщение 1,0 мм (13.11.2020)","Фракция выброса 72 % → 67,8 % — обе в норме","Дополнительные хорды левого желудочка","QTc 0,39 (06.03.2025) → 0,43 (06.08.2026) при границе 0,44","ЭКГ 06.08.2026: синусовая аритмия, ЧСС 82 — возрастная норма","Допуск к спорту дан 07.04.2026"]},
    {p:7,t:"Аллерголог до марта 2027 — пересмотреть ограничения 2023 года",due:"до марта 2027",w:"пищевые запреты не подтверждались три года",d:"с 13.03.2023",st:"bad",sys:"allerg",
     why:"Лекарственная схема свежая, её переназначили 20.04.2026. А пищевые ограничения и запрет фитопрепаратов держатся с марта 2023 года и с тех пор ни разу не проверялись — ребёнок три года ест по списку, который могли уже перерасти. Успеть надо до сезона берёзы: в обострение пробы не делают. Тем же приёмом закрываются освобождение от физкультуры на улице и панель на сорные травы.",
     facts:["Ограничения аллерголога ГБУЗ ДГП №48 от 13.03.2023: не применять фитопрепараты, исключения по еде","Сезонные ограничения апрель–август: без прививок, Манту, плановых операций","Сенсибилизация 20.04.2026: пыльца деревьев (+++), молоко (+)","IgE к ранне- и поздноцветущим деревьям 3,00 и 2,80 при норме до 0,35","Общий IgE 76,9 при норме до 52 (21.04.2026)","Эозинофилы выросли 0,23 → 0,40 вне сезона берёзы — панель по травам не делали"]},
    {p:8,t:"Справка об ограничениях по физкультуре к 1 сентября",w:"кувырки запрещены, в карте стоит I группа",d:"с 10.08.2026",st:"bad",sys:"ortho",
     why:"Расхождение между тем, что сказал невролог, и тем, что записано в школьной карте. Школьный учитель физкультуры читает карту, а не чужие заключения. Без письменного ограничения гимнастика с кувырками будет по умолчанию разрешена.",
     facts:["Кувырки запрещены неврологом 10.08.2026, плавать можно","В карте с 29.04.2025 стоит «физкультура I группа»","В форме 026/у у хирурга 16.08.2026 — «Здоров», ограничений нет","Отдельно нужно освобождение от физкультуры на улице в апреле–мае (сезон берёзы)","Запись в форме 026/у от руки читается с трудом — просить печатное заключение"]},
    {p:9,t:"ЛФК ежедневно и бассейн — держать регулярность",w:"назначено ортопедом, подтверждено осмотром 01.09.2026",d:"назначено 09.08.2026",due:"постоянно",st:"warn",sys:"ortho",by:"сделать самому",
     why:"Единственное, что реально работает при плоскостопии, вальгусе и начинающемся сколиозе в этом возрасте. Мишень в ЛФК — мышцы корпуса: планка, лодочка, подъём ног лёжа; отжимания от опоры или с колен. Проверка бесплатная — протокол следующих соревнований: пресс 15 (02.2026) и 19 (лето 2026), оба раза низ группы, это та же «вяленькая осанка», только в повторениях.",
     facts:["Ортопед 09.08.2026: ЛФК ежедневно, бассейн, брасс","Осмотр 01.09.2026: свод стопы начал формироваться, ухудшения нет","Комплекс ЛФК: https://muninser-star.github.io/LFK/","Бассейн уже в расписании","Кувырки запрещены неврологом 10.08.2026"]},
    {p:9,t:"25(OH)D — измерить в ноябрьское окно",w:"не измеряли ни разу",d:"никогда",st:"warn",sys:"vit",
     why:"Ночные боли в ногах шли с апреля 2024 года и так и не разобраны, а дефицит витамина D даёт ровно такие боли плюс мышечную слабость. Сдавать имеет смысл в окне ноябрь–февраль: летом цифра завышена солнцем и ничего не значит.",
     facts:["25(OH)D не измеряли ни разу","Жалобы на боли в ногах, включая ночные, с 04.2024","Ориентир по дате — 12.11.2026, к ноябрьскому забору","Цинк 13,0 (норма 11,1–19,5) и селен 78,1 (норма 23–190) — 03.2026, оба в норме"]},
    {p:10,t:"Соскоб на энтеробиоз, трёхкратно",w:"эозинофилы 7,7 % требуют второй версии",d:"не делался",st:"warn",sys:"gi",
     why:"Аллергия объясняет эозинофилию, но не единственная. Вторая причина — паразиты, и копрограмма их не заменяет: яйца остриц в кале почти не находят, нужен перианальный соскоб, причём трёхкратный — одна проба ловит меньше половины случаев.",
     facts:["Эозинофилы 7,7 % / 0,40 при норме до 5 % (10.08.2026)","Копрограмма 10.08.2026: паразитов, крови, лейкоцитов и слизи нет","Одна проба копрограммы — недостаточная чувствительность","Альтернатива по лямблиям — антиген в кале методом ИФА"]},
    {p:11,t:"Стоматолог 14.09.2026",w:"ни одного осмотра в файле",d:"с 2019",st:"warn",sys:"teeth",
     why:"Плановая часть медосмотра перед школой и единственная система, по которой в архиве вообще нет записей после справки о санации 2019 года. Идёт вместе с Даней.",
     facts:["Последняя запись — справка «полость рта санирована» от 10.07.2019","Приём назначен на 14.09.2026","Пародонтоз у обоих дедушки и бабушки по линии отца"]},
    {p:12,t:"Повторить общий IgE вне сезона и добавить сорные травы",w:"панель делали только по деревьям и молоку",d:"с 03.2025",st:"warn",sys:"allerg",
     why:"Эозинофилы выросли в августе — вне сезона берёзы, зато ровно в сезон сорных трав, которых в панели не было. Ряд при этом шумный: две точки из разных лабораторий с разными нормами и разным временем забора сравнивать нельзя. Поэтому пересдавать надо там же и в то же время суток.",
     facts:["Эозинофилы 0,23 (норма до 0,440, забор 15:50) и 0,40 (норма до 0,30, забор 9:23)","Общий IgE 76,9 при норме до 52 (21.04.2026)","Специфический IgE делали только по ранне- и поздноцветущим деревьям и молоку","Атопический марш: ринит → астма — риск, который ловится именно расширением панели"]},
    {p:13,t:"Измерить давление на плановом осмотре",w:"гипертония в роду с дебютом «со школы»",d:"не измеряли",st:"warn",sys:"heart",
     why:"У бабушки по отцовской линии гипертония началась «со школы» — ранний старт в роду уже был. Само измерение стоит ноль и делается на любом плановом приёме, но в карте нет ни одного значения.",
     facts:["Гипертония у бабушки по отцовской линии с дебютом «со школы»","Ни одного измерения АД в файле","Манжета нужна детская — на взрослой цифра завышается"]}

  rec:[
    {t:"visit",d:"2026-09-01",title:"Ортопед Степаненко: ноги одинаковые, сколиоз подтверждён, найден варус коленей",who:"Ортопед",place:"Степаненко Анна Григорьевна",sys:"ortho",st:"warn",res:"длина ног одинаковая — прежние 0,5 см объяснены вальгусом; сколиоз начинается; свод стопы формируется; варус коленей даёт напряжение мышц; стельки менять не нужно",full:[["ДЛИНА НОГ — ОДИНАКОВАЯ", "Мерили лёжа в двух положениях: на животе и на спине. Разница 0,5 см из формы 026/у от 16.08.2026 не подтвердилась. Врач объяснил её ВАЛЬГУСОМ, а не длиной кости"],

     ["КОЛЕНИ — ВАРУС", "Колени выгнуты в другую сторону, из-за этого идёт напряжение мышц. Новая находка: ни ортопед 09.08.2026, ни хирург 16.08.2026 колени не описывали. Тактика не назначена"],
     ["СТЕЛЬКИ", "Роста стопы не произошло — менять не нужно. Носим прежние Sursil-Ortho, четвёртую пару не покупаем"],

     ["❌ ОТМЕНЯЕТ НАЗНАЧЕНИЕ ОТ 16.08.2026", "Подпяточник с компенсацией по высоте на правую ногу не нужен: ноги одинаковой длины. Подкладка под ногу нормальной длины сама создаёт перекос таза — при начинающемся сколиозе это работает против цели"],
     ["Тест Адамса — решено не настаивать", "Ни один из трёх врачей пробу не проводил, все трое сочли достаточным осмотр. Решение 01.09.2026: вопрос закрыт. Вернёмся к нему, только если дома станет заметна асимметрия плеч и лопаток или начнётся скачок роста"],
     ["Бумаг с приёма нет — решено не запрашивать", "Письменное заключение не брали, всё записано со слов. Врачу доверяем; если документ попросят школа или следующий врач, вернёмся к вопросу"],
     ["Источник", "Со слов Дениса, 01.09.2026. Врач: Степаненко Анна Григорьевна"]]},
    {t:"visit",d:"2026-08-23",title:"Уролог: причина не урологическая, найдены синехии",who:"Уролог",place:"АО «Семейный доктор» ф.3",sys:"uro",st:"bad",res:"причина не урологическая, органика исключена; синехии сохраняются, но бессимптомные — не разделяем; Канефрон назначен как плацебо, оба назначения сняты",full:[["ЗАКЛЮЧЕНИЕ", "Устно: причина энуреза НЕ УРОЛОГИЧЕСКАЯ, а неврологическая. Урологическая патология исключена. После трёх лет это закрывает целую ветку — ради этого и шли. В письменном протоколе вывода нет: там только Канефрон и синехии"],

  attention:[
    {p:1,t:"Гематолог: получить целевой ферритин и дату окончания курса",w:"дозу вернули сами 17.08.2026, но цели и срока по-прежнему нет",d:"висит с 01.2026",st:"bad",sys:"blood",fam:1,by:"записаться",
     why:"Дозу вернули 17.08.2026 решением родителей, без врача — по арифметике из таблицы фаз: на 50 мг в сутки ферритин рос по 7,6 в месяц, на 18,4 не рос вообще. Это закрывает главную дыру, но не все. Остаются две цифры, которых нет в данных с января: до какого ферритина лечим и когда курс заканчивается. Без них курс кончится там, где кончится упаковка. Разговор вести цифрами из таблицы, а не ссылками на прошлые приёмы: приём был по ОМС, врач не вникал.",
     facts:["Поддерживающую дозу назначать только выше ферритина 40, а не 30","19.03.2026 на поддерживающую перешли при 32 — на этом и развалилось","Отдельный вопрос тем же заходом: ребёнку, который не ест красное мясо, может быть нужна не отмена курса, а постоянная поддерживающая доза","02.2025 → 01.2026, Мальтофер 11 месяцев: ферритин 25 → 15, минус 0,9 в месяц","16.01 → 19.03.2026, Тотема 50 мг/сут: 15 → 32, плюс 7,6 в месяц","19.03 → 10.08.2026, Тотема 18,4 мг/сут: 32 → 27, прирост ноль","С 17.08.2026 лечебная доза возвращена — решением родителей, врач не участвовал","Восемь недель от 17.08 — контроль около 12.10.2026","Уточнить и записать: точную дозу фазы 3 и фактический первый день","Из 18 месяцев лечения продуктивными были два","32 → 27 — это не падение: критическая разница для ферритина около 40 %, здесь 16 %","Норма лаборатории по ферритину — от 30,0 мкг/л","Ферритин сдаётся на фоне терапии, отменять приём ради анализа не нужно"]},
    {p:2,t:"Единый анализ крови",due:"не откладывая",w:"10.08.2026 сдали только железо и ферритин",d:"назначено было полностью",st:"bad",sys:"blood",
     why:"Пять открытых строк закрываются одним проколом, а ребёнку четыре года — второй заход дорого стоит всем. Главная дыра — гемоглобин: последний раз мерили 13.01.2026, семь месяцев назад, и без ОАК не видно, откатилась анемия или нет. Ретикулоциты — самый ранний маркер отклика, растут за 5–7 дней, и именно их не сдали. СРБ нужен, чтобы знать, не завышен ли ферритин воспалением.",
     facts:["10.08.2026 назначены были ОАК, ферритин и ретикулоциты — сдали только железо и ферритин","Гемоглобин последний раз 13.01.2026 — 107 г/л, порог анемии ВОЗ для возраста 110","Цинк не измеряли ни разу; Диме мерили — 13,0 мкмоль/л","ТТГ не измеряли ни разу за четыре года","Общий IgE не сдавался, хотя эозинофилы дважды были выше нормы","Пауза 24–48 часов нужна только для сывороточного железа, ферритину она не нужна"]},
    {p:3,t:"ЭхоКГ и ЭКГ одним визитом — 31.08.2026",w:"ООО 2,0 мм, контроль не делали четыре года",d:"с 06.07.2022",st:"bad",sys:"heart",
     why:"Протокол ЭхоКГ нашёлся внутри комплексного УЗИ от 06.07.2022: окно уменьшилось с 2,8 до 2,0 мм, артериальный проток закрылся, фракция выброса 69 %. Там же стоит рекомендация «контроль в динамике», которую не выполнили ни разу за четыре года. ЭКГ за жизнь одна, от 14.06.2023, и на ней синусовая брадикардия. Перед стартом бассейна обе процедуры нужны в любом случае — берём одним визитом.",
     facts:["ООО 2,8 мм при выписке (24.06.2022) → 2,0 мм (06.07.2022)","Открытый артериальный проток 1,9 мм закрылся","Фракция выброса 69 %, ускорение кровотока описано","ЭКГ 14.06.2023: ЧСС 95 при возрастной норме 120–125; интервалы в норме","Бассейн планируется с сентября 2026","Записаны на 31.08.2026, обе процедуры за один заход"]},
    {p:4,t:"Контрольный анализ крови",due:"12.10.2026",w:"8 недель на лечебной дозе",d:"держим дату сами",st:"bad",sys:"blood",
     why:"Главный урок этой истории: за 18 месяцев ни одна контрольная точка не была взята вовремя. В 2025-м отсутствие отклика на Мальтофер было видно уже через пять недель, а следующий анализ сдали через шесть с половиной месяцев — препарат меняли одиннадцать месяцев. В апреле 2026 Денис собирался мерить через шесть недель, врач отговорил, померили через три с половиной месяца. Дату держим сами и сдаём по ней, независимо от «попейте ещё, потом померяем».",
     facts:["Отсчёт от 16.08.2026 — фактическую дату старта лечебной дозы надо сверить","Ретикулоциты растут за 5–7 дней — они покажут отклик раньше ферритина","Если за 8 недель на лечебной дозе ферритин не вырастет — тогда скрининг целиакии","Единственная непрерывная линия в этой истории — сам Денис","Каждый раз, когда что-то сдвигалось, это происходило после появления цифры"]},
    {p:6,t:"Меню под текстуру, а не «заставить есть мясо»",w:"дело не в мясе и не в размере кусочка",d:"проверено дома 11.08.2026",st:"warn",sys:"gi",
     why:"Домашние пробы уточнили правило и сделали задачу решаемой. Котлеты идут, а просто пожаренный говяжий фарш — нет, при том же мясе и том же размере частиц. Мелко порезанный шашлык — неохотно. Значит, дело в сухости и рассыпчатости: проходит мягкое, влажное, связное и узнаваемое. Состав фарша целиком в руках взрослых, а коридор у Дани уже, чем у Димы, — меню строить под него, старший съест то же самое.",
     facts:["Котлеты ест; пожаренный говяжий фарш не ест; мелко порезанный шашлык — неохотно","Формулировка «не ест мясо» неточна и вводит врачей в заблуждение","Гемовое железо из говядины, телятины и печени усваивается в разы лучше, чем из круп","Витамин C рядом усвоение повышает; чай, молоко и кальций рядом — снижают","Растёт нормально и физически силён — калорий хватает, проблема не в количестве"]},
    {p:7,t:"Стоматолог — 14.09.2026",w:"ни одного осмотра за четыре года",d:"никогда",st:"warn",sys:"teeth",
     why:"Больной зуб — самая простая причина того, что ребёнок ест долго и мучительно, и она проверяется одним визитом. Прежде чем разбирать сенсорику и текстуру, эту версию надо просто снять. Идёт вместе с Димой.",
     facts:["Ни одного осмотра стоматолога не записано","Ест долго и с сопротивлением, независимо от того, что положили","Приём назначен на 14.09.2026, вместе с братом"]},
    {p:8,t:"✅ Закрыто 02.09.2026: дышит свободно носом и ртом",w:"носового препятствия нет, к ЛОРу по этому поводу не идём",d:"проверено дома 02.09.2026",st:"ok",sys:"ent",
     why:"Проверено наблюдением дома 02.09.2026: дышит свободно и носом, и ртом. Значит долгая еда объясняется не дыханием, а текстурой и избирательностью — версия с носовым препятствием закрыта. Прежнее обоснование: при заложенном носе или больших аденоидах еда физически растягивается, ребёнок вынужден прерываться на дыхание. У Дани были два эпизода с хрипами и Пульмикортом, так что верхние и нижние дыхательные пути в этой истории уже отметились. Наблюдение бесплатное — достаточно посмотреть, как он спит и как ест.",
     facts:["Два эпизода хрипов и затруднённого дыхания: 10.2023 и 04.2024, оба на Пульмикорте","До 02.2023 получал профилактику РСВ — лёгкие считались уязвимым местом","02.09.2026: дышит свободно и носом, и ртом — проверено дома","У брата Димы этот вопрос закрыли так же, наблюдением: спит с закрытым ртом, храпа нет","При любом кашле с хрипами говорить врачу про оба прошлых эпизода"]},
    {p:9,t:"Цинк — измерить, ни разу не мерили",w:"дефицит цинка снижает вкус и аппетит",d:"никогда",st:"warn",sys:"vit",
     why:"Цинк ходит в паре с дефицитом железа и напрямую бьёт по вкусу и аппетиту — то есть по той самой жалобе, вокруг которой всё крутится. Диме его измерили, Дане нет. Сдаётся из той же пробирки, что и ферритин, отдельного захода не требует.",
     facts:["Цинк не измеряли ни разу за четыре года","У Димы 13,0 мкмоль/л при норме 11,1–19,5 (07.03.2026)","B9 12,2 нг/мл и B12 415 пг/мл (18.02.2026) — оба в норме","Входит в общий список ближайшего забора"]},
    {p:10,t:"Измерить давление на плановом осмотре",w:"гипертония в роду с дебютом «со школы»",d:"не измеряли",st:"warn",sys:"heart",
     why:"У бабушки по отцовской линии гипертония началась «со школы» — ранний старт в роду уже был. Детям давление часто не меряют вовсе, поэтому надо попросить отдельно и проследить, чтобы взяли детскую манжету: на взрослой цифра завышается.",
     facts:["Гипертония у бабушки по линии отца с дебютом «со школы»","Ни одного измерения АД в файле","Тот же пункт открыт и у брата Димы"]},
    {p:11,t:"ТТГ — ни разу за четыре года",w:"щитовидная линия по маме нагружена",d:"никогда",st:"warn",sys:"thyro",
     why:"У бабушки по маминой линии щитовидная железа удалена почти полностью. У мамы ТТГ 2,05 и Т4 свободный в норме (15.04.2026). Это та же линия, по которой открыт вопрос у Димы. Один показатель, входит в общий забор.",
     facts:["ТТГ не измеряли ни разу","Гипотиреоз у мамы (выписка 2019)","У бабушки по маминой линии железа удалена почти полностью, пожизненно L-тироксин","У брата Димы этот же пункт стоит в заборе 24.09.2026"]},
    {p:12,t:"Скрининг целиакии — запасной сценарий",w:"первый шаг всё-таки доза",d:"условно",st:"warn",sys:"gi",
     why:"Не первый шаг: недодоза железа объясняет картину полностью, и пока эта версия не отработана, гонять ребёнка на дополнительные анализы незачем. Но если на лечебной дозе за восемь недель ферритин не вырастет — тогда анти-тТГ IgA плюс общий IgA. Сиблинговый риск здесь около 10 % против 1 % в популяции, и у брата тот же пустой запас.",
     facts:["У обоих детей депо железа не держится годами","Риск целиакии у сиблингов около 10 % против 1 % в популяции","Условие запуска: 8 недель на лечебной дозе без прироста ферритина","Перед скринингом глютен должен быть в рационе, иначе анализ ложноотрицательный"]},
    {p:13,t:"Прививка от гриппа — 07.09.2026",w:"делаем ежегодно, последняя 05.09.2025",d:"по календарю",st:"warn",sys:"immun",
     why:"Плановая ежегодная прививка, идёт вместе с Димой одним походом. Остальной календарь закрыт полностью, включая завершённый курс Синагиса и Менактру.",
     facts:["Последняя прививка от гриппа 05.09.2025, Ультрикс Квадри","Календарь закрыт: АКДС+ИПВ+Хиб R1, гепатит A и B завершены, корь, краснуха, паротит, пневмококк, менингококк","Манту 18.05.2026 сомнительная — плановая следующая в 2027, фтизиатр не нужен"]}

  attention:[
    {p:1,t:"Единый анализ крови",w:"двенадцать позиций и три разных повода — один заход",d:"назначено 08.2022 и 01.2026",due:"22.11.2026",st:"bad",sys:"endo",
     why:"Три пункта, которые раньше висели отдельно, — это один и тот же поход в лабораторию: показатели, висящие с 2022 года, контроль по назначению кардиолога от 22.08.2026 и пересдача печёночных проб с мочевой кислотой.\n**Почему именно 22.11.2026.** Дату задаёт кардиолог: контроль липидов и мочевой кислоты назначен примерно на этот срок. Подогнать под него остальное дешевле, чем колоться дважды. Витамин D заодно попадает в своё сезонное окно ноябрь–февраль.\n**Что сдаём:**\n• липиды и мочевая кислота — контрольная точка кардиолога;\n• АЛТ, АСТ, ГГТ — печень: рост АЛТ на 31 % оказался настоящим, версию про пиво кардиолог снял 02.09.2026;\n• глюкоза, HbA1c — счётчик метаболического синдрома, последний HbA1c 5,7 % от 15.04.2025;\n• креатинин — почки, заодно из той же пробирки;\n• свободный тестостерон — общий 8,93 в «серой зоне», лаборатория сама написала «нужен свободный»;\n• анти-ТПО — витилиго плюс ползущий ТТГ 1,57 → 2,46 → 2,81;\n• липопротеин(а) — сдаётся один раз в жизни, показание появилось после уплотнения створок аортального клапана в 40 лет;\n• 25(OH)D — не измеряли ни разу;\n• группа крови — лабораторно не определялась, в карте стоит со слов.\n**Условия:** утро, натощак, трое суток без алкоголя, та же лаборатория. Вес и талию измерить в то же утро.\n**Если ждать до ноября не хочется:** часть можно сдать раньше, но липиды и мочевую кислоту всё равно придётся повторить в ноябре — это контрольная точка врача, её не переносят.",
     facts:["HbA1c 5,7 % (15.04.2025) — нижняя граница коридора преддиабета 5,7–6,4","Тестостерон 8,93 нмоль/л — «серая зона» 8–12; сама лаборатория написала «нужен свободный»","Анти-ТПО не сдавались ни разу, при витилиго это стандарт; ТТГ 1,57 → 2,46 → 2,81 за два года","Липопротеин(а) — показание появилось после уплотнения створок АК в 40 лет при ЛПНП 2,7","Забор 08.08.2026 прошёл после вечернего пива — мочевая кислота 439 и АЛТ 48,1 по нему не трактуются","Витамин D не проверяли с 12.2023, когда был дефицит с симптомами","22.08.2026 — слабость целый день, первая такая запись с 12.2023. Тогда её объяснил дефицит витамина D","Группа крови записана только со слов — по словам не переливают"]},
    {p:2,t:"Офтальмолог, февраль 2027: ОКТ зрительного нерва + периметрия + ПЗО",w:"глаукома у отца, матери и бабушки",d:"наблюдение раз в 6 месяцев",due:"12.02.2027",st:"bad",sys:"eye",fam:1,
     why:"Прежний план звучал так: «ВГД 20+ в феврале — повод для ОКТ». С таким анамнезом это неверно. Примерно у половины людей с глаукомой давление на разовом замере попадает в нормальный коридор, а поле зрения глаукома отнимает с периферии незаметно, и погибшие волокна не восстанавливаются. То есть ждать цифру 20+ означает ловить болезнь прибором, который у половины больных её не видит. Базовая точка по ОКТ и периметрии нужна независимо от давления.",
     facts:["Глаукома у обоих родителей и у бабушки по материнской линии — три поколения","Один родственник первой линии поднимает риск открытоугольной глаукомы в 4–9 раз, здесь их двое","Своё сверху: миопия средней степени (2–3× к риску) и ПЗО 26,5 мм","ВГД: 21/19 (2021) → 15/16 (2025) → 18,3/18,4 (2026) — всё в норме","Периметрия делалась один раз, в 2021: 113 точек, норма — вторая точка нужна и для этого ряда","ПЗО не измеряли ни в 2025, ни 14.08.2026 — два приёма подряд мимо","Пропуск февральского приёма — единственная реальная угроза по глазам"]},
    {p:3,t:"✅ Решено 01.09.2026: по левому глазу — НАБЛЮДЕНИЕ",w:"профилактический лазер сейчас не делаем",d:"решено 01.09.2026",st:"ok",sys:"eye",
     why:"На правом глазу очаги отграничены зрелыми коагулятами с пигментом — там всё сделано в 2021 году. На левом описаны дистрофические очаги и участки истончения без отграничения, тип дистрофии в заключении не назван, решение принято 01.09.2026 — НАБЛЮДАТЬ, профилактическую лазеркоагуляцию сейчас не делать. Врач при этом сократил интервал наблюдения до 6 месяцев, то есть риск считает не нулевым. Условие пересмотра: вспышки, резкий прирост мушек или тень в поле зрения — к офтальмологу немедленно, не дожидаясь февраля.",
     facts:["OD: дистрофические очаги, отграниченные зрелыми ЛК с отложением пигмента","OS: дистрофические очаги и участки истончения, отграничения нет","Разрыв с локальной отслойкой на правом глазу уже был в 2021 году","Стекловидное тело прозрачное, мушки при этом есть постоянно, вспышек нет","Сторона лазера закрыта: правый, подтверждено осмотром 14.08.2026","Резкий прирост мушек, «сажа», «паутина», вспышки или тень — осмотр в течение суток, не дожидаясь февраля"]},
    {p:4,t:"Баланопостит: Тридерм неделю, дальше сухость и цинк",w:"курс с 02.09 по 09.09.2026, потом только режим",d:"тянется с 05.2024",due:"контроль 23.09.2026",st:"warn",sys:"uro",by:"сделать самому",
     why:"**Диагноз по итогу 02.09.2026: хронический неспецифический баланопостит** — раздражение и мацерация кожи в замкнутой влажной складке. Не болезнь с именем, а состояние среды.\n**Обе именные версии сняты в тот же день.** И баланит Зуна, и инверсный псориаз — болезни очерченные, с резкой границей. У Дениса сплошное ровное покраснение, переход плавный, 1–2 мм, очагов на головке нет. Это другая картина. Гистология больше не узловой вопрос.\n**Что решили делать:**\n• **Тридерм — неделя, с 02.09 по 09.09.2026.** Курс короткий и это правильно: сильный стероид на этой коже дольше держать не стоит, он её истончает. Ждать от него полного излечения не нужно — Тридерм в этой истории всегда помогал только на время применения. Его задача сейчас другая: снять воспаление, чтобы дальше работал режим;\n• ванночки с марганцовкой — слабо-розовый раствор, кристаллы растворять полностью и процеживать;\n• после ванночки промакивать насухо и дать складке побыть открытой несколько минут;\n• **цинковая паста 25 %** тонким слоем на сухую кожу, на ночь обязательно. Не мазь — мазь жирная и держит влагу под собой, а нужна подсушивающая паста. Не Лассара: там салициловая кислота, для этой кожи она раздражающая;\n• мыло под крайнюю плоть не заносить, только вода; бельё хлопковое.\n**Почему именно это.** Вся история лечения указывает в одну сторону: марганцовка помогала около десяти дней — она подсушивает; Тридерм помогал, пока применялся — он давит воспаление; Амоксиклав, подобранный по антибиотикограмме, не дал ничего — бил по бактериям, которых нет. Всё, что работало, работало через сухость. Значит и лечить надо среду.\n**Как совмещать.** Пока идёт Тридерм: ванночка с марганцовкой и Тридерм по схеме, цинковую пасту в это же нанесение не мешать — её можно на ночь, если Тридерм наносится днём. С 10.09, после окончания курса, остаются только ванночки, сухость и цинк.\n**Контроль — около 23.09.2026**, через две недели после отмены Тридерма. Именно этот интервал показателен: если после отмены не вернулось — сработал режим, а не гормон. Записать исход: ушло / стало меньше / вернулось после отмены / без изменений.\n**Если не поможет** — обрезание становится логичным финалом: оно убирает не воспаление, а его условие, саму складку. Тогда попросить отправить удалённую ткань на гистологию, отдельная биопсия уже не нужна.\n**Квадерм** (тот же состав, что Тридерм, плюс декспантенол) остаётся в резерве: если решишь применять — коротким курсом 10–14 дней, не дольше, сильный стероид на этой коже её истончает.",
     facts:["Течение с 05.2024, три эпизода","ИППП и кандида отрицательны (ПЦР-12, 19.08.2025)","Посев 21.09.2025: Streptococcus agalactiae — колонизатор; Амоксиклав по чувствительности не помог","Моча 08.08.2026 чистая: глюкозы, грибов, бактерий нет","02.09.2026: сплошное ровное покраснение, граница плавная 1–2 мм, очагов на головке нет","Марганцовка давала улучшение около 10 дней","Тридерм помогал только на время применения"]},
    {p:6,t:"✅ Кардиолог пройден — повторный приём не нужен",w:"приём 22.08.2026 состоялся, всё нужное разложено по другим пунктам",d:"закрыто 02.09.2026",st:"ok",sys:"heart",
     why:"**Приём 22.08.2026 состоялся, повторно идти не требуется.** Изменения расценены как возрастные, лекарства не нужны, назначена диета и контроль липидов с мочевой кислотой через три месяца.\n**Куда разошлись хвосты этого приёма:**\n• контроль липидов и мочевой кислоты — в «Единый анализ крови», срок 22.11.2026;\n• липопротеин(а) — туда же, сдаётся платно без направления, один раз в жизни;\n• вместо СМАД — «Дневник давления, 7 дней подряд», отдельным пунктом;\n• диета — в рекомендациях, вместе с режимом и нагрузкой;\n• SCORE2 посчитан самостоятельно: около 2–3 %, нижняя граница умеренного риска.\n**Что стоит помнить на будущее, а не делать сейчас.** Профилактический осмотр в программу ДМС не входит — нужно гарантийное письмо. Поэтому оценка риска, коронарный кальций и СМАД остались **не оценёнными, а не отклонёнными**: если понадобятся, идти надо не с профилактикой, а с конкретным диагнозом или жалобой.",
     facts:["Приём 22.08.2026: лекарства не требуются, назначена диета","ЭхоКГ 15.08.2026: ФВ 68 %, камеры не расширены, гипертрофии нет","ОТС 0,45 при норме до 0,42 — концентрическое ремоделирование","Стенки аорты и створки клапана уплотнены, стеноза и регургитации нет","Три ЭКГ подряд чистые: 06.04.2025, 14.12.2025, 09.08.2026","Липиды целевые: холестерин 4,3, ЛПНП 2,7, ЛПВП 1,15, триглицериды 1,28","Контроль назначен на ≈22.11.2026 — он уже стоит в едином заборе крови"]},
    {p:7,t:"Невролог по позвоночнику",w:"рекомендован два года назад, не пройден",d:"с 26.07.2024",st:"bad",sys:"spine",
     why:"Рентгенолог рекомендовал невролога в июле 2024 года. За два года остеохондроз из локального шейного стал распространённым — шейный, грудной и пояснично-крестцовый отделы. Мануальная терапия снимает обострение, но диагноз и план наблюдения не заменяет.",
     facts:["26.07.2024: начальные признаки остеохондроза и спондилоартроза шейного отдела","11.04.2025: рентген грудного отдела","14.03.2026: дорсопатия, распространённый остеохондроз — три отдела","Выпрямление шейного лордоза, остеофиты C5–C6","Эпизод 20.07–30.09.2024: головная боль, давление в шее, нарушение концентрации — два месяца","Сидячая работа, много времени за компьютером","Профилактические курсы мануальной терапии: 11.2025 и 03.2026"]},
    {p:8,t:"Снизить вес и держать диету",w:"на этом сходятся печень, сахар, мочевая кислота и сердце",d:"вес растёт с января 2026",due:"постоянно",st:"bad",sys:"fit",by:"сделать самому",
     why:"**Это не назначение одного врача, а место, где сходятся четыре разные линии.** Про вес и питание сказали кардиолог 22.08.2026, дерматолог 02.09.2026 (про сахар), и то же самое следует из анализов по печени и углеводному обмену.\n**Что на это завязано:**\n• **печень** — жировой гепатоз с 2020 года, АЛТ вырос 36,6 → 48,1. Снижение веса на 7–10 % это единственное вмешательство с доказанным эффектом на АЛТ и на жир в печени. Таблеток с таким эффектом нет;\n• **сахар** — HbA1c 5,7 %, нижняя граница коридора преддиабета;\n• **мочевая кислота** — 439 при норме до 428,4, первое превышение;\n• **сердце и сосуды** — диета кардиолога от 22.08.2026 назначена вместо лекарств, потому что липиды пока целевые;\n• **вены и спина** — лишний вес и сидячая работа давят на то и другое.\n**Цель в цифрах.** Вес 85 кг, ИМТ 27,1. Минус 7–10 % это 6–8,5 кг; до верхней границы нормального ИМТ (25) нужно 6,7 кг, то есть цели почти совпадают: **ориентир 78 кг**. С января набрано 2,8 кг — сначала вернуть их.\n**Как, по листу кардиолога:** соль меньше 5 г в сутки; ограничить алкоголь, быстрые углеводы с ГИ выше 55 и животные жиры; овощей от 400 г в день, фруктов до 300 г в первой половине дня; орехи и оливковое масло. Аэробная нагрузка от 30 минут 5–7 дней в неделю, шагов от 10 000 — их уже около 9 000.\n**Чем мерить.** Вес и талия в то же утро, что и забор крови 22.11.2026 — тогда цифры лягут рядом с АЛТ, HbA1c и мочевой кислотой, и будет видно, двигается ли всё вместе.",
     facts:["Вес 85 кг, рост 177, ИМТ 27,1, талия 97 см (08.08.2026)","С января 2026 набрано 2,8 кг","АЛТ 36,6 (12.2025) → 48,1 (08.2026); жировой гепатоз описан ещё в 2020 году","HbA1c 5,7 % (15.04.2025) — нижняя граница преддиабета","Мочевая кислота 439 при норме до 428,4","Диета назначена кардиологом 22.08.2026 вместо лекарств","Дерматолог 02.09.2026 тоже рекомендовал сократить сахар","Шагов около 9 000 в день — базовая активность уже есть"]},
    {p:8,t:"Вставать каждые 30–60 минут при сидячей работе",w:"варикоз с 2020 года и сидячая работа как главный фактор",d:"постоянно",due:"постоянно",st:"warn",sys:"heart",by:"сделать самому",
     why:"Икроножная мышца — насос венозной крови, и во время сидения он выключен. Девять тысяч шагов в день от этого не защищают: значение имеет не сумма за день, а неподвижность внутри рабочего часа. Что работает: встать на пару минут по таймеру, а не по намерению, плюс подъёмы на носки сидя 15–20 раз в час. В перелёты дольше четырёх часов — компрессионный трикотаж.",
     facts:["УЗДГ 14.03.2020: умеренное варикозное расширение БПВ с обеих сторон, клапаны подколенных вен подтекают","Тромбозов нет, жалоб нет","Сидячая работа названа фактором и по венам, и по позвоночнику","Повторного УЗДГ не делали — данных свежее 2020 года нет"]},
    {p:8,t:"Сон: сдвинуть отбой раньше полуночи",due:"постоянно",w:"ни одной недели с засыпанием до полуночи за 23 недели",d:"март – август 2026",st:"bad",sys:"sleep",
     why:"Это не жалоба, а измеренный факт по трекеру за 23 недели подряд. Сон тянет за собой сразу три строки из этого же файла: тестостерон, вес и печень — все три ухудшаются от позднего отбоя и нерегулярности сами по себе, без других причин. Из всех открытых пунктов этот единственный не требует ни врача, ни анализа.",
     facts:["23 недели, март–август 2026: ноль недель с отходом ко сну до полуночи","Медиана отбоя 01:05, диапазон 00:28–02:17","Ноль недель с регулярностью в норме: 56–69 при норме 70–100","Средний сон около 7 часов","Тестостерон 8,93 — поздний отбой и ИМТ 27 снижают его сами по себе","Вес вырос на 2,8 кг с января при стабильных 9 000 шагов — рычаг не в шагах"]},
    {p:9,t:"Кал на скрытую кровь (FIT)",due:"осень 2026",w:"плановый скрининг с 40 лет, ему 40",d:"никогда",st:"warn",sys:"gi",
     why:"Обычный возрастной скрининг: с 40 лет раз в два года, входит в диспансеризацию. Рак прямой кишки у деда в 75 лет порог не сдвигает — это популяционный риск, а не семейный. Просто первый раз выпадает на сейчас.",
     facts:["Возраст 40 лет — порог начала скрининга","Рак прямой кишки у деда по материнской линии, обнаружен в 75 лет","Наследственный сдвиг порога начинается с диагнозов до 60 лет у родственников первой линии","Периодичность — раз в 2 года"]},
    {p:10,t:"Силовая нагрузка и перезапуск бега",due:"постоянно",w:"выносливость не измерялась ни разу",d:"бег прервался 05.05.2026",st:"warn",sys:"fit",
     why:"Кардиореспираторная выносливость — один из самых сильных известных предикторов общей смертности, в крупных когортах сильнее холестерина, и у Дениса она не измерялась ни разу. Отдельно: после 40 лет без силовой нагрузки уходит примерно 0,5–1 % мышц в год, а мышцы — главный потребитель глюкозы. Силовая работа улучшает печень и сахар даже без потери веса.",
     facts:["Около 9 000 шагов в день стабильно с марта: март 9 521, апрель 9 216","9 пробежек в апреле — 05.05.2026, дальше перерыв","Каденс доведён со 117 до 146","Гипотеза срыва: темп вырос на треть за 8 дней","Силовых нагрузок нет ни одной","Сидячая работа — множитель к четырём уже записанным строкам: диабет, печень, тестостерон, остеохондроз"]},
    {p:11,t:"✅ H. pylori — решено не сдавать",w:"жалоб нет три года, гастроэнтеролог нарушений не выявил",d:"решено 02.09.2026",st:"ok",sys:"gi",
     why:"**Решение Дениса от 02.09.2026: тест не делаем.**\n**На чём стоит.** ЭГДС 17.12.2023 показала эритематозную гастродуоденопатию — находку неспецифическую. Гастроэнтеролог после этого нарушений не выявил, жалоб по желудку нет уже три года, семейного рака желудка в анамнезе нет.\n**Что при этом честно сказать.** При подтверждённом гастрите H. pylori обычно проверяют: инфекция лечится двухнедельным курсом, а её длительное носительство — фактор язвы и рака желудка на горизонте десятилетий. Тест неинвазивный, дыхательный. То есть отказ — это осознанный выбор в пользу «не искать без жалоб», а не отсутствие показаний.\n**Когда вернуться к вопросу:** появятся боли, изжога, тяжесть после еды; понадобится длительный приём НПВС или аспирина (тогда тестирование становится показанным); или всплывёт рак желудка у кровных родственников.",
     facts:["ЭГДС 17.12.2023: умеренная гиперемия слизистой желудка и двенадцатиперстной кишки","Гастроэнтеролог после 14.12.2025 — со слов, нарушений не выявил; документ не сохранился","Жалоб по желудку в архиве нет с 2023 года","Тяжесть в правом подреберье относится к печени и жирной еде, а не к желудку","В семье рака желудка нет; у деда по матери был рак прямой кишки"]},
    {p:12,t:"✅ Закрыто 01.09.2026: лимит подъёма — 70 кг",w:"верна устная версия врача, в заключении опечатка",d:"закрыто 01.09.2026",st:"ok",sys:"eye",
     why:"В заключении офтальмолога напечатано «более 7 кг», врач вслух сказала «более 70 кг». Уточнено 01.09.2026: верны 70 кг, в бумаге опечатка. Быт не ограничен ничем. ⚠️ Но заключение читают другие врачи, а там стоит «более 7 кг» — при передаче документов это проговаривать вслух. Смысл ограничения в любом случае про натуживание, а не про сам вес, но формулировку надо уточнить письменно.",
     facts:["Ограничение введено 14.08.2026 вместе с наблюдением раз в 6 месяцев под мидриазом","Устная версия «70 кг» — со слов Дениса","Режимные назначения того же приёма: правило 20/20 при работе за компьютером","Смысл ограничения — избегать натуживания при растянутой сетчатке"]},
    {p:13,t:"Катаракта у родителей: мать наблюдают, отец не оперирован",w:"ответ получен 01.09.2026; у матери операция обсуждается",d:"ответ получен 01.09.2026",st:"warn",sys:"gen",

    {t:"visit",d:"2026-09-02",title:"Дерматолог: диагноза нет, предложены Квадерм и обрезание",who:"Дерматовенеролог",place:"—",sys:"uro",st:"bad",res:"врач сказал, что не знает, что посоветовать. План: сократить сахар, попробовать Квадерм, если не поможет — обрезание. Диагноз не поставлен, биопсию не предлагали",full:[["ЧТО СКАЗАЛ", "Со слов Дениса: особо не знает, что можно посоветовать. Рекомендовал сократить сахар, попробовать Квадерм, а если не поможет — обрезание"],
     ["ОСМОТР: сплошное ровное покраснение, граница плавная", "Врач: «не похоже на псориаз». По классическому псориазу это верно — там бляшки с плотными чешуйками. Но в препуциальной складке псориаз идёт ИНВЕРСНОЙ формой: среда влажная, роговой слой размокает, чешуйки не образуются вовсе. Получается ровное красное блестящее пятно с чёткой границей — то есть ровно то, что описано. Отсутствие чешуек само по себе версии не различает. Но уточнение того же дня решает вопрос: ПЯТЕН НЕТ ВООБЩЕ — одно сплошное покраснение, граница плавная, переход 1–2 мм, на головке очагов нет. И баланит Зуна, и инверсный псориаз — болезни ОЧЕРЧЕННЫЕ, с резкой границей. Сплошная равномерная краснота с мягким переходом означает другое: хронический неспецифический баланопостит, то есть мацерация и раздражение в замкнутой влажной складке"],
     ["⚠️ КВАДЕРМ — ЭТО ТРИДЕРМ, КОТОРЫЙ УЖЕ ПРОБОВАЛИ", "Состав Квадерма: бетаметазон + гентамицин + клотримазол + декспантенол. Состав Тридерма: те же первые три. Разница только в заживляющей добавке. Тридерм применялся с 2024 года и назначался 01.10.2025 — помогал, пока применялся, симптом возвращался после отмены. Ждать другого исхода нет оснований. Состав сверить по упаковке"],
     ["Как пробовать Квадерм", "Коротким курсом 10–14 дней, не дольше: сильный стероид на коже гениталий при длительном применении её истончает. Исход записать одним из трёх: помогло насовсем / помогло и вернулось / не помогло"],
     ["Про сахар", "Механизм рекомендации — кандида, но кандиду исключили: ПЦР-12 от 19.08.2025 отрицательна, в моче 08.08.2026 нет ни глюкозы, ни грибов, глюкоза крови 5,58. Как лечение баланопостита оснований мало. Делать всё равно стоит, но по линии преддиабета (HbA1c 5,7) и жировой печени — это и есть диета кардиолога от 22.08.2026"],
     ["🔴 ОБРЕЗАНИЕ — ТОЛЬКО ПОСЛЕ ДИАГНОЗА", "При плазмоклеточном баланите Зуна циркумцизия излечивает надёжно: болезнь живёт в замкнутой влажной складке. При генитальном псориазе всё иначе — псориаз склонен появляться в местах травмы кожи, включая послеоперационный рубец, и операция может дать обострение. За псориаз говорит семейный анамнез: псориаз у отца, плюс витилиго и ответ на стероид. Различает эти два состояния биопсия, а её не сделали"],
     ["Что просить дальше", "Биопсию — до обсуждения операции; у этого врача, у второго дерматолога или у уролога, который будет оперировать. Заодно спросить про нестероидные средства: такролимус и пимекролимус применяют при генитальных дерматозах и они не истончают кожу"],
     ["🟢 ЕСЛИ ДЕЛАТЬ ОБРЕЗАНИЕ — ПРОСИТЬ ГИСТОЛОГИЮ УДАЛЁННОЙ ТКАНИ", "Стандартная практика: удалённую крайнюю плоть отправляют на гистологическое исследование. Отдельного вмешательства не требует, а диагноз в итоге будет получен — просто после операции, а не до. Просить нужно заранее, на приёме перед операцией: потом материал уже не восстановить"],

const el=(h)=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild};
const ru=(iso)=>{const[y,m,d]=iso.split("-");return `${d}.${m}.${y}`};
const yrs=(n)=>{const a=n%100,b=n%10;if(a>=11&&a<=14)return n+" лет";if(b===1)return n+" год";if(b>=2&&b<=4)return n+" года";return n+" лет"};
const esc=(s)=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
// ── Поиск: ё=е, окончания срезаются, все слова запроса должны встретиться где угодно в записи
const norm=(s)=>String(s).toLowerCase().replace(/\u0451/g,"\u0435");
const LET=/[\u0430-\u044fa-z0-9]/;
const stem=(t)=>{let x=t;while(x.length>4&&/[\u0430\u0435\u0438\u043e\u0443\u044b\u044d\u044e\u044f\u044c\u0439\u044a]$/.test(x))x=x.slice(0,-1);return x};
// каждое слово запроса → [само слово, его основа]; достаточно совпадения любого варианта
const toks=()=>{const t=query?norm(query).split(/\s+/).filter(Boolean):[];
  return t.map(x=>{const st=stem(x);return st!==x?[x,st]:[x]})};
const hit=(hay)=>{const t=toks();if(!t.length)return true;const h=norm(hay);
  return t.every(v=>v.some(x=>h.includes(x)))};
// границы совпадений; хвост слова дотягиваем, чтобы подсветка не рвала слово пополам
function marksOf(s){
  const t=toks();if(!t.length)return[];
  const h=norm(s),raw=[];
  t.forEach(v=>{const x=v.find(y=>h.includes(y));if(!x)return;
    let i=h.indexOf(x);
    while(i>=0){let e=i+x.length;
      if(LET.test(h[e-1]||""))while(e<h.length&&LET.test(h[e]))e++;
      raw.push([i,e]);i=h.indexOf(x,i+x.length)}});
  if(!raw.length)return[];
  raw.sort((a,b)=>a[0]-b[0]);
  const m=[];
  for(const p of raw){const last=m[m.length-1];
    if(last&&p[0]<=last[1])last[1]=Math.max(last[1],p[1]);else m.push([p[0],p[1]])}
  return m;
}
const hl=(s)=>{s=String(s);const m=marksOf(s);if(!m.length)return esc(s);
  let out="",pos=0;
  for(const p of m){out+=esc(s.slice(pos,p[0]))+"<mark>"+esc(s.slice(p[0],p[1]))+"</mark>";pos=p[1]}
  return out+esc(s.slice(pos))};
// кусок длинного текста вокруг первого совпадения — чтобы было видно, за что нашлось
function snip(txt){
  txt=String(txt||"");const m=marksOf(txt);if(!m.length)return"";
  const a=Math.max(0,m[0][0]-70),b=Math.min(txt.length,m[0][1]+110);
  return (a?"…":"")+txt.slice(a,b)+(b<txt.length?"…":"");
}

// что физически надо сделать по пункту — вместо оценки тревожности
function actionOf(a){

  if(/записаться|консультац|приём|онкогенетик|генетик|маммолог|гинеколог|гематолог|невролог|офтальмолог|психиатр|ортопед|стоматолог|дерматовенеролог|уролог|аллерголог|эндокринолог|кардиолог|терапевт|педиатр|фтизиатр|физиотерапевт|медосмотр|прививк|манту|эхокг|экг|узи|окт|периметри|рентген|дуплекс|маммографи|смад|колоноскоп/.test(t))

  // 3. то, что закрывается забором крови или другой пробой
  if(/забор|сдать|пересдать|сдаётся|анализ|ферритин|hba1c|тестостерон|анти-тпо|анти-ттг|липопротеин|25\(oh\)d|витамин d|цинк|ттг|кальций|скрытую кровь|fit|ige|соскоб|энтеробиоз|мочев|алт|аст|ггт|группа крови|целиаки|h\. pylori|pylori/.test(t))

  // 4. вопрос к врачу на ближайшем визите
  if(/спросить|уточнить|получить цифру|целевой|оперированы|промерить|лимит|решение|расчёт|qtc|когда|измерить давление|давление на/.test(t))

}
// на плашке: конкретный срок, если он есть, иначе — что физически сделать
function labelOf(a){return a.by||actionOf(a)}
// Длинные пояснения читаются только разбитыми: поддерживаем **жирный**, абзацы и списки «• »
function rich(t){
  if(!t) return "";
  const bold=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  const out=[]; let ul=[];
  const flush=()=>{ if(ul.length){out.push(`<ul style="margin:8px 0;padding-left:20px">${ul.map(x=>`<li style="margin-bottom:5px">${x}</li>`).join("")}</ul>`); ul=[];} };
  String(t).split("\n").map(x=>x.trim()).filter(Boolean).forEach(line=>{
    const m=line.match(/^(?:•|—|-)\s+(.*)$/);
    if(m){ ul.push(bold(m[1])); return; }
    flush(); out.push(`<p style="margin:8px 0 0;font-size:15px">${bold(line)}</p>`);
  });
  flush();
  return out.join("");
}
function organOf(sys){return DATA[cur].organs.find(o=>o.sys===sys)}
const LNK={enurez:{ic:"🌙",name:"Ночной энурез — всё, что с ним связано"}};
function isLnk(f){return !!LNK[f]}
function inSys(r,f){return isLnk(f) ? r.lnk===f : r.sys===f}
function sysName(sys){if(LNK[sys])return LNK[sys].name;const o=organOf(sys);return o?o.name:sys}

function sysNameIn(k,sys){const o=DATA[k].organs.find(o=>o.sys===sys);return o?o.name:sys}
// весь текст записи одной строкой — по нему и ищем
function recHay(r,k){return [r.title,r.res,r.who,r.place,r.v,r.n,TYPE[r.t],
  sysNameIn(k||cur,r.sys),r.d,ru(r.d),r.op?"операция госпитализация":"",
  (r.full||[]).map(f=>Array.isArray(f)?f.join(" "):f).join(" ")].filter(Boolean).join(" ")}
function matches(r){
  if(sysFilter&&!inSys(r,sysFilter))return false;
  return hit(recHay(r));
}
// поиск по всему разделу человека: записи, диагнозы, планы, системы, ряды, родня
function searchIn(k){
  const d=DATA[k],sn=(x)=>x?sysNameIn(k,x):"";
  const at=d.attention.map(a=>{
    const facts=a.facts||[];
    const line=facts.find(f=>hit(f))||snip(a.why||"")||"";
    return {a,line,ok:hit([a.t,a.w,a.d,a.why||"",facts.join(" "),sn(a.sys)].join(" "))};
  }).filter(x=>x.ok);
  const R={
    rec:d.rec.filter(r=>hit(recHay(r,k))),
    dx :d.diagnoses.filter(x=>hit([x.n,x.c,x.y,x.s,sn(x.sys)].join(" "))),
    rs :(d.resolved||[]).filter(x=>hit([x.n,x.y,x.s].join(" "))),
    at :at,
    org:d.organs.filter(o=>hit([o.name,o.txt,o.sh].join(" "))),
    ser:d.series.filter(x=>hit([x.name,x.unit,sn(x.sys)].join(" "))),
    fam:(d.family||[]).filter(f=>hit(f.who+" "+f.what)),
    nev:(d.never||[]).filter(n=>hit(n)),
    kpi:(d.kpi||[]).filter(x=>hit([x.lab,x.val,x.sub||""].join(" ")))
  };
  R.total=R.rec.length+R.dx.length+R.rs.length+R.at.length+R.org.length+R.ser.length+R.fam.length+R.nev.length+R.kpi.length;
  return R;
}
// последние n значений того же показателя ДО указанной даты

// ── График
function chart(s){
  const W=620,H=190,P={l:44,r:14,t:14,b:26};
  const vals=s.pts.map(p=>p[1]);
  let min=Math.min(...vals),max=Math.max(...vals);
  if(s.hi!=null){max=Math.max(max,s.hi);min=Math.min(min,s.hi)}
  if(s.lo!=null){min=Math.min(min,s.lo);max=Math.max(max,s.lo)}
  const pad=(max-min)*0.15||Math.abs(max*0.1)||1; min-=pad; max+=pad;
  const X=i=>P.l+i*(W-P.l-P.r)/Math.max(1,s.pts.length-1);
  const Y=v=>P.t+(max-v)*(H-P.t-P.b)/(max-min||1);
  let g="";
  // зона нормы
  if(s.hi!=null){const y=Y(s.hi);g+=`<rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${Math.max(0,y-P.t)}" fill="var(--badbg)"/>
    <line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="var(--bad)" stroke-dasharray="4 3" stroke-width="1"/>
    <text x="${W-P.r}" y="${y-4}" text-anchor="end">порог ${String(s.hi).replace(".",",")}</text>`}
  if(s.lo!=null){const y=Y(s.lo);g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="var(--warn)" stroke-dasharray="4 3" stroke-width="1"/>
    <text x="${W-P.r}" y="${y-4}" text-anchor="end">мин ${String(s.lo).replace(".",",")}</text>`}
  // сетка
  [min,(min+max)/2,max].forEach(v=>{g+=`<line x1="${P.l}" y1="${Y(v)}" x2="${W-P.r}" y2="${Y(v)}" stroke="var(--line)"/>
    <text x="${P.l-6}" y="${Y(v)+3}" text-anchor="end">${(Math.round(v*100)/100).toString().replace(".",",")}</text>`});
  const line=s.pts.map((p,i)=>`${i?"L":"M"}${X(i)},${Y(p[1])}`).join(" ");
  g+=`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  s.pts.forEach((p,i)=>{
    const bad=(s.hi!=null&&p[1]>s.hi)||(s.lo!=null&&p[1]<s.lo);
    g+=`<circle cx="${X(i)}" cy="${Y(p[1])}" r="4.5" fill="${bad?"var(--bad)":"var(--accent)"}"><title>${p[0]}: ${p[1]} ${s.unit}</title></circle>
    <text x="${X(i)}" y="${Y(p[1])-10}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">${String(p[1]).replace(".",",")}</text>
    <text x="${X(i)}" y="${H-8}" text-anchor="middle">${p[0].slice(3)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

// ── Силуэт с выносками
function silhouette(){
  const d=DATA[cur], W=560, BODY=520, GAP=68, LX=64, RX=496;
  const items=d.organs.slice().sort((a,b)=>a.y-b.y);

  // точка на теле: x 0–100 → поперёк корпуса, y 0–100 → от макушки до стоп
  const PX=o=>280+(o.x-50)*2.4;
  // голова и шея занимают мало места по вертикали — растягиваем их, иначе зубы уезжают в грудь
  const PYraw=o=>o.y<=22 ? 24+o.y*3.1 : 92+(o.y-22)*5.3;

  // сторону берём по самой анатомии, а не через одну — тогда линии не пересекаются
  const L=[],R=[];
  items.forEach(o=>(o.x<50?L:R).push(o));
  // выравниваем колонки: лишние отдаём с той стороны, где точка ближе к середине
  const move=(from,to)=>{
    let k=0,best=1e9;
    from.forEach((o,i)=>{const dist=Math.abs(o.x-50); if(dist<best){best=dist;k=i}});
    to.push(from.splice(k,1)[0]);
    to.sort((a,b)=>a.y-b.y);
  };
  while(L.length-R.length>1) move(L,R);
  while(R.length-L.length>1) move(R,L);

  const n=Math.max(L.length,R.length);
  const H=Math.max(BODY+40, n*GAP+56);
  const dy=Math.max(0,(H-BODY)/2);
  const PY=o=>dy+PYraw(o);

  // подписи ставим против своей точки, потом раздвигаем до минимального зазора
  const layout=(arr)=>{
    const out=arr.map(o=>({o,ly:PY(o)}));
    for(let i=1;i<out.length;i++) out[i].ly=Math.max(out[i].ly,out[i-1].ly+GAP);
    const over=out.length?out[out.length-1].ly-(H-34):0;
    if(over>0) out.forEach(x=>x.ly-=over);
    for(let i=out.length-2;i>=0;i--) out[i].ly=Math.min(out[i].ly,out[i+1].ly-GAP);
    out.forEach(x=>{if(x.ly<38)x.ly=38});
    return out;
  };
  const marks=[...layout(L).map(x=>({...x,lx:LX})),...layout(R).map(x=>({...x,lx:RX}))];

  const body=`<g fill="var(--line)" transform="translate(0,${dy})">
    <circle cx="280" cy="50" r="32"/>
    <rect x="267" y="76" width="26" height="22" rx="10"/>
    <rect x="224" y="92" width="112" height="228" rx="30"/>
    <rect x="199" y="106" width="27" height="142" rx="13"/>
    <rect x="334" y="106" width="27" height="142" rx="13"/>
    <rect x="238" y="306" width="35" height="198" rx="17"/>
    <rect x="287" y="306" width="35" height="198" rx="17"/>
  </g>`;

  const dots=marks.map(({o,lx,ly})=>{
    const c=`var(--${o.st==='none'?'none':o.st})`;
    const bx=PX(o), by=PY(o);
    const mid=lx<280?lx+40:lx-40;   // короткое колено у подписи, дальше прямая к точке
    return `<g class="organ" data-sys="${o.sys}">
      <title>${esc(o.name)} — ${ST[o.st]}. ${esc(o.txt)}</title>
      <path d="M${mid} ${ly} L${(mid+bx)/2} ${ly} L${bx} ${by}" fill="none" stroke="${c}" stroke-width="1.5" opacity=".45"/>
      <circle cx="${bx}" cy="${by}" r="6" fill="${c}"/>
      <circle class="dot" cx="${lx}" cy="${ly}" r="20" fill="var(--card)" stroke="${c}" stroke-width="3"/>
      <text x="${lx}" y="${ly+7}" text-anchor="middle" style="font-size:18px">${o.ic}</text>
      <text x="${lx}" y="${ly+35}" text-anchor="middle" style="font-size:12.5px;fill:var(--ink);font-weight:600">${esc(o.sh||o.name)}</text>
    </g>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${body}${dots}</svg>`;
}
