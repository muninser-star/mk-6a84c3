      const intro=`<div class="card"><h2>Карта симптомов</h2>${sw}
        <p class="muted" style="margin:0">Чтобы добавить запись, скажите мне обычными словами:
        <i>«у Димы вчера болел живот на 6, дали Но-шпу, помогло»</i>. Интенсивность — от 1 до 10, можно не указывать.</p></div>`;

      let body="";
      if(!S.log.length){
        body=`<div class="card"><p style="margin:0">Журнал пока пуст. Ниже — за чем стоит следить: список собран из активных диагнозов.</p></div>`;
      }
      else if(symView==="ill"){
        const E=S.ep||[];
        const open=E.filter(x=>epOpen(x,today));
        body=E.length?`<div class="card"><h2>Болезни <span class="muted" style="text-transform:none">— ${E.length}</span></h2>
          <p class="muted" style="margin:-4px 0 10px">Эпизод — болезнь целиком, от первого признака до выздоровления.
          «Не закрыто» значит, что дата окончания не проставлена, а с начала прошло больше 30 дней: либо забыли закрыть, либо тянется до сих пор.</p>
          ${open.length?`<div class="verdict up">Не закрыто: ${open.length} — ${esc(open.map(x=>x.dx).join("; "))}</div>`:""}
          <div class="tw" style="margin-top:10px"><table><thead><tr><th>Диагноз</th><th>Начало</th><th>Конец</th><th>Длилось</th><th>Симптомы</th><th>Как протекало</th></tr></thead><tbody>
          ${E.map(x=>{const o=epOpen(x,today), dd=epDays(x,today);
            return `<tr class="eprow"${o?' style="background:var(--badbg)"':""}>
              <td><b>${esc(x.dx||"без диагноза")}</b>${x.ab?' <span class="tag2" style="background:var(--warnbg);color:var(--warn)">антибиотик</span>':""}</td>
              <td class="muted">${ru(x.d1)}</td>
              <td class="muted">${x.d2?ru(x.d2):(o?'<b style="color:var(--bad)">не закрыто</b>':'<span class="muted">—</span>')}</td>
              <td>${x.d2?human(dd):(o?`<span class="muted">идёт ${human(dd)}</span>`:'<span class="muted">—</span>')}</td>
              <td class="muted" style="font-size:13px">${esc(x.sym||"—")}</td>
              <td class="muted" style="font-size:13px;max-width:340px">${esc(x.t||"—")}</td></tr>`;}).join("")}
          </tbody></table></div></div>`
        :`<div class="card"><p style="margin:0">Эпизодов болезней пока нет.</p></div>`;
      }
      else if(symView==="strip"){
        body=`<div class="card"><h2>Когда просыпалось и когда затихало</h2>
          <p class="muted" style="margin:-4px 0 10px">Клетка — месяц, чем плотнее заливка, тем чаще. Пустая клетка — тишина.
          Полосы прокручиваются вбок, шкала у всех общая. Нажмите название — откроется симптом целиком.</p>
          <div class="stripwrap">
            ${seen.map(n=>`<div class="striprow"><div class="nm" data-sym="${esc(n)}">${esc(n)}</div><div>${monthStrip(byName[n],since)}</div></div>`).join("")}
            <div class="striprow" style="border:0"><div class="nm"></div><div>${monthAxis(since)}</div></div>
          </div></div>`;
      }
      else if(symView==="sum"){
        const rows=seen.map(n=>{
          const L=byName[n], a30=symAgg(L,d30,today), a90=symAgg(L,d90,today), prev=symAgg(L,d60,d30), c=catOf(n);
          let tr='<span class="muted">—</span>';
          if(a30.n||prev.n) tr=a30.n>prev.n?'<span class="trend-up">↑ чаще</span>':a30.n<prev.n?'<span class="trend-dn">↓ реже</span>':'<span class="muted">= так же</span>';
          return `<tr class="symlink" data-sym="${esc(n)}"><td><b>${esc(n)}</b>${c.red?' <span class="red-dot">▲</span>':""}
              <div class="muted" style="font-size:12px">${esc((organOf(c.sys)||{}).name||"")}</div></td>
            <td style="text-align:center">${a30.n||'<span class="muted">0</span>'}</td>
            <td style="text-align:center">${a30.avg!=null?`<span class="pill" style="background:${intColor(a30.avg)}">${String(a30.avg).replace(".",",")}</span>`:'<span class="muted">—</span>'}</td>
            <td style="text-align:center">${a90.n||'<span class="muted">0</span>'}</td>
            <td style="text-align:center">${tr}</td>
            <td class="muted">${L[0].d.split("-").reverse().join(".")}<br><span style="font-size:12px">${lastAgo(L[0].d,today)}</span></td></tr>`;
        }).join("");
        body=`<div class="card"><h2>Сводка — 30 и 90 дней</h2>
          <p class="muted" style="margin:-4px 0 10px">Тренд сравнивает последние 30 дней с предыдущими 30. Кружок — средняя интенсивность:
          <span class="pill" style="background:var(--ok)">1–3</span> терпимо,
          <span class="pill" style="background:var(--warn)">4–6</span> мешает,
          <span class="pill" style="background:var(--bad)">7–10</span> сильно.</p>
          <div class="tw"><table><thead><tr><th>Симптом</th><th style="text-align:center">30 дн.</th><th style="text-align:center">сила</th>
            <th style="text-align:center">90 дн.</th><th style="text-align:center">тренд</th><th>последний раз</th></tr></thead>
            <tbody>${rows}</tbody></table></div></div>`;
      }
      else if(symView==="log"){
        body=`<div class="card"><h2>Журнал <span class="muted" style="text-transform:none">— ${S.log.length}</span></h2>
          ${logLines(S.log)}</div>`;
      }
      else {
        const rows=seen.map(n=>{
          const L=byName[n], c=catOf(n);
          const meds=medsOf(L).slice(0,3).map(x=>x.name);
          return `<tr class="symlink" data-sym="${esc(n)}">
            <td><b>${esc(n)}</b>${c.red?' <span class="red-dot">▲</span>':""}${isRising(L,today)?' <span class="pill" style="background:var(--bad)">↑ участился</span>':""}
              <div class="muted" style="font-size:12px">${esc((organOf(c.sys)||{}).name||"")}</div></td>
            <td style="text-align:center"><b>${L.length}</b></td>
            <td class="muted">${L[0].d.split("-").reverse().join(".")}<br><span style="font-size:12px">${lastAgo(L[0].d,today)}</span></td>
            <td class="muted">${meds.length?esc(meds.join(", "))+(medsOf(L).length>3?" …":""):"—"}</td>
            <td style="color:var(--accent);font-weight:600">→</td></tr>`;
        }).join("");
        body=`<div class="card"><h2>Симптомы <span class="muted" style="text-transform:none">— ${seen.length}</span></h2>
          <p class="muted" style="margin:-4px 0 10px">Нажмите симптом — все записи по нему, лекарства и связанные диагнозы. ▲ — едут к врачу сразу.</p>
          <div class="tw"><table><thead><tr><th>Симптом</th><th style="text-align:center">записей</th><th>последний раз</th><th>чем лечили</th><th></th></tr></thead>
            <tbody>${rows}</tbody></table></div></div>`;
      }

      const watch=never.length?`<div class="card"><h2>Пока не отмечалось <span class="muted" style="text-transform:none">— ${never.length}</span></h2>
        <p class="muted" style="margin:-4px 0 10px">Собрано из активных диагнозов. ▲ — симптом, при котором едут к врачу сразу.</p>
        <div class="tw"><table><thead><tr><th>Симптом</th><th>Откуда</th><th>Зачем следить</th></tr></thead><tbody>
        ${[...never].sort((a,b)=>b.red-a.red).map(c=>`<tr class="symlink" data-sym="${esc(c.n)}"${c.red?' style="background:var(--badbg)"':""}>
          <td><b>${esc(c.n)}</b>${c.red?' <span class="red-dot">▲</span>':""}</td>
          <td class="muted">${esc(c.dx||"—")}</td><td class="muted">${esc(c.why||"—")}</td></tr>`).join("")}
        </tbody></table></div></div>`:"";

      m.innerHTML=intro+body+watch;
    }
  }

  else if(tab==="dx"){
    m.innerHTML=`<div class="card"><h2>Активные диагнозы</h2>
      <p class="muted" style="margin:-4px 0 10px">Нажмите на диагноз — откроются все анализы, исследования и приёмы по этой системе.</p>
      <div class="tw"><table><thead><tr><th>Диагноз</th><th>МКБ-10</th><th>С какого года</th><th>Состояние</th><th></th><th></th></tr></thead><tbody>
      ${d.diagnoses.filter(x=>!query||[x.n,x.c,x.s].some(v=>String(v).toLowerCase().includes(query.toLowerCase())))
        .map(x=>{const cnt=d.rec.filter(r=>x.lnk?r.lnk===x.lnk:r.sys===x.sys).length;
        const key=x.lnk||x.sys; return `<tr class="dxrow" data-sys="${esc(key||"")}"><td><b>${hl(x.n)}</b></td><td class="muted">${esc(x.c)}</td><td class="muted">${esc(x.y)}</td>
        <td>${hl(x.s)}</td><td><span class="pill s-${x.st}">${ST[x.st]}</span></td>
        <td class="muted" style="white-space:nowrap;text-align:right">${cnt?cnt+" записей →":"—"}</td></tr>`}).join("")}
      </tbody></table></div></div>
      <div class="card"><h2>Разрешившиеся</h2>
      <div class="tw"><table><thead><tr><th>Диагноз</th><th>Когда</th><th>Исход</th></tr></thead><tbody>
      ${d.resolved.map(x=>`<tr><td><b>${esc(x.n)}</b></td><td class="muted">${esc(x.y)}</td><td>${esc(x.s)}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  }

  // ── Анамнез: наследственность, риски, беременности, болезни, противоречия
  else if(tab==="anam"){
    const q=query.toLowerCase();
    const has=(...v)=>!query||v.some(x=>String(x||"").toLowerCase().includes(q));
    const LVL={bad:"очень высокий",warn:"умеренный",ok:"низкий"};
    const risks=(d.risks||[]).filter(x=>has(x.r,x.why));
    const eps=(d.episodes||[]).filter(x=>has(x.dx,x.sym,x.tx));
    const contra=(d.contra||[]).filter(x=>has(x.q,x.doc,x.ok));
    const nothing=!d.risks&&!d.family&&!d.episodes&&!d.contra&&!d.preg&&!d.vac;
    m.innerHTML=nothing?`<div class="card"><div class="empty">По этому человеку анамнез ещё не заполнен</div></div>`:`
      ${d.family?`<div class="card"><h2>Наследственность</h2>
        <div class="tw"><table><thead><tr><th>Кто</th><th>Что было</th></tr></thead><tbody>
        ${d.family.map(f=>`<tr><td style="white-space:nowrap"><b>${esc(f.who)}</b></td><td>${hl(f.what)}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}

      ${risks.length?`<div class="card"><h2>Предрасположенность — ${risks.length}</h2>
        <div class="muted" style="margin:-6px 0 10px">Оценка риска, а не диагнозы. Нажмите строку — откроется система</div>
        <div class="tw"><table><thead><tr><th>Риск</th><th>К чему</th><th>На чём основан</th></tr></thead><tbody>
        ${risks.map(x=>`<tr ${x.sys?`class="row" data-sys="${x.sys}"`:""}>
          <td><span class="pill s-${x.lvl}">${LVL[x.lvl]}</span></td>
          <td><b>${hl(x.r)}</b></td><td class="muted">${hl(x.why)}</td></tr>`).join("")}
        </tbody></table></div>
        ${d.risksNote?`<div class="note">${esc(d.risksNote)}</div>`:""}</div>`:""}

      ${d.preg?`<div class="card"><h2>Беременности и роды</h2>
        <div class="tw"><table><thead><tr><th></th><th>Учёт</th><th>Роды</th><th>Осложнения</th><th>Исход</th><th>Ребёнок</th></tr></thead><tbody>
        ${d.preg.map(p=>`<tr><td><b>${esc(p.n)}</b></td><td class="muted">${esc(p.uch)}</td><td>${esc(p.rody)}</td>
          <td class="muted">${esc(p.osl)}</td><td><b>${esc(p.ish)}</b></td><td class="muted">${esc(p.reb)}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}

      ${eps.length?`<div class="card"><h2>Дневник болезней — ${eps.length}</h2>
        ${d.episodesNote?`<div class="muted" style="margin:-6px 0 10px">${esc(d.episodesNote)}</div>`:""}
        <div class="tw"><table><thead><tr><th>Начало</th><th>Конец</th><th>Что было</th><th>Симптомы</th><th>Лечение</th></tr></thead><tbody>
        ${eps.map(x=>`<tr ${x.sys?`class="row" data-sys="${x.sys}"`:""}>
          <td class="muted" style="white-space:nowrap">${ru(x.d1)}</td>
          <td class="muted" style="white-space:nowrap">${esc(x.d2)}</td>
          <td><b${x.big?' style="color:var(--bad)"':''}>${hl(x.dx)}</b></td>
          <td class="muted">${hl(x.sym)}</td><td class="muted">${hl(x.tx)}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}

      ${d.vac||d.past?`<div class="card"><h2>Вакцинация и перенесённое</h2>
        ${d.vac?`<div class="tw"><table><thead><tr><th>Что</th><th>Когда</th><th></th></tr></thead><tbody>
        ${d.vac.map(v=>`<tr><td><b>${esc(v.v)}</b></td><td class="muted">${esc(v.d)}</td><td class="muted">${esc(v.note||"")}</td></tr>`).join("")}
        </tbody></table></div>`:""}
        ${d.past?`<h3>Перенесённое</h3><ul style="margin:0;padding-left:20px">
        ${d.past.map(p=>`<li style="margin-bottom:5px">${esc(p)}</li>`).join("")}</ul>`:""}</div>`:""}

      ${contra.length?`<div class="card"><h2>Противоречия в документах — ${contra.length}</h2>
        <div class="muted" style="margin:-6px 0 10px">Выявлены при сверке архива. Указано, какой версии верить</div>
        ${contra.map(x=>`<details ${x.lvl==="bad"?"open":""}>
          <summary><span class="pill s-${x.lvl}">${x.lvl==="bad"?"существенное":"уточнение"}</span> ${hl(x.q)}</summary>
          <div style="margin-top:8px"><b>Как в документах:</b> <span class="muted">${hl(x.doc)}</span></div>
          <div style="margin-top:6px"><b>Что верно:</b> ${hl(x.ok)}</div>
        </details>`).join("")}</div>`:""}`;
  }

  // ── Страница пункта «требует внимания»: обоснование → доказательства → записи
  else if(tab==="task"&&taskIdx!=null&&d.attention[taskIdx]){
    const a=d.attention[taskIdx], o=a.sys?organOf(a.sys):null;
    const all=a.sys?DATA[cur].rec.filter(r=>r.sys===a.sys).sort((x,y)=>y.d.localeCompare(x.d)):[];
    const ser=a.sys?d.series.filter(s=>s.sys===a.sys):[];
    const by=t=>all.filter(r=>r.t===t&&!r.op);
    const ops=all.filter(r=>r.op);
    const goto=(lab,n,id)=>`<div class="kpi ${n?"":"off"}" ${n?`data-goto="${id}"`:""}>
      <div class="lab">${lab}</div><div class="val">${n}</div></div>`;
    const blk=(l,ttl,id)=>l.length?`<div class="card"${id?` id="${id}"`:""}><h2>${ttl} <span class="muted" style="text-transform:none">— ${l.length}</span></h2>
      ${tableRows(l,{showSys:false})}</div>`:"";
    m.innerHTML=`
      <button class="back" data-t="home">← На главную</button>
      <div class="card">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
          <span class="pill s-${a.st}">${labelOf(a)}</span>
          <span class="muted">${a.p}-й по порядку · тянется ${esc(a.d)}</span>
        </div>
        <h2 style="font-size:19px;text-transform:none;color:var(--ink);letter-spacing:0">${esc(a.t)}</h2>
        <p style="margin:6px 0 0;font-size:15px">${esc(a.why||a.w)}</p>
      </div>

      ${a.facts?`<div class="card"><h2>На чём основано</h2>
        <ul style="margin:0;padding-left:20px">${a.facts.map(f=>`<li style="margin-bottom:6px">${esc(f)}</li>`).join("")}</ul>
      </div>`:""}

      ${a.fam&&d.family?`<div class="card"><h2>Семейный анамнез</h2>
        <div class="tw"><table><thead><tr><th>Кто</th><th>Что было</th></tr></thead><tbody>
        ${d.family.map(f=>`<tr><td style="white-space:nowrap"><b>${esc(f.who)}</b></td><td>${esc(f.what)}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}

      ${o?`<div class="card"><h2>Система: ${o.ic} ${esc(o.name)}</h2>
        <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
          <span class="pill s-${o.st}">${ST[o.st]}</span>
          <span style="flex:1;min-width:220px">${esc(o.txt)}</span>
        </div>
        ${all.length?`<div class="grid" style="margin-top:14px">
          ${goto("Записей",all.length,ops.length?"t-ops":by("lab").length?"t-lab":by("instr").length?"t-instr":"t-visit")}
          ${goto("Анализов",by("lab").length,"t-lab")}
          ${goto("Исследований",by("instr").length,"t-instr")}
          ${goto("Посещений",by("visit").length,"t-visit")}
        </div>`:`<div class="note" style="margin-top:12px">По этой системе в архиве нет ни одной записи — именно поэтому пункт и стоит в плане.</div>`}
      </div>`:""}

      ${ser.length?`<div class="card" id="t-ser"><h2>Динамика</h2>
        ${ser.map(s=>`<h3>${esc(s.name)}<span class="muted">, ${esc(s.unit)}</span></h3>${chart(s)}`).join("")}</div>`:""}
      ${blk(ops,"Операции и госпитализации","t-ops")}
      ${blk(by("lab"),"Анализы","t-lab")}
      ${blk(by("instr"),"Инструментальные исследования","t-instr")}
      ${blk(by("visit"),"Посещения врачей","t-visit")}`;
  }

  // ── Страница системы: график → анализы → исследования → посещения
  else if(tab==="sys"&&sysFilter){
    const o=organOf(sysFilter);
    const all=DATA[cur].rec.filter(r=>inSys(r,sysFilter)&&matches(r)).sort((a,b)=>b.d.localeCompare(a.d));
    const ser=d.series.filter(s=>isLnk(sysFilter)?false:s.sys===sysFilter);
    const ops=all.filter(r=>r.op);
    const by=t=>all.filter(r=>r.t===t&&!r.op);
    const goto=(lab,n,id)=>`<div class="kpi ${n?"":"off"}" ${n?`data-goto="${id}"`:""}>
      <div class="lab">${lab}</div><div class="val">${n}</div></div>`;
    const blk=(l,ttl,note,id)=>l.length?`<div class="card"${id?` id="${id}"`:""}>
        <h2>${ttl} <span class="muted" style="text-transform:none">— ${l.length}</span></h2>
        ${note?`<div class="muted" style="font-size:13px;margin:-6px 0 10px">${note}</div>`:""}
        ${tableRows(l,{showSys:false})}</div>`:"";
    // сравнение анализов по датам
    const labs=by("lab");
    const names=[...new Set(labs.map(r=>r.title))];
    const cmp=names.length&&labs.length>names.length?(()=>{
      const dates=[...new Set(labs.map(r=>r.d))].sort().reverse();
      return `<div class="card"><h2>Сравнение по периодам</h2>
        <div class="tw"><table><thead><tr><th>Показатель</th>${dates.map(x=>`<th>${ru(x)}</th>`).join("")}</tr></thead><tbody>
        ${names.map(nm=>`<tr><td><b>${esc(nm)}</b></td>${dates.map(dt=>{
          const c=labs.find(r=>r.title===nm&&r.d===dt);
          return `<td>${c?`<b style="color:var(--${c.st==='ok'?'ink':c.st})">${esc(c.v||"—")}</b>`:'<span class="muted">—</span>'}</td>`;
        }).join("")}</tr>`).join("")}
        </tbody></table></div></div>`;})():"";
    m.innerHTML=`
      <button class="back" data-t="home">← К карте органов</button>
      <div class="card">
        <h2>${o?o.ic+" "+esc(o.name):(LNK[sysFilter]?LNK[sysFilter].ic+" "+esc(LNK[sysFilter].name):esc(sysFilter))}</h2>
        <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
          <span class="pill s-${o?o.st:'none'}">${o?ST[o.st]:""}</span>
          <span style="flex:1;min-width:220px">${o?esc(o.txt):""}</span>
        </div>
        <div class="grid" style="margin-top:14px">
          ${goto("Всего записей",all.length,ops.length?"y-ops":by("lab").length?"y-lab":by("instr").length?"y-instr":"y-visit")}
          ${goto("Операций",ops.length,"y-ops")}
          ${goto("Анализов",by("lab").length,"y-lab")}
          ${goto("Исследований",by("instr").length,"y-instr")}
          ${goto("Посещений",by("visit").length,"y-visit")}
          ${goto("Рядов динамики",ser.length,"y-ser")}
          ${goto("Диагнозов",d.diagnoses.filter(x=>x.sys===sysFilter||x.lnk===sysFilter).length,"y-dx")}
          ${goto("Симптомов",symsFor(d,sysFilter).filter(x=>x.log.length).length,"y-sym")}
        </div>
      </div>
      ${blk(ops,"Операции и госпитализации","",'y-ops')}
      ${ser.length?`<div class="card" id="y-ser"><h2>Динамика</h2>
        ${ser.map(s=>`<h3>${esc(s.name)}<span class="muted">, ${esc(s.unit)}</span></h3>${chart(s)}`).join("")}</div>`:""}
      ${blk(by("lab"),"Анализы","Нажмите строку — история показателя и все значения этой сдачи",'y-lab')}
      ${cmp}
      ${blk(by("instr"),"Инструментальные исследования","",'y-instr')}
      ${blk(by("visit"),"Посещения врачей","",'y-visit')}
      ${all.length?"":`<div class="card"><div class="empty">По этой системе записей нет</div></div>`}
      ${(()=>{const SY=symsFor(d,sysFilter),withLog=SY.filter(x=>x.log.length);
        if(!SY.length) return "";
        const allLog=withLog.flatMap(x=>x.log);
        return `<div class="card" id="y-sym"><h2>Симптомы по этой системе <span class="muted" style="text-transform:none">— ${SY.length}</span></h2>
        <p class="muted" style="margin:-4px 0 10px">Что человек чувствовал при этих диагнозах. Нажмите симптом — все его записи и лекарства.</p>
        <div class="tw"><table><thead><tr><th>Симптом</th><th style="text-align:center">записей</th><th>последний раз</th><th>чем лечили</th><th></th></tr></thead><tbody>
        ${SY.map(x=>{const meds=medsOf(x.log).slice(0,3).map(v=>v.name);
          return `<tr class="symlink" data-sym="${esc(x.n)}"><td><b>${esc(x.n)}</b>${x.cat.red?' <span class="red-dot">▲</span>':""}</td>
          <td style="text-align:center">${x.log.length?`<b>${x.log.length}</b>`:'<span class="muted">—</span>'}</td>
          <td class="muted">${x.log.length?x.log[0].d.split("-").reverse().join("."):"не отмечалось"}</td>
          <td class="muted">${meds.length?esc(meds.join(", ")):"—"}</td>
          <td style="color:var(--accent);font-weight:600">→</td></tr>`}).join("")}
        </tbody></table></div>
        ${allLog.length?`<h3 style="margin-top:14px">Чем лечили по всей системе</h3>${medChips(allLog)}`:""}
        </div>`;})()}
      <div class="card" id="y-dx"><h2>Диагнозы по системе</h2>
        ${d.diagnoses.filter(x=>x.sys===sysFilter||x.lnk===sysFilter).length?
          `<div class="tw"><table><thead><tr><th>Диагноз</th><th>МКБ-10</th><th>С года</th><th>Состояние</th></tr></thead><tbody>
          ${d.diagnoses.filter(x=>x.sys===sysFilter||x.lnk===sysFilter).map(x=>`<tr class="dxrow" data-sys="${esc(x.sys||"")}"><td><b>${esc(x.n)}</b></td>
          <td class="muted">${esc(x.c)}</td><td class="muted">${esc(x.y)}</td><td>${esc(x.s)}</td></tr>`).join("")}
          </tbody></table></div>`:`<div class="muted">Нет активных диагнозов</div>`}
      </div>`;
  }

  else{
    const list=recs(tab==="all"?null:tab);
    const ser=d.series.filter(s=>!sysFilter||s.sys===sysFilter);
    const showCharts=(tab==="lab"||sysFilter)&&ser.length;
    const other=sysFilter?DATA[cur].rec.filter(r=>r.sys===sysFilter).length:0;
    const S=query?searchIn(cur):null;
    const others=query?Object.keys(DATA).filter(k=>k!==cur).map(k=>({k,n:searchIn(k).total})).filter(x=>x.n):[];
    const tile=(lab,n,id)=>`<div class="kpi ${n?"":"off"}" ${n?`data-goto="${id}"`:""}>
      <div class="lab">${lab}</div><div class="val">${n}</div></div>`;
    m.innerHTML=`
      ${query?`<div class="card"><h2>Найдено по запросу «${esc(query)}» — ${S.total}</h2>
        <div class="muted" style="margin:-6px 0 12px">Ищет в любом месте записи: в названии, в результате, в значении, в норме,
        во враче, в дате, а также в диагнозах, планах, обоснованиях и семейном анамнезе. Нажмите цифру — прокрутит к разделу.</div>
        <div class="grid">
          ${tile("Записей",S.rec.length,"s-rec")}
          ${tile("Диагнозов",S.dx.length,"s-dx")}
          ${tile("Разрешившихся",S.rs.length,"s-rs")}
          ${tile("В планах",S.at.length,"s-at")}
          ${tile("Систем",S.org.length,"s-org")}
          ${tile("Рядов динамики",S.ser.length,"s-ser")}
          ${tile("В карточке",S.kpi.length,"s-kpi")}
          ${tile("Родня",S.fam.length,"s-fam")}
          ${tile("Не сдавалось",S.nev.length,"s-nev")}
        </div>
        ${S.org.length?`<div style="margin-top:12px">${S.org.map(o=>`<span class="tag" data-sys="${o.sys}"
          style="cursor:pointer;font-size:13px;padding:4px 10px">${o.ic} ${esc(o.name)} →</span>`).join(" ")}</div>`:""}
        ${others.length?`<div class="note" style="margin-top:12px">Это же слово есть у других:
          ${others.map(x=>`<span class="tag" data-w="${x.k}" style="cursor:pointer;font-size:13px;padding:4px 10px">${DATA[x.k].short} — ${x.n} →</span>`).join(" ")}</div>`:""}
      </div>
      ${S.dx.length?`<div class="card" id="s-dx"><h2>Диагнозы — ${S.dx.length}</h2><div class="tw"><table>
        <thead><tr><th>Диагноз</th><th>МКБ-10</th><th>С года</th><th>Состояние</th><th></th></tr></thead><tbody>
        ${S.dx.map(x=>`<tr ${x.sys?`class="row" data-sys="${x.sys}"`:""}><td><b>${hl(x.n)}</b></td>
          <td class="muted">${hl(x.c)}</td><td class="muted">${hl(x.y)}</td><td>${hl(x.s)}</td>
          <td><span class="pill s-${x.st}">${ST[x.st]}</span></td></tr>`).join("")}
        </tbody></table></div></div>`:""}
      ${S.rs.length?`<div class="card" id="s-rs"><h2>Разрешившиеся — ${S.rs.length}</h2><div class="tw"><table>
        <thead><tr><th>Диагноз</th><th>Когда</th><th>Исход</th></tr></thead><tbody>
        ${S.rs.map(x=>`<tr><td><b>${hl(x.n)}</b></td><td class="muted">${hl(x.y)}</td><td>${hl(x.s)}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}
      ${S.at.length?`<div class="card" id="s-at"><h2>Требует внимания — ${S.at.length}</h2><div class="tw"><table>
        <thead><tr><th>#</th><th>Что</th><th>Почему</th><th>Давность</th></tr></thead><tbody>
        ${S.at.map(x=>`<tr class="row" data-task="${d.attention.indexOf(x.a)}"><td><span class="pill s-${x.a.st}">${x.a.p}</span></td>
          <td><b>${hl(x.a.t)}</b>${x.line?`<div class="hitline">${hl(x.line)}</div>`:""}</td>
          <td class="muted">${hl(x.a.w)}</td><td class="muted">${hl(x.a.d)}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}
      ${S.org.length?`<div class="card" id="s-org"><h2>Системы — ${S.org.length}</h2>
        <div class="olist" style="max-height:none">${S.org.map(o=>`
          <div class="orow" data-sys="${o.sys}"><span class="ic">${o.ic}</span>
          <span class="dotmark" style="background:var(--${o.st==='none'?'none':o.st})"></span>
          <span style="flex:1"><b>${hl(o.name)}</b><span>${hl(o.txt)}</span></span></div>`).join("")}</div></div>`:""}
      ${S.kpi.length?`<div class="card" id="s-kpi"><h2>В карточке — ${S.kpi.length}</h2>
        <div class="grid">${S.kpi.map(k=>`<div class="kpi"><div class="lab">${hl(k.lab)}</div>
        <div class="val" ${k.st?`style="color:var(--${k.st})"`:""}>${hl(k.val)}</div>
        <div class="sub">${hl(k.sub||"")}</div></div>`).join("")}</div></div>`:""}
      ${S.fam.length?`<div class="card" id="s-fam"><h2>Семейный анамнез — ${S.fam.length}</h2><div class="tw"><table>
        <thead><tr><th>Кто</th><th>Что было</th></tr></thead><tbody>
        ${S.fam.map(f=>`<tr><td style="white-space:nowrap"><b>${hl(f.who)}</b></td><td>${hl(f.what)}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}
      ${S.nev.length?`<div class="card" id="s-nev"><h2>Никогда не сдавалось — ${S.nev.length}</h2>
        <div>${S.nev.map(n=>`<span class="tag" style="font-size:13px;padding:4px 10px">${hl(n)}</span>`).join(" ")}</div></div>`:""}`:""}
      <div class="card" id="s-rec">
        <h2>${query?"Записи":TABS.find(t=>t[0]===tab)[1]}${sysFilter?" · "+esc(sysName(sysFilter)):""} <span class="muted" style="text-transform:none">— ${list.length}</span></h2>
        ${filterBar()}
        ${tableRows(list,{showType:tab==="all"})}
        ${(!list.length&&sysFilter&&other)?`<div style="text-align:center;margin-top:10px">
          <button class="gobtn" style="max-width:320px" data-sys="${sysFilter}">Показать все ${other} записей системы →</button></div>`:""}
      </div>
      ${showCharts?`<div class="card" id="s-ser"><h2>Динамика</h2>
        ${ser.map(s=>`<h3>${esc(s.name)}<span class="muted">, ${esc(s.unit)}</span></h3>${chart(s)}`).join("")}
      </div>`:""}
      ${(query&&S.ser.length&&!showCharts)?`<div class="card" id="s-ser"><h2>Ряды динамики — ${S.ser.length}</h2>
        ${S.ser.map(x=>`<h3>${hl(x.name)}<span class="muted">, ${esc(x.unit)}</span></h3>${chart(x)}`).join("")}
      </div>`:""}`;
  }
}

// ── События
const modal=document.getElementById("modal");
const closeModal=()=>modal.classList.remove("on");
const toSys=(s)=>{sysFilter=s;tab="sys";symSel=null;medSel=null;render();window.scrollTo({top:0,behavior:"smooth"})};

document.addEventListener("click",e=>{
  const gz=e.target.closest("[data-goto]");
  if(gz&&gz.dataset.goto){
    const el=document.getElementById(gz.dataset.goto);
    if(el){
      // отступ считаем по реальной высоте липкой шапки — она разная на телефоне и на мониторе
      const pad=(document.querySelector("header")?.offsetHeight||0)+(document.querySelector("nav")?.offsetHeight||0)+12;
      el.style.scrollMarginTop=pad+"px";
      el.scrollIntoView({behavior:"smooth",block:"start"});
      el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1400);
    }
    return;
  }
  if(e.target.closest("[data-close]")){
    const f=e.target.closest("[data-f]");
    closeModal();
    if(f&&f.dataset.f)toSys(f.dataset.f);
    return;
  }
  if(e.target===modal){closeModal();return}

  const w=e.target.closest("[data-w]"); if(w){cur=w.dataset.w;sysFilter=null;symSel=null;medSel=null;symView="list";tab="home";closeModal();render();return}
  const sv=e.target.closest("[data-symview]"); if(sv){symView=sv.dataset.symview;symSel=null;medSel=null;render();window.scrollTo({top:0});return}
  const mw=e.target.closest("[data-medwho]");
  if(mw){cur=mw.dataset.medwho;tab="sym";symSel=null;sysFilter=null;closeModal();render();window.scrollTo({top:0});return}
  const md=e.target.closest("[data-med]"); if(md){medSel=md.dataset.med||null;symSel=null;tab="sym";sysFilter=null;render();window.scrollTo({top:0});return}
  const sm=e.target.closest("[data-sym]"); if(sm){symSel=sm.dataset.sym||null;medSel=null;tab="sym";sysFilter=null;render();window.scrollTo({top:0});return}
  const t=e.target.closest("[data-t]"); if(t){tab=t.dataset.t;sysFilter=null;symSel=null;medSel=null;render();window.scrollTo({top:0});return}
  const r=e.target.closest("[data-rec]"); if(r){openRec(+r.dataset.rec);return}
  const k=e.target.closest("[data-task]"); if(k){taskIdx=+k.dataset.task;tab="task";sysFilter=null;
    render();window.scrollTo({top:0,behavior:"smooth"});return}
  const g=e.target.closest("[data-sys]"); if(g){toSys(g.dataset.sys);return}
  const f=e.target.closest("[data-f]"); if(f){sysFilter=f.dataset.f||null;render();return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
document.getElementById("q").addEventListener("input",e=>{
  query=e.target.value.trim();
  if(query){sysFilter=null;tab="all";}   // поиск всегда по всему архиву
  render();
});
render();
</script>
</body>
</html>
